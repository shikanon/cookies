openapi: 3.1.0
info:
  title: Cookies Connector API
  version: 1.0.0
  description: Read-only, evidence-backed advertising data facts and synchronization status.
servers:
  - url: /
security:
  - cookiesAuth: []
paths:
  /api/connector/v1/accounts:
    get:
      operationId: listOrganizationConnectorAccounts
      summary: List Organization-owned Connector accounts
      responses:
        '200':
          description: Account metadata without raw platform IDs.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/PlatformAccount'}}
    post:
      operationId: registerOrganizationConnectorAccount
      summary: Register an Organization-owned Ocean Engine account
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterAccountRequest'}
      responses:
        '201':
          description: Safe local account metadata.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlatformAccount'}
  /api/connector/v1/accounts/{account_ref}/session:
    parameters:
      - $ref: '#/components/parameters/AccountRef'
    get:
      operationId: getOrganizationConnectorAccountSession
      summary: Read safe encrypted-session status
      responses:
        '200':
          description: Session status without credential material.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountSession'}
    put:
      operationId: updateOrganizationConnectorAccountSession
      summary: Encrypt and replace a read-only account session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session, expected_version]
              properties:
                session: {type: string, minLength: 1, maxLength: 16384, writeOnly: true}
                expected_version: {type: integer, minimum: 0}
              additionalProperties: false
      responses:
        '200':
          description: Safe session status.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountSession'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/connector/v1/accounts/{account_ref}/verify:
    parameters:
      - $ref: '#/components/parameters/AccountRef'
    post:
      operationId: verifyOrganizationConnectorAccount
      summary: Verify an Organization-owned account with a read-only request
      responses:
        '200':
          description: Verified safe local account metadata.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlatformAccount'}
  /api/connector/v1/accounts/{account_ref}/revoke:
    parameters:
      - $ref: '#/components/parameters/AccountRef'
    post:
      operationId: revokeOrganizationConnectorAccount
      summary: Revoke an Organization-owned local connection
      responses:
        '200':
          description: Revoked safe local account metadata.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlatformAccount'}
  /api/connector/v1/accounts/{account_ref}/syncs:
    parameters:
      - $ref: '#/components/parameters/AccountRef'
    post:
      operationId: startOrganizationConnectorSync
      summary: Start an Organization-scoped read-only synchronization
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 191}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StartSyncRequest'}
      responses:
        '202':
          description: Read-only synchronization accepted for background execution.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SyncResult'}
  /api/connector/v1/accounts/{account_ref}/syncs/{sync_id}:
    parameters:
      - $ref: '#/components/parameters/AccountRef'
      - $ref: '#/components/parameters/SyncID'
    get:
      operationId: getOrganizationConnectorSync
      summary: Get Organization-scoped synchronization status
      responses:
        '200':
          description: Synchronization status.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SyncStatus'}
  /api/connector/v1/accounts/{account_ref}/canonical-snapshots:
    parameters:
      - $ref: '#/components/parameters/AccountRef'
    get:
      operationId: getOrganizationConnectorPointInTimeSnapshot
      summary: Read an Organization-scoped Canonical Snapshot
      parameters:
        - name: prediction_cutoff
          in: query
          required: true
          schema: {type: string, format: date-time}
        - name: object_ref
          in: query
          schema: {type: string, minLength: 1}
        - name: window_start
          in: query
          schema: {type: string, format: date-time}
        - name: window_end
          in: query
          schema: {type: string, format: date-time}
      responses:
        '200':
          description: Versioned Canonical Snapshot.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PointInTimeSnapshot'}
  /api/connector/v1/projects/{project_id}/accounts/{account_ref}/syncs:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/AccountRef'
    post:
      operationId: startConnectorSync
      summary: Start a read-only connector synchronization
      description: Starts synchronization for an authorized web_api session. The request contains no Cookie, CSRF token, or credential material.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 191}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartSyncRequest'
      responses:
        '200':
          description: Synchronous read-only synchronization completed or replayed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResult'
        '400':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/connector/v1/projects/{project_id}/accounts/{account_ref}/syncs/{sync_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/AccountRef'
      - $ref: '#/components/parameters/SyncID'
    get:
      operationId: getConnectorSync
      summary: Get synchronization status
      responses:
        '200':
          description: Synchronization status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncStatus'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/connector/v1/projects/{project_id}/accounts:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    get:
      operationId: listProjectConnectorAccounts
      summary: List safe local Connector account metadata
      responses:
        '200':
          description: Account metadata without raw platform IDs.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/PlatformAccount'}}
    post:
      operationId: registerProjectConnectorAccount
      summary: Register an Ocean Engine account for read-only verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [external_id]
              properties:
                external_id: {type: string, minLength: 1, maxLength: 191, writeOnly: true}
                display_label: {type: string, maxLength: 255}
              additionalProperties: false
      responses:
        '201':
          description: Safe local account metadata.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlatformAccount'}
  /api/connector/v1/projects/{project_id}/accounts:claim:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    post:
      operationId: claimOrganizationConnectorAccountForProject
      summary: Move one legacy Organization account into the current Project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account_ref]
              properties:
                account_ref: {type: string, pattern: '^oeacct_'}
              additionalProperties: false
      responses:
        '200':
          description: Project-owned account with its existing session and calibration data.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlatformAccount'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/connector/v1/projects/{project_id}/accounts/{account_ref}/session:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/AccountRef'
    get:
      operationId: getProjectConnectorAccountSession
      summary: Read safe session status for a Project account
      responses:
        '200':
          description: Session status without credential material.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountSession'}
    put:
      operationId: updateProjectConnectorAccountSession
      summary: Encrypt and replace a Project account session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session, expected_version]
              properties:
                session: {type: string, minLength: 1, maxLength: 16384, writeOnly: true}
                expected_version: {type: integer, minimum: 0}
              additionalProperties: false
      responses:
        '200':
          description: Safe session status.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountSession'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/connector/v1/projects/{project_id}/accounts/{account_ref}/launch-batch-calibration:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/AccountRef'
    get:
      operationId: getProjectConnectorLaunchBatchCalibration
      summary: Read the latest launch-batch calibration for a Project account
      responses:
        '200':
          description: Versioned calibration snapshot.
          content:
            application/json:
              schema: {type: object}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/connector/v1/projects/{project_id}/accounts/{account_ref}/platform-objects:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/AccountRef'
    get:
      operationId: listProjectConnectorPlatformObjects
      summary: List imported Ocean Engine objects granted to the Project
      parameters:
        - name: object_kind
          in: query
          schema: {$ref: '#/components/schemas/PlatformObjectKind'}
        - name: status
          in: query
          schema: {type: string, enum: [active, unavailable]}
        - name: q
          in: query
          schema: {type: string, maxLength: 255}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Project-authorized object page.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/PlatformObject'}}
                  next_cursor: {type: string}
  /api/connector/v1/projects/{project_id}/accounts/{account_ref}/verify:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/AccountRef'
    post:
      operationId: verifyProjectConnectorAccount
      summary: Verify an account through an allow-listed read-only request
      responses:
        '200':
          description: Verified safe local account metadata.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlatformAccount'}
  /api/connector/v1/projects/{project_id}/accounts/{account_ref}/revoke:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/AccountRef'
    post:
      operationId: revokeProjectConnectorAccount
      summary: Revoke the local connection without a remote platform write
      responses:
        '200':
          description: Revoked safe local account metadata.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlatformAccount'}
  /api/connector/v1/projects/{project_id}/accounts/{account_ref}/canonical-snapshots:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/AccountRef'
    get:
      operationId: getConnectorPointInTimeSnapshot
      summary: Read a permission-trimmed point-in-time Canonical Snapshot
      description: Returns only facts known at prediction_cutoff. Raw evidence and session material are never returned.
      parameters:
        - name: prediction_cutoff
          in: query
          required: true
          schema: {type: string, format: date-time}
        - name: object_ref
          in: query
          schema: {type: string, minLength: 1}
        - name: window_start
          in: query
          schema: {type: string, format: date-time}
        - name: window_end
          in: query
          schema: {type: string, format: date-time}
      responses:
        '200':
          description: Versioned Canonical Snapshot.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PointInTimeSnapshot'}
        '400': {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    cookiesAuth:
      type: http
      scheme: bearer
      bearerFormat: session
  parameters:
    ProjectID:
      name: project_id
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 255}
    AccountRef:
      name: account_ref
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 255}
    SyncID:
      name: sync_id
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 255}
    ObjectKind:
      name: object_kind
      in: query
      schema: {$ref: '#/components/schemas/ObjectKind'}
    Quality:
      name: quality
      in: query
      schema: {$ref: '#/components/schemas/Quality'}
    Cursor:
      name: cursor
      in: query
      schema: {type: string, maxLength: 2048}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 500}
  schemas:
    PlatformObjectKind:
      type: string
      enum: [image_material, product_image, video_material, aweme_photo_material, marketing_product, orange_landing_page, optimization_target, conversion_event_asset, industry_category, brand, authorized_identity]
    PlatformObject:
      type: object
      required: [id, organization_id, account_id, object_kind, platform_object_id, display_name, status, metadata, observed_at, version, project_granted]
      properties:
        id: {type: string}
        organization_id: {type: string}
        account_id: {type: string}
        object_kind: {$ref: '#/components/schemas/PlatformObjectKind'}
        platform_object_id: {type: string, pattern: '^[0-9]+$'}
        display_name: {type: string}
        status: {type: string, enum: [active, unavailable]}
        metadata: {type: object, additionalProperties: true}
        observed_at: {type: string, format: date-time}
        version: {type: integer, minimum: 1}
        project_granted: {type: boolean, const: true}
    ObjectKind:
      type: string
      enum: [account, campaign, project, product, promotion, material]
    Quality:
      type: string
      enum: [healthy, partial, delayed, blocked, mapping_incomplete]
    ConnectorEnvelope:
      type: object
      required: [schema_version, source, platform, connection_type, account, quality]
      properties:
        schema_version: {type: string, const: oceanengine-connector/v1}
        source: {type: string, const: connector}
        platform: {type: string, const: ocean_engine}
        connection_type: {type: string, const: web_api}
        account: {$ref: '#/components/schemas/AccountRef'}
        quality: {$ref: '#/components/schemas/Quality'}
        quality_note: {type: string}
        evidence:
          type: array
          items: {$ref: '#/components/schemas/EvidenceRef'}
      additionalProperties: false
    AccountRef:
      type: object
      required: [organization_id, source_ref]
      properties:
        organization_id: {type: string, minLength: 1}
        project_id: {type: string, minLength: 1, description: Project scope for Project-owned accounts.}
        source_ref: {type: string, minLength: 1, description: Local or anonymized Connector reference.}
      additionalProperties: false
    PlatformAccount:
      type: object
      required: [id, organization_id, platform, status, credential_ref_present]
      properties:
        id: {type: string, minLength: 1}
        organization_id: {type: string, minLength: 1}
        platform: {type: string, const: ocean_engine}
        project_id: {type: string, minLength: 1, description: Present for Project-owned connections.}
        display_label: {type: string}
        status: {type: string, enum: [pending, verified, revoked, blocked]}
        verified_at: {type: string, format: date-time}
        last_checked_at: {type: string, format: date-time}
        connection_type: {type: string, const: web_api}
        credential_ref_present: {type: boolean}
      additionalProperties: false
    RegisterAccountRequest:
      type: object
      required: [external_id]
      properties:
        external_id: {type: string, minLength: 1, maxLength: 191, writeOnly: true}
        display_label: {type: string, maxLength: 255}
      additionalProperties: false
    AccountSession:
      type: object
      required: [id, organization_id, account_id, status, credential_ref_present, version, created_at, updated_at]
      properties:
        id: {type: string, minLength: 1}
        organization_id: {type: string, minLength: 1}
        account_id: {type: string, minLength: 1}
        status: {type: string, enum: [unverified, ready, auth_required, disabled]}
        credential_ref_present: {type: boolean}
        last_verified_at: {type: string, format: date-time}
        version: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
      additionalProperties: false
    EvidenceRef:
      type: object
      required: [batch_id, endpoint, request_hash, response_hash, observed_at, schema_version]
      properties:
        batch_id: {type: string, minLength: 1}
        endpoint: {type: string, minLength: 1}
        request_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
        response_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
        observed_at: {type: string, format: date-time}
        schema_version: {type: string, minLength: 1}
      additionalProperties: false
    ObjectSnapshot:
      allOf:
        - $ref: '#/components/schemas/ConnectorEnvelope'
        - type: object
          required: [kind, external_id]
          properties:
            kind: {$ref: '#/components/schemas/ObjectKind'}
            external_id: {type: string, minLength: 1}
            parent_id: {type: string}
            name_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
            aliases: {type: array, items: {type: string}}
    MetricWindow:
      allOf:
        - $ref: '#/components/schemas/ConnectorEnvelope'
        - type: object
          required: [kind, external_id, start, end, granularity, metric_schema, attribution_window, counts]
          properties:
            kind: {$ref: '#/components/schemas/ObjectKind'}
            external_id: {type: string, minLength: 1}
            parent_id: {type: string}
            start: {type: string, format: date-time}
            end: {type: string, format: date-time}
            granularity: {type: string, minLength: 1}
            metric_schema: {type: string, minLength: 1}
            attribution_window: {type: string, minLength: 1}
            counts: {$ref: '#/components/schemas/MetricCounts'}
    MetricCounts:
      type: object
      required: [spend_cents, impressions, clicks, conversions, deep_conversions]
      properties:
        spend_cents: {type: integer}
        impressions: {type: integer, minimum: 0}
        clicks: {type: integer, minimum: 0}
        conversions: {type: integer, minimum: 0}
        deep_conversions: {type: integer, minimum: 0}
      additionalProperties: false
    SnapshotPage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ObjectSnapshot'}}
        next_cursor: {type: string}
      additionalProperties: false
    MetricPage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/MetricWindow'}}
        next_cursor: {type: string}
      additionalProperties: false
    StartSyncRequest:
      type: object
      required: [start, end]
      properties:
        start: {type: string, format: date-time}
        end: {type: string, format: date-time}
        time_zone: {type: string, minLength: 1}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        sync_mode:
          type: string
          enum: [full, metrics_only]
          default: full
          description: Full reads objects and metrics. Metrics-only reads recent metric windows and conversion revisions.
        object_kinds:
          type: array
          minItems: 1
          uniqueItems: true
          items: {$ref: '#/components/schemas/ObjectKind'}
        force: {type: boolean, default: false}
      additionalProperties: false
    SyncStatus:
      type: object
      required: [id, organization_id, account_ref, status, started_at, attempt]
      properties:
        id: {type: string, minLength: 1}
        organization_id: {type: string, minLength: 1}
        project_id: {type: string, description: Empty for Organization-scoped synchronization.}
        account_ref: {type: string, minLength: 1, description: Local or anonymized Connector account reference.}
        status: {type: string, enum: [queued, running, completed, failed]}
        cursor: {type: string}
        attempt: {type: integer, minimum: 1}
        started_at: {type: string, format: date-time}
        completed_at: {type: string, format: date-time}
      additionalProperties: false
    SyncResult:
      type: object
      required: [run_id, replayed, object_count, metric_count]
      properties:
        run_id: {type: string, minLength: 1}
        replayed: {type: boolean}
        object_count: {type: integer, minimum: 0}
        metric_count: {type: integer, minimum: 0}
      additionalProperties: false
    FactHeader:
      type: object
      required: [organization_id, source_system, source_ref, ingest_run_id, schema_version, payload_hash, collected_at, available_at, data_through, valid_from, quality_status, evidence_ref]
      properties:
        organization_id: {type: string, minLength: 1}
        project_id: {type: string, description: Empty for Organization-scoped facts.}
        source_system: {type: string, const: ocean_engine}
        source_ref: {type: string, minLength: 1}
        ingest_run_id: {type: string, minLength: 1}
        schema_version: {type: string, minLength: 1}
        payload_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
        collected_at: {type: string, format: date-time}
        available_at: {type: string, format: date-time}
        data_through: {type: string, format: date-time}
        valid_from: {type: string, format: date-time}
        valid_to: {type: string, format: date-time}
        quality_status: {type: string, enum: [accept, reject, quarantine, warning]}
        evidence_ref: {type: string, minLength: 1}
      additionalProperties: true
    PointInTimeSnapshot:
      type: object
      required: [dataset_version, prediction_cutoff, objects, configurations, configuration_changes, metric_windows, material_bindings, material_metric_windows, platform_status_events, conversion_revisions]
      properties:
        dataset_version: {type: string, const: connector-oceanengine-point-in-time-v1}
        prediction_cutoff: {type: string, format: date-time}
        objects: {type: array, items: {$ref: '#/components/schemas/FactHeader'}}
        configurations: {type: array, items: {$ref: '#/components/schemas/FactHeader'}}
        configuration_changes: {type: array, items: {$ref: '#/components/schemas/FactHeader'}}
        metric_windows: {type: array, items: {$ref: '#/components/schemas/MetricFact'}}
        material_bindings: {type: array, items: {$ref: '#/components/schemas/FactHeader'}}
        material_metric_windows: {type: array, items: {$ref: '#/components/schemas/MetricFact'}}
        platform_status_events: {type: array, items: {$ref: '#/components/schemas/FactHeader'}}
        platform_diagnoses: {type: array, items: {$ref: '#/components/schemas/FactHeader'}}
        conversion_revisions: {type: array, items: {$ref: '#/components/schemas/MetricFact'}}
      additionalProperties: false
    MetricFact:
      allOf:
        - $ref: '#/components/schemas/FactHeader'
        - type: object
          required: [object_ref, window_start, window_end, granularity, time_zone, attribution_window, metric_definition_version, currency, amount_unit, metrics]
          properties:
            object_ref: {type: string, minLength: 1}
            window_start: {type: string, format: date-time}
            window_end: {type: string, format: date-time}
            granularity: {type: string, minLength: 1}
            time_zone: {type: string, minLength: 1}
            attribution_window: {type: string, minLength: 1}
            metric_definition_version: {type: string, minLength: 1}
            currency: {type: string, pattern: '^[A-Z]{3}$'}
            amount_unit: {type: string, minLength: 1}
            metrics:
              type: object
              additionalProperties: {type: integer}
            quality_issues:
              type: array
              items:
                type: object
                required: [disposition, code]
                properties:
                  disposition: {type: string, enum: [reject, quarantine, warning]}
                  code: {type: string, minLength: 1}
                additionalProperties: false
    Problem:
      type: object
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
        request_id: {type: string}
      additionalProperties: false
  responses:
    Problem:
      description: Request failed.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Problem'}
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Problem'}
    Conflict:
      description: Conflicting synchronization request.
