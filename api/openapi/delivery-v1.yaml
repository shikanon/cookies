        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunObservatoryRequest' }
      responses:
        '201':
          description: Immutable observatory run.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryObservatoryRun' }
        '200':
          description: Deterministic replay of an existing run.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryObservatoryRun' }
        '409': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /api/delivery/v1/projects/{project_id}/observatory-runs:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    get:
      operationId: listDeliveryObservatoryRuns
      summary: List immutable Mock/Replay observatory runs
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Project-scoped runs ordered newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/DeliveryObservatoryRun' } }
        default: { $ref: '#/components/responses/Problem' }
  /api/delivery/v1/projects/{project_id}/observatory-runs/{run_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - name: run_id
        in: path
        required: true
