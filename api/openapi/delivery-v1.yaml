      type: string
      description: Deterministic mock fixture selected at execution creation; it never implies a real platform write.
      enum: [success, failed, partial, result_unknown]
    ExecutionStatus:
      type: string
      enum: [queued, validating_approval, executing, verifying, succeeded, failed, partial, result_unknown, cancelled]
    ExecutionStepStatus:
      type: string
      enum: [pending, running, succeeded, failed, result_unknown, skipped]
