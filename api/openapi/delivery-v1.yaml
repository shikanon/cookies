        manifest_binding: { $ref: '#/components/schemas/CalibrationManifestBinding' }
        input_snapshot_hash: { $ref: '#/components/schemas/CanonicalHash' }
        stable_seed: { type: string }
        prediction_horizon: { type: string, pattern: '^P([1-9]|[12][0-9]|3[01])D$' }
        sample_count: { type: integer, minimum: 100, maximum: 100000 }
