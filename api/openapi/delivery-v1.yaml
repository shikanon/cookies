      operationId: getDeliveryObservatoryRun
      summary: Get an immutable run with evidence and field diffs
      responses:
        '200':
          description: Exact stored run.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryObservatoryRun' }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /api/delivery/v1/projects/{project_id}/observatory-runs/{run_id}/feedback:
