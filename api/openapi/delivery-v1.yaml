        scenario: { $ref: '#/components/schemas/ExecutionScenario' }
        idempotency_key: { type: string, minLength: 1, maxLength: 255 }
        request_hash:
          allOf:
            - $ref: '#/components/schemas/CanonicalHash'
          description: SHA-256 of the canonical execution request defined on POST :execute.
        executed_by: { type: string }
        started_at:
          oneOf:
            - { type: string, format: date-time }
            - { type: 'null' }
        completed_at:
          oneOf:
            - { type: string, format: date-time }
            - { type: 'null' }
        retry_allowed:
          type: boolean
          const: false
          description: Terminal deterministic fixtures are not retried. A same-key replay returns the existing Execution; result_unknown must be queried and reconciled before any new controlled action.
        recovery_action: { $ref: '#/components/schemas/RecoveryAction' }
        recovery_reason: { type: string }
        compensation_candidates:
          type: array
          description: Candidate compensations for a partial result; they are never applied automatically.
          items: { type: string }
        steps:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/DeliveryExecutionStep' }
    DeliveryExecutionStep:
      type: object
      additionalProperties: false
      required: [id, sequence, action, status, attempt, effect, outcome_summary, evidence_ref, started_at, completed_at, version]
      properties:
        id: { type: string }
        sequence: { type: integer, minimum: 1 }
        action: { type: string }
        status: { $ref: '#/components/schemas/ExecutionStepStatus' }
        attempt: { type: integer, minimum: 0 }
        effect:
          type: string
          enum: [confirmed_applied, confirmed_not_applied, unknown, none]
          description: Known target effect. A failed step means this effect was definitely not produced; an unknown result does not make that claim.
        outcome_summary: { type: string }
        evidence_ref: { type: string }
        started_at:
          oneOf:
            - { type: string, format: date-time }
            - { type: 'null' }
        completed_at:
          oneOf:
            - { type: string, format: date-time }
            - { type: 'null' }
        version: { type: integer, minimum: 1 }
    ExecutionEvidence:
      type: object
      additionalProperties: false
      required: [id, organization_id, project_id, execution_id, summary, mode, reversible, source, scenario, references, created_at]
      properties:
        id: { type: string }
        organization_id: { type: string }
        project_id: { type: string }
        execution_id: { type: string }
        summary: { type: string }
        mode: { type: string, const: local_simulation }
        reversible: { type: boolean }
        source: { type: string, const: mock }
        scenario: { $ref: '#/components/schemas/ExecutionScenario' }
        references:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time }
    OutcomeSimulationScenario:
      type: string
      enum: [steady, cost_pressure, under_delivery, creative_fatigue, tracking_anomaly, review_rejected]
    SimulationProbabilityPrior:
      type: object
      additionalProperties: false
      required: [value, source, unit, scope, uncertainty]
      properties:
        value: { type: number, minimum: 0, maximum: 1 }
        source: { type: string, minLength: 1 }
        unit: { type: string, const: probability }
        scope: { type: array, minItems: 1, items: { type: string } }
        uncertainty: { type: string, minLength: 1 }
    SimulationRangePrior:
      type: object
      additionalProperties: false
      required: [minimum, mode, maximum, source, unit, scope, uncertainty]
      properties:
        minimum: { type: number, minimum: 0 }
        mode: { type: number, minimum: 0 }
        maximum: { type: number, minimum: 0 }
        source: { type: string, minLength: 1 }
        unit: { type: string, minLength: 1 }
        scope: { type: array, minItems: 1, items: { type: string } }
        uncertainty: { type: string, minLength: 1 }
    SimulationFatiguePrior:
      type: object
      additionalProperties: false
      required: [enabled, daily_rate, source, unit, scope, uncertainty]
      properties:
        enabled: { type: boolean }
        daily_rate: { type: number, minimum: 0, maximum: 1 }
        source: { type: string, minLength: 1 }
        unit: { type: string, const: ratio_per_day }
        scope: { type: array, minItems: 1, items: { type: string } }
        uncertainty: { type: string, minLength: 1 }
    SimulationPriorSet:
      type: object
      additionalProperties: false
      required: [version, review_pass_probability, delivery_probability, budget_utilization, cpm, ctr, cvr, tracking_observable_rate]
      properties:
        version: { type: string, minLength: 1 }
        review_pass_probability: { $ref: '#/components/schemas/SimulationProbabilityPrior' }
        delivery_probability: { $ref: '#/components/schemas/SimulationProbabilityPrior' }
        budget_utilization: { $ref: '#/components/schemas/SimulationRangePrior' }
        cpm: { $ref: '#/components/schemas/SimulationRangePrior' }
        ctr: { $ref: '#/components/schemas/SimulationRangePrior' }
        cvr: { $ref: '#/components/schemas/SimulationRangePrior' }
        tracking_observable_rate: { $ref: '#/components/schemas/SimulationProbabilityPrior' }
        creative_fatigue: { $ref: '#/components/schemas/SimulationFatiguePrior' }
    MechanisticSimulationRequest:
      type: object
      additionalProperties: false
      required: [stable_seed, sample_count, prediction_horizon_days, review_state, prior_set]
      properties:
        stable_seed: { type: string, minLength: 1, maxLength: 128 }
        sample_count:
          type: integer
          minimum: 100
          maximum: 100000
          description: sample_count multiplied by prediction_horizon_days cannot exceed 500000.
        prediction_horizon_days: { type: integer, minimum: 1, maximum: 31 }
        review_state: { type: string, enum: [unknown, approved, rejected] }
        prior_set: { $ref: '#/components/schemas/SimulationPriorSet' }
        calibration_account_ref:
          type: string
          pattern: '^oeacct_[0-9a-f]+$'
          description: Local Connector account reference. A calibrated request requires a seven-day horizon.
    SimulationQuantiles:
      type: object
      additionalProperties: false
      required: [available, unit]
      properties:
        available: { type: boolean }
        unit: { type: string }
        p10: { type: number }
        p50: { type: number }
        p90: { type: number }
        mean: { type: number }
    MechanisticMetricWindow:
      type: object
      additionalProperties: false
      required: [sequence, start, end, timezone, metrics]
      properties:
        sequence: { type: integer, minimum: 1 }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        timezone: { type: string }
        metrics:
          type: object
          additionalProperties: { $ref: '#/components/schemas/SimulationQuantiles' }
    SimulationScenarioProbability:
      type: object
      additionalProperties: false
      required: [scenario, threshold_version, probability, status, evidence_refs, limitations]
      properties:
        scenario: { type: string, enum: [typical_launch, breakout_launch, steady, under_delivery, cost_pressure, creative_fatigue, tracking_anomaly, review_rejected, zero_conversion, spend_spike] }
        threshold_version: { type: string }
        probability: { type: number, minimum: 0, maximum: 1 }
        status: { type: string, enum: [calibrated, simulated, suspected, known_state] }
        evidence_refs: { type: array, items: { type: string } }
        limitations: { type: array, items: { type: string } }
    SimulationRecommendationDraft:
      type: object
      additionalProperties: false
      required: [recommendation_type, target_field, current_value, suggested_range, expected_effect_range, confidence, effect_basis, rationale, evidence_refs, risks, guardrails, requires_human_review]
      properties:
        recommendation_type: { type: string }
        target_field: { type: string }
        current_value: {}
        suggested_range: { type: array, minItems: 2, maxItems: 2, items: { type: number } }
        expected_effect_range: { type: array, minItems: 2, maxItems: 2, items: { type: number } }
        confidence: { type: string }
        effect_basis: { type: string, enum: [predictive_association, rule_constraint] }
        rationale: { type: string }
        evidence_refs: { type: array, items: { type: string } }
        risks: { type: array, items: { type: string } }
        guardrails: { type: array, items: { type: string } }
        requires_human_review: { type: boolean, const: true }
    MechanisticSimulationAlert:
      type: object
      additionalProperties: false
      required: [type, severity, probability, evidence_refs, limitations]
      properties:
        type: { type: string, enum: [under_delivery, cost_pressure, creative_fatigue, tracking_anomaly, review_rejected, zero_conversion, spend_spike] }
        severity: { type: string, enum: [critical, high, medium, low] }
        probability: { type: number, minimum: 0, maximum: 1 }
        evidence_refs: { type: array, items: { type: string } }
        limitations: { type: array, items: { type: string } }
    MechanisticSimulationResult:
