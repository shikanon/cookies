      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SelectDecisionRequest' }
      responses:
        '201':
          description: Immutable selection and compiled workflow.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DecisionSelection' }
        '200':
          description: Idempotent replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DecisionSelection' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /api/delivery/v1/projects/{project_id}/decision-selections/{selection_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - name: selection_id
        in: path
        required: true
        schema: { type: string, minLength: 1 }
    get:
      operationId: getDeliveryDecisionSelection
      summary: Get an immutable candidate selection and compiled workflow
      responses:
        '200':
          description: Selection frozen at the final-approval boundary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DecisionSelection' }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /api/delivery/v1/projects/{project_id}/decision-selections/{selection_id}/observatory-runs:
