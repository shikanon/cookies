            tracking_rate_bp: { type: integer, minimum: 0 }
            applied_factors: { type: array, items: { $ref: '#/components/schemas/OutcomeSimulationFactor' } }
            scenario_evidence: { type: array, items: { type: string } }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
    MonitoringFixture:
      type: string
      description: Deterministic fixture used only by the controlled monitoring evaluator.
      enum: [normal_day, anomaly_day, stale_data, insufficient_data]
    InsightsQualityStatus:
      type: string
      description: Quality gate returned by the Delivery-owned insights consumer port.
      enum: [usable, empty, stale, incomplete, schema_mismatch, unavailable]
    AlertType:
      type: string
      description: Monitoring classifications derived from the same persisted outcome SimulationRun.
      enum: [review_rejected, spend_spike, zero_conversion, cost_worsening, under_delivery, creative_fatigue, tracking_anomaly]
    AlertStatus:
      type: string
      enum: [open, acknowledged, dismissed]
    AlertSeverity:
      type: string
      enum: [critical, high, medium, low]
    AlertWindow:
      type: object
      additionalProperties: false
      required: [start, end, timezone, data_through]
      properties:
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        timezone: { type: string }
        data_through: { type: string, format: date-time }
        baseline_start: { type: string, format: date-time }
        baseline_end: { type: string, format: date-time }
    AlertMetricDefinition:
      type: object
      additionalProperties: false
      required: [name, unit]
      properties:
        name: { type: string }
        unit: { type: string }
        numerator: { type: number }
        denominator: { type: number }
        observed_value: { type: number }
        baseline_value: { type: number }
        threshold: { type: number }
    AlertOwner:
      type: object
      additionalProperties: false
      required: [id, display_name, source]
      properties:
        id: { type: string }
        display_name: { type: string }
        source: { type: string }
    AlertFreshness:
      type: object
      additionalProperties: false
      required: [status, as_of, evaluated_at, age_seconds, max_age_seconds]
      properties:
        status: { type: string, enum: [fresh, stale, unknown, insufficient_data] }
        as_of: { type: string, format: date-time }
        evaluated_at: { type: string, format: date-time }
        age_seconds: { type: integer, minimum: 0 }
        max_age_seconds: { type: integer, minimum: 0 }
        missing_metrics:
          type: array
          items: { type: string }
    DeliveryMonitoringAlert:
      type: object
      additionalProperties: false
      required: [id, organization_id, project_id, plan_id, execution_id, simulation_run_id, monitored_entity, type, rule_id, rule_version, fingerprint, severity, status, version, window, metric_definition, owner, evidence_refs, source, is_simulated, scenario, dataset_version, fixture_version, freshness, created_by, created_at, updated_at]
      properties:
        id: { type: string }
        organization_id: { type: string }
        project_id: { type: string }
        plan_id: { type: string, minLength: 1 }
        execution_id: { type: string, minLength: 1 }
        simulation_run_id: { type: string, minLength: 1 }
        monitored_entity:
          type: object
          additionalProperties: false
          required: [type, id, advertiser_id]
          properties:
            type: { type: string, const: delivery_plan }
            id: { type: string }
            advertiser_id: { type: string }
        type: { $ref: '#/components/schemas/AlertType' }
        rule_id: { type: string }
        rule_version: { type: string, const: v3 }
        fingerprint: { type: string, minLength: 1 }
        severity: { $ref: '#/components/schemas/AlertSeverity' }
        status: { $ref: '#/components/schemas/AlertStatus' }
        window: { $ref: '#/components/schemas/AlertWindow' }
        metric_definition: { $ref: '#/components/schemas/AlertMetricDefinition' }
        owner: { $ref: '#/components/schemas/AlertOwner' }
        evidence_refs:
          type: array
          minItems: 1
          items: { type: string }
        source: { type: string, const: post_launch_simulator }
        is_simulated: { type: boolean, const: true }
        scenario: { $ref: '#/components/schemas/MonitoringFixture' }
        dataset_version: { type: string, const: delivery-outcome-scenario/v1 }
        fixture_version: { type: string, minLength: 1 }
        acknowledged_at:
          oneOf:
            - { type: string, format: date-time }
            - { type: 'null' }
        acknowledged_by:
          oneOf:
            - { type: string }
            - { type: 'null' }
        dismissed_at:
          oneOf:
            - { type: string, format: date-time }
            - { type: 'null' }
        dismissed_by:
          oneOf:
            - { type: string }
            - { type: 'null' }
        version: { type: integer, minimum: 1 }
        freshness: { $ref: '#/components/schemas/AlertFreshness' }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AlertEvaluationRequest:
      type: object
      additionalProperties: false
      required: [fixture]
      properties:
        fixture: { $ref: '#/components/schemas/MonitoringFixture' }
        execution_id:
          type: string
          description: Optional project-scoped execution seed. Tour preparation uses it to avoid selecting unrelated project metrics.
    AlertEvaluationResult:
      type: object
      additionalProperties: false
      required: [items, created_count, reused_count, source, is_simulated, scenario, evaluated_at, insights_source, insights_quality, insights_fixture_version, insights_evidence_refs]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DeliveryMonitoringAlert' }
        created_count: { type: integer, minimum: 0 }
        reused_count: { type: integer, minimum: 0 }
        source: { type: string, const: post_launch_simulator }
        is_simulated: { type: boolean, const: true }
        scenario: { $ref: '#/components/schemas/MonitoringFixture' }
        evaluated_at: { type: string, format: date-time }
        insights_source: { type: string, enum: [mock, replay, connector] }
        insights_quality: { $ref: '#/components/schemas/InsightsQualityStatus' }
        insights_quality_reason: { type: string }
        insights_fixture_version: { type: string, minLength: 1 }
        insights_evidence_refs:
          type: array
          items: { type: string, minLength: 1 }
    AlertList:
      type: object
      additionalProperties: false
      required: [items, next_cursor, source, is_simulated]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DeliveryMonitoringAlert' }
        next_cursor:
          oneOf:
            - { type: string, minLength: 1 }
            - { type: 'null' }
        source: { type: string, const: post_launch_simulator }
        is_simulated: { type: boolean, const: true }
    UpdateAlert:
      type: object
      additionalProperties: false
      required: [action, expected_version]
      properties:
        action:
          type: string
          enum: [acknowledge, dismiss]
        expected_version: { type: integer, minimum: 1 }
    PlanDetail:
      type: object
      required: [plan, change_sets, executions]
      properties:
        plan: { $ref: '#/components/schemas/DeliveryPlan' }
        change_sets:
          type: array
          items: { $ref: '#/components/schemas/ChangeSet' }
        executions:
          type: array
          items: { $ref: '#/components/schemas/ExecutionResult' }
    Problem:
      type: object
      required: [error, source, scenario]
      properties:
        error:
          type: object
          required: [code, message, request_id, retryable, details]
          properties:
            code: { type: string, enum: [INVALID_REQUEST, RESOURCE_NOT_FOUND, PROJECT_ACCESS_DENIED, INVALID_STATE, VERSION_CONFLICT, IDEMPOTENCY_CONFLICT, STALE_PLAN_VERSION, APPROVAL_REQUIRED, APPROVAL_EXPIRED, APPROVAL_CONTENT_MISMATCH, APPROVAL_SCOPE_EXCEEDED, TOUR_OWNER_MISMATCH, SCOPE_REQUIRED, INTERNAL] }
            message: { type: string }
            request_id: { type: string }
            retryable: { type: boolean }
            details:
              type: array
              items: { type: object }
        source: { type: string, const: mock }
        scenario:
          type: string
          description: Stable lowercase error scenario, for example approval_expired.
