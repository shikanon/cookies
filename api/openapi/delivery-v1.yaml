openapi: 3.1.0
info:
  title: Cookies Delivery API
  version: 2.0.0
  description: Immutable DeliveryIntent and tagged PlatformConfiguration plans, authoritative preflight, content-bound approvals, and legacy read-only history.
servers:
  - url: /
security:
  - sessionCookie: []
paths:
  /api/delivery/v1/projects/{project_id}/plans:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    get:
      operationId: listDeliveryPlans
      summary: List project-scoped delivery plans
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Mock plan list with explicit provenance.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanList' }
        '403': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createDeliveryPlan
      summary: Create an immutable DeliveryIntent and tagged PlatformConfiguration plan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePlan' }
      responses:
        '201':
          description: Plan and immutable V1 created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryPlan' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /api/delivery/v1/projects/{project_id}/plans/{plan_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/PlanID'
    get:
      operationId: getDeliveryPlan
      summary: Get a project-scoped delivery plan and all immutable versions
      responses:
        '200':
          description: Current plan projection and immutable history.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryPlan' }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateDeliveryPlan
      summary: Create a new immutable plan version using optimistic concurrency
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePlan' }
      responses:
        '200':
          description: Updated current projection with retained history.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryPlan' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409':
          description: VERSION_CONFLICT; expected_version is stale.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /api/delivery/v1/projects/{project_id}/plans/{plan_id}/versions:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/PlanID'
    get:
      operationId: listDeliveryPlanVersions
      summary: List immutable plan versions
      responses:
        '200':
          description: Immutable history with mock provenance.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanVersionList' }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /api/delivery/v1/projects/{project_id}/plans/{plan_id}/versions/{version}:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/PlanID'
      - $ref: '#/components/parameters/PlanVersion'
    get:
      operationId: getDeliveryPlanVersion
      summary: Read one immutable plan version
      responses:
        '200':
          description: Exact immutable version.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryPlanVersion' }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /api/delivery/v1/projects/{project_id}/plans/{plan_id}/preflight:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/PlanID'
    post:
      operationId: preflightDeliveryPlan
      summary: Run the server-authoritative preflight rules on the current version
      responses:
        '200':
          description: Structured error and warning checks with repair targets.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreflightResult' }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /api/delivery/v1/projects/{project_id}/plans/{plan_id}/versions/{version}/mechanistic-simulation-runs:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/PlanID'
      - $ref: '#/components/parameters/PlanVersion'
    post:
      operationId: createDeliveryMechanisticSimulationRun
      summary: Run an assumption-driven prelaunch mechanistic simulation
      description: >-
        Consumes one immutable PlanVersion, DeliveryIntent, OceanEngineConfiguration,
        frozen calibration Manifest binding, explicit prior set, and stable seed.
        It does not require or create an Execution, Approval, Browser RPA Run, or remote action.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MechanisticSimulationRequest' }
      responses:
        '200':
          description: Deterministic replay or stable platform_pending result.
          content: { application/json: { schema: { $ref: '#/components/schemas/MechanisticSimulationEnvelope' } } }
        '201':
          description: New assumption-driven simulation result.
          content: { application/json: { schema: { $ref: '#/components/schemas/MechanisticSimulationEnvelope' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /api/delivery/v1/projects/{project_id}/mechanistic-simulation-runs/{run_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - name: run_id
        in: path
        required: true
        schema: { type: string, minLength: 1 }
    get:
      operationId: getDeliveryMechanisticSimulationRun
      summary: Read one project-scoped mechanistic simulation result
      responses:
        '200':
          description: Stored assumption-driven simulation result.
          content: { application/json: { schema: { $ref: '#/components/schemas/MechanisticSimulationResult' } } }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /api/delivery/v1/projects/{project_id}/plans/{plan_id}/configuration:compile:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/PlanID'
    post:
      deprecated: true
      operationId: compileDeliveryPlanConfiguration
      summary: Rejected legacy ThreeTier write endpoint
      description: Always returns LEGACY_CONFIGURATION_UNSUPPORTED. Legacy ThreeTier snapshots remain readable but immutable.
      responses:
        '409': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /api/delivery/v1/projects/{project_id}/plans/{plan_id}/configuration:override:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/PlanID'
    post:
      deprecated: true
      operationId: overrideDeliveryPlanConfigurationField
      summary: Rejected legacy ThreeTier write endpoint
      description: Always returns LEGACY_CONFIGURATION_UNSUPPORTED. Create a new DeliveryIntent and PlatformConfiguration version instead.
      responses:
        '409': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /api/delivery/v1/projects/{project_id}/plans/{plan_id}/recommendations:generate:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/PlanID'
    post:
      operationId: generateDeliveryRecommendation
      deprecated: true
      summary: Generate one historical Tour-only optimization recommendation
      description: >-
        Requires a succeeded platform-operation rehearsal, two persisted metric windows, and
        monitoring alerts for the same execution. The recommendation freezes those exact evidence
        references and never writes to a real platform.
      requestBody: { $ref: '#/components/requestBodies/ExpectedVersion' }
      responses:
        '201':
          description: Proposed recommendation with frozen evidence, base, and target snapshots.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryRecommendation' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /api/delivery/v1/projects/{project_id}/plans/{plan_id}/decisions:generate:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/PlanID'
    post:
      operationId: generateDeliveryDecision
      summary: Generate an immutable explainable decision with three policy candidates
      description: >-
        Binds the current DeliveryIntent and PlatformConfiguration to exact simulation and metric
        facts. This Phase C operation is deterministic and cannot write to an advertising platform.
      requestBody: { $ref: '#/components/requestBodies/ExpectedVersion' }
      responses:
        '201':
          description: Immutable DeliveryDecision.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryDecision' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /api/delivery/v1/projects/{project_id}/plans/{plan_id}/detail:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/PlanID'
    get:
      operationId: getDeliveryPlanDetail
      summary: Get a plan with its ChangeSets and execution history
      responses:
        '200':
          description: Plan control-loop detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanDetail' }
        default: { $ref: '#/components/responses/Problem' }
  /api/delivery/v1/projects/{project_id}/plans/{plan_id}:create-change-set:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/PlanID'
    post:
      operationId: createDeliveryChangeSet
      summary: Freeze the exact current PlanVersion in a new ChangeSet
      requestBody: { $ref: '#/components/requestBodies/ExpectedVersion' }
      responses:
        '201': { $ref: '#/components/responses/ChangeSet' }
        '412': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /api/delivery/v1/projects/{project_id}/observatory-runs/{run_id}/controlled-change-sets:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - name: run_id
        in: path
        required: true
        schema: { type: string, minLength: 1 }
    post:
      operationId: createControlledDeliveryChangeSet
      summary: Freeze the latest accepted or modified feedback into a formal controlled ChangeSet
      description: >-
        This operation never writes an advertising platform. It freezes Plan, Intent, feedback,
        Decision, final Configuration, Workflow, account, action, budget and the
        oceanengine-ecommerce-manual@v0.1-calibration Skill identities. The Skill identity binds
        the stage B calibration baseline and its partial live project-form revalidation; it does
        not claim promotion-form locators, a complete real Browser Driver or submit authority.
        The service selects the latest feedback for the run itself. Rejected feedback,
        an older feedback record or any hash/version drift is rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateControlledChangeSetRequest' }
      responses:
        '201':
          description: Formal controlled ChangeSet ready for remote-write approval.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ControlledChangeSet' }
        '200':
          description: Idempotent replay of the same frozen request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ControlledChangeSet' }
        '409': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /api/delivery/v1/projects/{project_id}/controlled-change-sets/{controlled_change_set_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - name: controlled_change_set_id
        in: path
        required: true
        schema: { type: string, minLength: 1 }
    get:
      operationId: getControlledDeliveryChangeSet
      summary: Read one formal controlled ChangeSet and its current approval validity
      responses:
        '200':
          description: Controlled ChangeSet.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ControlledChangeSet' }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /api/delivery/v1/projects/{project_id}/controlled-change-sets/{controlled_change_set_id}:approve:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - name: controlled_change_set_id
        in: path
        required: true
        schema: { type: string, minLength: 1 }
    post:
      operationId: approveControlledDeliveryChangeSet
      summary: Approve the exact controlled remote-write scope without upgrading execute_mock
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_version]
              properties:
                expected_version: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Immutable formal remote-write Approval.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RemoteWriteApproval' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /api/delivery/v1/projects/{project_id}/controlled-change-sets/{controlled_change_set_id}:invalidate-calibration:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - name: controlled_change_set_id
        in: path
        required: true
        schema: { type: string, minLength: 1 }
    post:
      operationId: invalidateCalibratedControlledDeliveryChangeSet
      summary: Invalidate a cancelled zero-attempt calibration authority while preserving its immutable approval history
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_version]
              properties:
                expected_version: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Invalidated ChangeSet and cancelled controlled execution.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [change_set, execution]
                properties:
                  change_set: { $ref: '#/components/schemas/ControlledChangeSet' }
                  execution: { $ref: '#/components/schemas/ControlledExecution' }
        '409': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /api/delivery/v1/projects/{project_id}/controlled-change-sets/{controlled_change_set_id}:execute:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - name: controlled_change_set_id
        in: path
        required: true
        schema: { type: string, minLength: 1 }
    post:
      operationId: createControlledDeliveryExecution
      summary: Create the business execution aggregate for one unexpired formal approval
      responses:
        '201':
          description: Controlled business execution awaiting its Platform BrowserRpaRun.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ControlledExecution' }
        '409': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /api/delivery/v1/projects/{project_id}/controlled-executions/{execution_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/ExecutionID'
    get:
      operationId: getControlledDeliveryExecution
      summary: Read the server-authoritative controlled business execution projection
      responses:
        '200':
          description: Controlled business execution.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ControlledExecution' }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /api/delivery/v1/projects/{project_id}/platform-entity-mappings:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    post:
      operationId: createPendingDeliveryPlatformEntityMapping
      summary: Create a pending internal-to-platform mapping with no client-supplied platform result values
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePlatformEntityMappingRequest' }
      responses:
        '201':
          description: Pending mapping containing no platform object ID, status, or evidence IDs.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformEntityMapping' }
        default: { $ref: '#/components/responses/Problem' }
  /api/delivery/v1/projects/{project_id}/platform-entity-mappings/{mapping_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - name: mapping_id
        in: path
        required: true
        schema: { type: string, minLength: 1 }
    get:
      operationId: getDeliveryPlatformEntityMapping
      summary: Read a project-scoped platform entity mapping
      responses:
        '200':
          description: Mapping projection.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformEntityMapping' }
        default: { $ref: '#/components/responses/Problem' }
  /api/delivery/v1/projects/{project_id}/platform-entity-mappings/{mapping_id}/controlled-change-sets:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - name: mapping_id
        in: path
        required: true
        schema: { type: string, minLength: 1 }
    post:
      operationId: createMappedControlledDeliveryChangeSet
      summary: Freeze one finite modification of an exact confirmed promotion mapping
      description: >-
        Compiles a new ChangeSet and requires a new Approval. The server owns the mapped
        platform object identity and binds the current and target state hashes. It never
        reuses the creation Approval or mutates the confirmed mapping in place.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMappedControlledChangeSetRequest' }
      responses:
        '201':
          description: New controlled promotion modification ready for approval.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ControlledChangeSet' }
        '200':
          description: Idempotent replay of the same mapping version and target state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ControlledChangeSet' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /api/delivery/v1/projects/{project_id}/platform-entity-mappings/{mapping_id}/emergency-pause-change-sets:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - name: mapping_id
        in: path
        required: true
        schema: { type: string, minLength: 1 }
    post:
      operationId: createEmergencyPauseDeliveryChangeSet
      summary: Freeze an operator-bound pause for one delivering promotion
      description: >-
        Starts from a confirmed promotion mapping, requires the current normalized
        platform status to be delivering, server-forces the target status to paused,
        and creates a fresh ChangeSet that must receive its own Approval.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateEmergencyPauseChangeSetRequest' }
      responses:
        '201':
          description: New emergency-pause ChangeSet ready for approval.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ControlledChangeSet' }
        '200':
          description: Idempotent replay of the same exact pause authority.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ControlledChangeSet' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /api/delivery/v1/projects/{project_id}/platform-entity-mappings/{mapping_id}/controlled-restart-change-sets:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - name: mapping_id
        in: path
        required: true
        schema: { type: string, minLength: 1 }
    post:
      operationId: createControlledRestartDeliveryChangeSet
      summary: Freeze a fresh operator-bound enable after a verified pause
      description: >-
        Requires a confirmed promotion Mapping whose latest controlled state is
        paused, rebinds the exact approved daily budget, active schedule,
        authorized available materials and landing page, and server-forces the
        target normalized status to delivering. This is never an automatic
        compensation or approval reuse path.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateControlledRestartChangeSetRequest' }
      responses:
        '201':
          description: New controlled-restart ChangeSet ready for approval.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ControlledChangeSet' }
        '200':
          description: Idempotent replay of the same exact restart authority.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ControlledChangeSet' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /api/delivery/v1/projects/{project_id}/platform-entity-mappings/{mapping_id}:confirm:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - name: mapping_id
        in: path
        required: true
        schema: { type: string, minLength: 1 }
    post:
      operationId: confirmDeliveryPlatformEntityMapping
      summary: Confirm a mapping from two server-loaded Computer Use evidence records
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmPlatformEntityMappingRequest' }
      responses:
        '200':
          description: Confirmed mapping with matching object ID and status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformEntityMapping' }
        '409': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /api/delivery/v1/projects/{project_id}/platform-entity-mappings/{mapping_id}:confirm-mutation:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - name: mapping_id
        in: path
        required: true
        schema: { type: string, minLength: 1 }
    post:
      operationId: confirmDeliveryPlatformEntityMappingMutation
      summary: Advance a mapping version from two matching post-write Computer Use readbacks
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmPlatformEntityMappingMutationRequest' }
      responses:
        '200':
          description: Versioned mapping mutation and immutable revision.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfirmPlatformEntityMappingMutationResult' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /api/delivery/v1/projects/{project_id}/platform-entity-mappings/{mapping_id}:confirm-change:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - name: mapping_id
        in: path
        required: true
        schema: { type: string, minLength: 1 }
    post:
      operationId: confirmDeliveryPlatformEntityMappingChange
      summary: Advance a mapping after any controlled existing-promotion change
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmPlatformEntityMappingMutationRequest' }
      responses:
        '200':
          description: Versioned mapping change and immutable revision.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfirmPlatformEntityMappingMutationResult' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /api/delivery/v1/projects/{project_id}/change-sets:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    get:
      operationId: listDeliveryChangeSets
      summary: List project-scoped Delivery ChangeSets with current approval validity
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: ChangeSet approval queue with explicit mock provenance.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangeSetList' }
        '403': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /api/delivery/v1/projects/{project_id}/recommendations:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    get:
      operationId: listDeliveryRecommendations
      deprecated: true
      summary: List project-scoped historical Tour recommendations
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Recommendations with explicit mock provenance.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryRecommendationList' }
        '403': { $ref: '#/components/responses/Problem' }
