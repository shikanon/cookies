      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAlert' }
      responses:
        '200':
          description: Updated alert projection.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryMonitoringAlert' }
        '404': { $ref: '#/components/responses/Problem' }
        '409':
          description: VERSION_CONFLICT or INVALID_STATE.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /api/delivery/v1/projects/{project_id}/tour-runs/{run_id}:prepare:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/TourRunID'
    post:
      operationId: prepareDeliveryTourRun
      summary: Deterministically prepare an owner-scoped complete mock delivery tour
      description: >-
        Replaying a prepared run returns the same seven case plans without duplication.
        A partially prepared run is first reset through its exact ownership boundary and
        then rebuilt. This endpoint never writes to a real advertising platform.
      responses:
        '201':
          description: A new run and its seven deterministic cases were prepared.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryTourRun' }
        '200':
          description: The already prepared run was replayed without duplication.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryTourRun' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /api/delivery/v1/projects/{project_id}/executions/{execution_id}/simulation-runs:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/ExecutionID'
    post:
      operationId: createDeliveryOutcomeSimulationRun
      summary: Run a deterministic post-launch outcome scenario after a successful platform-operation rehearsal
      description: >-
        This rule-driven Mock simulation does not predict real advertising performance.
        The exact PlanVersion, approved configuration, scenario and stable seed form
        an idempotent input; matching inputs replay the same SimulationRun and metric windows.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOutcomeSimulationRequest' }
      responses:
        '200':
          description: Existing deterministic run replayed.
          content: { application/json: { schema: { $ref: '#/components/schemas/OutcomeSimulationResult' } } }
        '201':
          description: New deterministic run and metric windows created.
          content: { application/json: { schema: { $ref: '#/components/schemas/OutcomeSimulationResult' } } }
        default: { $ref: '#/components/responses/Problem' }
  /api/delivery/v1/projects/{project_id}/executions/{execution_id}/simulation-run:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/ExecutionID'
    get:
      operationId: getLatestDeliveryOutcomeSimulationRun
      summary: Read the latest persisted outcome simulation for an execution
      responses:
        '200':
          description: Latest run and its metric windows.
          content: { application/json: { schema: { $ref: '#/components/schemas/OutcomeSimulationResult' } } }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /api/delivery/v1/projects/{project_id}/tour-runs/{run_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/TourRunID'
    get:
      operationId: getDeliveryTourRun
      summary: Read authoritative tour progress and resumable URLs
      responses:
        '200':
          description: The run, seven cases, and progress derived from persisted delivery authority data.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryTourRun' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /api/delivery/v1/projects/{project_id}/tour-runs/{run_id}:reset:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/TourRunID'
    post:
      operationId: resetDeliveryTourRun
      summary: Delete only the selected owner's exact tour-run causal closure
      description: >-
        Isolation is the authenticated organization, active project, stable run ID, and
        authenticated owner. Ordinary plans and other owners or runs are not selected.
      responses:
        '200':
          description: The run was marked reset and exact deletion counts are returned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryTourResetResult' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: cookies_session
  parameters:
    ProjectID:
      name: project_id
      in: path
      required: true
      schema: { type: string }
    PlanID:
      name: plan_id
      in: path
      required: true
      schema: { type: string }
    PlanVersion:
      name: version
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    ChangeSetID:
      name: change_set_id
      in: path
      required: true
      schema: { type: string }
    ExecutionID:
      name: execution_id
      in: path
      required: true
      schema: { type: string }
    AlertID:
      name: alert_id
      in: path
      required: true
      schema: { type: string }
    RecommendationID:
      name: recommendation_id
      in: path
      required: true
      schema: { type: string }
    TourRunID:
      name: run_id
      in: path
      required: true
      description: Stable caller-chosen run ID, scoped by organization, project, and authenticated owner.
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9_-]{2,63}$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Caller-chosen stable key for one execution request. It is scoped to the authenticated organization, project, and execute operation.
      schema: { type: string, minLength: 1, maxLength: 255 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    Cursor:
      name: cursor
      in: query
      description: Opaque continuation cursor returned by the previous alert list response.
      schema: { type: string, minLength: 1 }
    AlertStatusFilter:
      name: status
      in: query
      schema: { $ref: '#/components/schemas/AlertStatus' }
    AlertPlanFilter:
      name: plan_id
      in: query
      description: Restrict results to one DeliveryPlan inside the current Project.
      schema: { type: string, minLength: 1 }
    AlertExecutionFilter:
      name: execution_id
      in: query
      description: Restrict results to one Execution inside the current Project.
      schema: { type: string, minLength: 1 }
    AlertTypeFilter:
      name: type
      in: query
      schema: { $ref: '#/components/schemas/AlertType' }
    AlertSeverityFilter:
      name: severity
      in: query
      schema: { $ref: '#/components/schemas/AlertSeverity' }
    AlertFixtureFilter:
      name: fixture
      in: query
      schema: { $ref: '#/components/schemas/MonitoringFixture' }
  requestBodies:
    ExpectedVersion:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [expected_version]
            properties:
              expected_version: { type: integer, minimum: 1 }
    ExecuteChangeSet:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [expected_version, scenario]
            properties:
              expected_version: { type: integer, minimum: 1 }
              scenario: { $ref: '#/components/schemas/ExecutionScenario' }
  responses:
    ChangeSet:
      description: Updated ChangeSet.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ChangeSet' }
    RecommendationDecision:
      description: Accepted recommendation decision and exactly one new draft ChangeSet.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RecommendationDecisionResult' }
    DeliveryTourCaseKey:
      type: string
      enum: [golden_path, preflight_failure, approval_expired, plan_stale, partial_execution, result_unknown, review_rejected_alert]
    DeliveryTourRunStatus:
      type: string
      enum: [preparing, prepared, reset]
    DeliveryTourCase:
      type: object
      additionalProperties: false
      required: [key, title, plan_id, status, expected_outcome, start_url, source, scenario, evidence, observed_at]
      properties:
        key: { $ref: '#/components/schemas/DeliveryTourCaseKey' }
        title: { type: string }
        plan_id: { type: string }
        status: { type: string, enum: [missing, prepared, ready, observed] }
        expected_outcome: { type: string }
        start_url: { type: string }
        source: { type: string, const: mock }
        scenario: { $ref: '#/components/schemas/DeliveryTourCaseKey' }
        evidence:
          type: array
          items: { type: string }
        observed_at: { type: string, format: date-time }
    DeliveryTourStep:
      type: object
      additionalProperties: false
      required: [key, title, completion_condition, complete, url, explanation, evidence]
      properties:
        key:
          type: string
          enum: [plan_creation, configuration, first_approval, execution, monitoring, recommendation, new_change_set, second_approval]
        title: { type: string }
        completion_condition: { type: string }
        complete: { type: boolean }
        url: { type: string }
        explanation: { type: string }
        evidence:
          type: array
          items: { type: string }
    DeliveryTourRun:
      type: object
      additionalProperties: false
      required: [id, organization_id, project_id, owner_id, status, source, scenario, prepared_at, reset_at, created_at, updated_at, cases, steps, current_step, suggested_next_url]
      properties:
        id: { type: string, pattern: '^[a-z0-9][a-z0-9_-]{2,63}$' }
        organization_id: { type: string }
        project_id: { type: string }
        owner_id: { type: string }
        status: { $ref: '#/components/schemas/DeliveryTourRunStatus' }
        source: { type: string, const: mock }
        scenario: { type: string, const: delivery_tour }
        prepared_at:
          oneOf:
            - { type: string, format: date-time }
            - { type: 'null' }
        reset_at:
          oneOf:
            - { type: string, format: date-time }
            - { type: 'null' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        cases:
          type: array
          minItems: 7
          maxItems: 7
          items: { $ref: '#/components/schemas/DeliveryTourCase' }
        steps:
          type: array
          minItems: 8
          maxItems: 8
          items: { $ref: '#/components/schemas/DeliveryTourStep' }
        current_step:
          type: string
          enum: [plan_creation, configuration, first_approval, execution, monitoring, recommendation, new_change_set, second_approval, complete]
        suggested_next_url: { type: string }
    DeliveryTourResetResult:
      type: object
      additionalProperties: false
      required: [run, deleted, source, scenario, reset_at, isolation_key]
      properties:
        run: { $ref: '#/components/schemas/DeliveryTourRun' }
        deleted:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
        source: { type: string, const: mock }
        scenario: { type: string, const: delivery_tour_reset }
        reset_at: { type: string, format: date-time }
        isolation_key: { type: string }
    Problem:
      description: Cookies problem response.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    ControlledAuthorityBinding:
      type: object
      additionalProperties: false
      required: [plan_id, plan_version, plan_canonical_hash, intent_id, intent_version, intent_canonical_hash, configuration_id, configuration_version, configuration_canonical_hash, workflow_id, workflow_canonical_hash, account_reference_id, object_fingerprint]
      anyOf:
        - required: [authority_origin, preflight_canonical_hash]
          properties:
            authority_origin: { const: plan_execution }
        - required: [selection_id, observatory_run_id, observatory_run_canonical_hash, operator_feedback_id, operator_feedback_canonical_hash, operator_feedback_disposition, decision_id, decision_canonical_hash]
      properties:
        authority_origin: { type: string, const: plan_execution }
        preflight_canonical_hash: { $ref: '#/components/schemas/CanonicalHash' }
        selection_id: { type: string }
        observatory_run_id: { type: string }
        observatory_run_canonical_hash: { $ref: '#/components/schemas/CanonicalHash' }
        operator_feedback_id: { type: string }
        operator_feedback_canonical_hash: { $ref: '#/components/schemas/CanonicalHash' }
        operator_feedback_disposition: { type: string, enum: [accepted, modified] }
        plan_id: { type: string }
        plan_version: { type: integer, minimum: 1 }
        plan_canonical_hash: { $ref: '#/components/schemas/CanonicalHash' }
        intent_id: { type: string }
        intent_version: { type: integer, minimum: 1 }
        intent_canonical_hash: { $ref: '#/components/schemas/CanonicalHash' }
        decision_id: { type: string }
        decision_canonical_hash: { $ref: '#/components/schemas/CanonicalHash' }
        configuration_id: { type: string }
        configuration_version: { type: integer, minimum: 1 }
        configuration_canonical_hash: { $ref: '#/components/schemas/CanonicalHash' }
        workflow_id: { type: string }
        workflow_canonical_hash: { $ref: '#/components/schemas/CanonicalHash' }
        account_reference_id: { type: string }
        parent_platform_project_id: { type: string }
        target_mapping_id: { type: string }
        target_mapping_version: { type: integer, minimum: 1 }
        target_platform_object_id: { type: string }
        target_platform_object_kind: { type: string, enum: [promotion] }
        operator_principal_id: { type: string }
        supersedes_controlled_change_set_id: { type: string, minLength: 1 }
        project_budget_mode: { type: string, enum: [daily, unlimited] }
        project_budget_limit_minor: { type: integer, minimum: 0 }
        promotion_budget_limit_minor: { type: integer, minimum: 0 }
        object_fingerprint: { type: string }
        skill_id: { type: string }
        skill_version: { type: string }
        promotion_mutation: { $ref: '#/components/schemas/ControlledPromotionMutation' }
        promotion_control: { $ref: '#/components/schemas/ControlledPromotionControl' }
        promotion_restart: { $ref: '#/components/schemas/ControlledPromotionRestart' }
    ControlledScheduleWindow:
      type: object
      additionalProperties: false
      required: [start_at, end_at, timezone]
      properties:
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time }
        timezone: { type: string, minLength: 1 }
    ControlledMaterialReference:
      type: object
      additionalProperties: false
      required: [reference_id, authorization_evidence_id]
      properties:
        reference_id: { type: string, minLength: 1 }
        authorization_evidence_id: { type: string, minLength: 1 }
    ControlledLandingPageReference:
      type: object
      additionalProperties: false
      required: [reference_id, authorization_evidence_id]
      properties:
        reference_id: { type: string, minLength: 1 }
        authorization_evidence_id: { type: string, minLength: 1 }
    ControlledPromotionMutation:
      type: object
      additionalProperties: false
      required: [current_daily_budget_minor, target_daily_budget_minor, current_state_hash, target_state_hash]
      properties:
        current_daily_budget_minor: { type: integer, minimum: 30000 }
        target_daily_budget_minor: { type: integer, minimum: 30000 }
        current_materials:
          type: array
          items: { $ref: '#/components/schemas/ControlledMaterialReference' }
        target_materials:
          type: array
          items: { $ref: '#/components/schemas/ControlledMaterialReference' }
        current_state_hash: { $ref: '#/components/schemas/CanonicalHash' }
        target_state_hash: { $ref: '#/components/schemas/CanonicalHash' }
    ControlledPromotionControl:
      type: object
      additionalProperties: false
      required: [current_daily_budget_minor, current_platform_status, target_platform_status, current_state_hash, target_state_hash]
      properties:
        current_daily_budget_minor: { type: integer, minimum: 30000 }
        current_platform_status: { type: string, const: delivering }
        target_platform_status: { type: string, const: paused }
        current_state_hash: { $ref: '#/components/schemas/CanonicalHash' }
        target_state_hash: { $ref: '#/components/schemas/CanonicalHash' }
    ControlledPromotionRestart:
      type: object
      additionalProperties: false
      required: [current_daily_budget_minor, approved_daily_budget_minor, current_platform_status, target_platform_status, schedule, materials, landing_page, current_state_hash, target_state_hash]
      properties:
        current_daily_budget_minor: { type: integer, minimum: 30000 }
        approved_daily_budget_minor: { type: integer, minimum: 30000 }
        current_platform_status: { type: string, const: paused }
        target_platform_status: { type: string, const: delivering }
        schedule: { $ref: '#/components/schemas/ControlledScheduleWindow' }
        materials:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ControlledMaterialReference' }
        landing_page: { $ref: '#/components/schemas/ControlledLandingPageReference' }
        current_state_hash: { $ref: '#/components/schemas/CanonicalHash' }
        target_state_hash: { $ref: '#/components/schemas/CanonicalHash' }
    CreateControlledChangeSetRequest:
      type: object
      additionalProperties: false
      required: [observatory_run_id]
      properties:
        observatory_run_id: { type: string, minLength: 1 }
        action: { type: string, enum: [create_project_and_promotions, create_promotions_in_existing_project] }
        parent_platform_project_id: { type: string, minLength: 1 }
    CreateMappedControlledChangeSetRequest:
      type: object
      additionalProperties: false
      required: [expected_mapping_version, action, current_daily_budget_minor, target_daily_budget_minor]
      properties:
        expected_mapping_version: { type: integer, minimum: 2 }
        action: { type: string, enum: [update_promotion_budget, update_promotion_materials] }
        current_daily_budget_minor: { type: integer, minimum: 30000 }
        target_daily_budget_minor: { type: integer, minimum: 30000 }
        current_materials:
          type: array
          items: { $ref: '#/components/schemas/ControlledMaterialReference' }
        target_materials:
          type: array
          items: { $ref: '#/components/schemas/ControlledMaterialReference' }
        supersedes_controlled_change_set_id: { type: string, minLength: 1 }
    CreateEmergencyPauseChangeSetRequest:
      type: object
      additionalProperties: false
      required: [expected_mapping_version, current_daily_budget_minor, current_platform_status]
      properties:
        expected_mapping_version: { type: integer, minimum: 2 }
        current_daily_budget_minor: { type: integer, minimum: 30000 }
        current_platform_status: { type: string, const: delivering }
        supersedes_controlled_change_set_id: { type: string, minLength: 1 }
    CreateControlledRestartChangeSetRequest:
      type: object
      additionalProperties: false
      required: [expected_mapping_version, current_daily_budget_minor, approved_daily_budget_minor, current_platform_status, schedule, materials, landing_page]
      properties:
        expected_mapping_version: { type: integer, minimum: 2 }
        current_daily_budget_minor: { type: integer, minimum: 30000 }
        approved_daily_budget_minor: { type: integer, minimum: 30000 }
        current_platform_status: { type: string, const: paused }
        schedule: { $ref: '#/components/schemas/ControlledScheduleWindow' }
        materials:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ControlledMaterialReference' }
        landing_page: { $ref: '#/components/schemas/ControlledLandingPageReference' }
        supersedes_controlled_change_set_id: { type: string, minLength: 1 }
    ControlledChangeSet:
      type: object
      additionalProperties: false
      required: [schema_version, id, organization_id, project_id, binding, action, budget_limit_minor, currency, status, canonical_hash, version, created_by, created_at, updated_at]
      properties:
        schema_version: { type: string, const: delivery-controlled-change-set/v1 }
        id: { type: string }
        organization_id: { type: string }
        project_id: { type: string }
        binding: { $ref: '#/components/schemas/ControlledAuthorityBinding' }
        action: { type: string, enum: [create_project_and_promotions, create_promotions_in_existing_project, update_promotion_budget, update_promotion_materials, pause_promotion, resume_promotion] }
        budget_limit_minor: { type: integer, minimum: 0 }
        currency: { type: string, const: CNY }
        status: { type: string, enum: [ready_for_approval, approved, rejected, executing, executed, invalidated] }
        canonical_hash: { $ref: '#/components/schemas/CanonicalHash' }
        version: { type: integer, minimum: 1 }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        approval: { $ref: '#/components/schemas/RemoteWriteApproval' }
    RemoteWriteApproval:
      type: object
      additionalProperties: false
      required: [schema_version, id, organization_id, project_id, controlled_change_set_id, controlled_change_set_hash, binding, action, scope, budget_limit_minor, currency, action_hash, approved_by, approved_at, expires_at]
      properties:
        schema_version: { type: string, const: delivery-remote-write-approval/v1 }
        id: { type: string }
        organization_id: { type: string }
        project_id: { type: string }
        controlled_change_set_id: { type: string }
        controlled_change_set_hash: { $ref: '#/components/schemas/CanonicalHash' }
        binding: { $ref: '#/components/schemas/ControlledAuthorityBinding' }
        action: { type: string, enum: [create_project_and_promotions, create_promotions_in_existing_project, update_promotion_budget, update_promotion_materials, pause_promotion, resume_promotion] }
        scope: { type: string, const: controlled_remote_write }
        budget_limit_minor: { type: integer, minimum: 0 }
        currency: { type: string, const: CNY }
        action_hash: { $ref: '#/components/schemas/CanonicalHash' }
        approved_by: { type: string }
        approved_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    ControlledExecution:
      type: object
      additionalProperties: false
      required: [id, organization_id, project_id, controlled_change_set_id, remote_write_approval_id, status, version, created_by, created_at, updated_at]
      properties:
        id: { type: string }
        organization_id: { type: string }
        project_id: { type: string }
        controlled_change_set_id: { type: string }
        remote_write_approval_id: { type: string }
        browser_rpa_run_id: { type: string }
        status: { type: string, enum: [pending, running, succeeded, failed, partial, result_unknown, cancelled] }
        version: { type: integer, minimum: 1 }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    BrowserRpaLaunchResult:
      type: object
      additionalProperties: false
      required: [run_id]
      properties:
        run_id: { type: string, minLength: 1 }
    StartBrowserRpaExecutionResult:
      type: object
      additionalProperties: false
      required: [controlled_change_set, controlled_execution, browser_rpa_run]
      properties:
        controlled_change_set: { $ref: '#/components/schemas/ControlledChangeSet' }
        controlled_execution: { $ref: '#/components/schemas/ControlledExecution' }
        browser_rpa_run: { $ref: '#/components/schemas/BrowserRpaLaunchResult' }
    CreatePlatformEntityMappingRequest:
      type: object
      additionalProperties: false
      required: [id, account_reference_id, plan_id, configuration_id, business_execution_id, browser_rpa_run_id, internal_object_kind, internal_object_id, platform_object_kind]
      properties:
        id: { type: string, minLength: 1 }
        account_reference_id: { type: string, minLength: 1 }
        plan_id: { type: string, minLength: 1 }
        configuration_id: { type: string, minLength: 1 }
        business_execution_id: { type: string, minLength: 1 }
        browser_rpa_run_id: { type: string, minLength: 1 }
        internal_object_kind: { type: string, minLength: 1 }
        internal_object_id: { type: string, minLength: 1 }
        platform_object_kind: { type: string, minLength: 1 }
    PlatformEntityMapping:
      type: object
      additionalProperties: false
      required: [schema_version, id, organization_id, project_id, account_reference_id, plan_id, configuration_id, business_execution_id, browser_rpa_run_id, internal_object_kind, internal_object_id, platform_object_kind, status, version, created_at, updated_at]
      properties:
        schema_version: { type: string, const: delivery-platform-entity-mapping/v1 }
        id: { type: string }
        organization_id: { type: string }
        project_id: { type: string }
        account_reference_id: { type: string }
        plan_id: { type: string }
        configuration_id: { type: string }
        business_execution_id: { type: string }
        browser_rpa_run_id: { type: string }
        internal_object_kind: { type: string }
        internal_object_id: { type: string }
        platform_object_kind: { type: string }
        platform_object_id: { type: string }
        platform_status: { type: string }
        current_state_action: { type: string, enum: [update_promotion_budget, update_promotion_materials, pause_promotion, resume_promotion] }
        current_state_hash: { $ref: '#/components/schemas/CanonicalHash' }
        result_evidence_id: { type: string }
        list_evidence_id: { type: string }
        status: { type: string, enum: [pending_verification, confirmed] }
