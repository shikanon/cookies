openapi: 3.1.0
info:
  title: Cookies Delivery API
  version: 2.0.0
  description: Immutable DeliveryIntent and tagged PlatformConfiguration plans, authoritative preflight, content-bound approvals, and legacy read-only history.
servers:
  - url: /
security:
  - sessionCookie: []
paths:
  /api/delivery/v1/projects/{project_id}/plans:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    get:
      operationId: listDeliveryPlans
      summary: List project-scoped delivery plans
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Mock plan list with explicit provenance.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanList' }
        '403': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createDeliveryPlan
      summary: Create an immutable DeliveryIntent and tagged PlatformConfiguration plan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePlan' }
      responses:
        '201':
          description: Plan and immutable V1 created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryPlan' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /api/delivery/v1/projects/{project_id}/plans/{plan_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/PlanID'
    get:
      operationId: getDeliveryPlan
      summary: Get a project-scoped delivery plan and all immutable versions
      responses:
        '200':
          description: Current plan projection and immutable history.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryPlan' }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateDeliveryPlan
      summary: Create a new immutable plan version using optimistic concurrency
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePlan' }
      responses:
        '200':
          description: Updated current projection with retained history.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryPlan' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409':
          description: VERSION_CONFLICT; expected_version is stale.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /api/delivery/v1/projects/{project_id}/plans/{plan_id}/versions:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/PlanID'
    get:
      operationId: listDeliveryPlanVersions
      summary: List immutable plan versions
      responses:
        '200':
          description: Immutable history with mock provenance.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanVersionList' }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /api/delivery/v1/projects/{project_id}/plans/{plan_id}/versions/{version}:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/PlanID'
      - $ref: '#/components/parameters/PlanVersion'
    get:
      operationId: getDeliveryPlanVersion
      summary: Read one immutable plan version
      responses:
        '200':
          description: Exact immutable version.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryPlanVersion' }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /api/delivery/v1/projects/{project_id}/plans/{plan_id}/preflight:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/PlanID'
    post:
      operationId: preflightDeliveryPlan
      summary: Run the server-authoritative preflight rules on the current version
      responses:
        '200':
          description: Structured error and warning checks with repair targets.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreflightResult' }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /api/delivery/v1/projects/{project_id}/plans/{plan_id}/configuration:compile:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/PlanID'
    post:
      deprecated: true
      operationId: compileDeliveryPlanConfiguration
      summary: Rejected legacy ThreeTier write endpoint
      description: Always returns LEGACY_CONFIGURATION_UNSUPPORTED. Legacy ThreeTier snapshots remain readable but immutable.
      requestBody: { $ref: '#/components/requestBodies/CompileDeliveryConfiguration' }
      responses:
        '201':
          description: A new immutable PlanVersion containing the server-authored three-tier snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryPlan' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /api/delivery/v1/projects/{project_id}/plans/{plan_id}/configuration:override:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/PlanID'
    post:
      deprecated: true
      operationId: overrideDeliveryPlanConfigurationField
      summary: Rejected legacy ThreeTier write endpoint
      description: Always returns LEGACY_CONFIGURATION_UNSUPPORTED. Create a new DeliveryIntent and PlatformConfiguration version instead.
      requestBody: { $ref: '#/components/requestBodies/OverrideDeliveryConfigurationField' }
      responses:
        '200':
          description: Updated current projection with a newly immutable three-tier PlanVersion.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryPlan' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /api/delivery/v1/projects/{project_id}/plans/{plan_id}/recommendations:generate:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/PlanID'
    post:
      operationId: generateDeliveryRecommendation
      summary: Generate one deterministic optimization recommendation from post-launch simulation evidence
      description: >-
        Requires a succeeded platform-operation rehearsal, two persisted metric windows, and
        monitoring alerts for the same execution. The recommendation freezes those exact evidence
        references and never writes to a real platform.
      requestBody: { $ref: '#/components/requestBodies/ExpectedVersion' }
      responses:
        '201':
          description: Proposed recommendation with frozen evidence, base, and target snapshots.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryRecommendation' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /api/delivery/v1/projects/{project_id}/plans/{plan_id}/detail:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/PlanID'
    get:
      operationId: getDeliveryPlanDetail
      summary: Get a plan with its ChangeSets and execution history
      responses:
        '200':
          description: Plan control-loop detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanDetail' }
        default: { $ref: '#/components/responses/Problem' }
  /api/delivery/v1/projects/{project_id}/plans/{plan_id}:create-change-set:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/PlanID'
    post:
      operationId: createDeliveryChangeSet
      summary: Freeze the exact current PlanVersion in a new ChangeSet
      requestBody: { $ref: '#/components/requestBodies/ExpectedVersion' }
      responses:
        '201': { $ref: '#/components/responses/ChangeSet' }
        '412': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /api/delivery/v1/projects/{project_id}/change-sets:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    get:
      operationId: listDeliveryChangeSets
      summary: List project-scoped Delivery ChangeSets with current approval validity
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: ChangeSet approval queue with explicit mock provenance.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangeSetList' }
        '403': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /api/delivery/v1/projects/{project_id}/recommendations:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    get:
      operationId: listDeliveryRecommendations
      summary: List project-scoped deterministic delivery recommendations
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Recommendations with explicit mock provenance.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryRecommendationList' }
        '403': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /api/delivery/v1/projects/{project_id}/recommendations/{recommendation_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/RecommendationID'
    get:
      operationId: getDeliveryRecommendation
      summary: Get one project-scoped immutable recommendation
      responses:
        '200':
          description: Recommendation and its frozen snapshots.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryRecommendation' }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /api/delivery/v1/projects/{project_id}/recommendations/{recommendation_id}:accept:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/RecommendationID'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      operationId: acceptDeliveryRecommendation
      summary: Accept a recommendation and create only one new draft ChangeSet
      description: >-
        Acceptance does not mutate the Plan, preflight or approve the ChangeSet,
        execute an action, or write a platform. The Idempotency-Key is scoped to
        the organization, project and accept operation; replaying the same
        canonical request returns the same decision and ChangeSet.
      requestBody: { $ref: '#/components/requestBodies/ExpectedVersion' }
      responses:
        '201': { $ref: '#/components/responses/RecommendationDecision' }
        '200':
          description: Idempotent replay of the original accepted decision.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecommendationDecisionResult' }
        '409':
          description: IDEMPOTENCY_CONFLICT, INVALID_STATE, or VERSION_CONFLICT.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /api/delivery/v1/projects/{project_id}/recommendations/{recommendation_id}:reject:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/RecommendationID'
    post:
      operationId: rejectDeliveryRecommendation
      summary: Reject a proposed recommendation without modifying a Plan or ChangeSet
      requestBody: { $ref: '#/components/requestBodies/ExpectedVersion' }
      responses:
        '200':
          description: Rejected recommendation decision.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryRecommendation' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /api/delivery/v1/projects/{project_id}/change-sets/{change_set_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/ChangeSetID'
    get:
      operationId: getDeliveryChangeSet
      summary: Get one ChangeSet and its immutable approval audit projection
      responses:
        '200': { $ref: '#/components/responses/ChangeSet' }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /api/delivery/v1/projects/{project_id}/change-sets/{change_set_id}:preflight:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/ChangeSetID'
    post:
      operationId: preflightDeliveryChangeSet
      summary: Reuse the Plan rule engine and reject stale frozen PlanVersions
      requestBody: { $ref: '#/components/requestBodies/ExpectedVersion' }
      responses:
        '200': { $ref: '#/components/responses/ChangeSet' }
        '409':
          description: INVALID_STATE or STALE_PLAN_VERSION.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /api/delivery/v1/projects/{project_id}/change-sets/{change_set_id}/manual-action-package:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/ChangeSetID'
    get:
      operationId: getDeliveryManualActionPackage
      summary: Read an immutable approved-only manual action package
      responses:
        '200':
          description: Immutable manual action package. Its content never implies a platform write.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManualActionPackage' }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: compileDeliveryManualActionPackage
      summary: Compile or idempotently replay the approved ChangeSet manual action package
      requestBody: { $ref: '#/components/requestBodies/ExpectedVersion' }
      responses:
        '201':
          description: New immutable manual action package compiled from an approved ChangeSet.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManualActionPackage' }
        '200':
          description: Idempotent replay of the already compiled package.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManualActionPackage' }
        '409':
          description: APPROVAL_REQUIRED, INVALID_STATE, or VERSION_CONFLICT.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /api/delivery/v1/projects/{project_id}/change-sets/{change_set_id}:approve:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/ChangeSetID'
    post:
      operationId: approveDeliveryChangeSet
      summary: Approve the current immutable content snapshot for execute_mock
      requestBody: { $ref: '#/components/requestBodies/ExpectedVersion' }
      responses:
        '200': { $ref: '#/components/responses/ChangeSet' }
        '403':
          description: SCOPE_REQUIRED when ActorContext lacks delivery.approve.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: INVALID_STATE, STALE_PLAN_VERSION, or content mismatch.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /api/delivery/v1/projects/{project_id}/change-sets/{change_set_id}:reject:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/ChangeSetID'
    post:
      operationId: rejectDeliveryChangeSet
      summary: Return the submitted change request with a durable revision reason
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_version, reason]
              properties:
                expected_version: { type: integer, minimum: 1 }
                reason: { type: string, minLength: 3, maxLength: 1000 }
      responses:
        '200': { $ref: '#/components/responses/ChangeSet' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /api/delivery/v1/projects/{project_id}/change-sets/{change_set_id}:execute:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/ChangeSetID'
    post:
      operationId: executeDeliveryChangeSet
      summary: Start or replay a project-scoped deterministic mock execution
      description: >-
        A ChangeSet represents approved action content; an Execution represents one
        idempotent attempt to perform it. The request hash is the SHA-256 of the
        RFC 8785 JCS canonical JSON object containing organization_id, project_id,
        change_set_id, expected_version, scenario, and the fixed operation name
        `execute_mock`.
        The Idempotency-Key is not part of that hash. Reusing a key with the same
        hash returns the original durable Execution; reusing it with another hash
        returns IDEMPOTENCY_CONFLICT and never starts another attempt.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/ExecuteChangeSet' }
      responses:
        '201':
          description: A new durable simulated execution and evidence were created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExecutionResult' }
        '200':
          description: The same Idempotency-Key and canonical request hash replayed the original execution.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExecutionResult' }
        '403':
          description: SCOPE_REQUIRED or APPROVAL_SCOPE_EXCEEDED.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: IDEMPOTENCY_CONFLICT, APPROVAL_REQUIRED, APPROVAL_EXPIRED, APPROVAL_CONTENT_MISMATCH, INVALID_STATE, or STALE_PLAN_VERSION.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /api/delivery/v1/projects/{project_id}/change-sets/{change_set_id}:rollback:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/ChangeSetID'
    post:
      operationId: rollbackDeliveryChangeSet
      summary: Record the legacy mock rollback lifecycle transition for a succeeded execution
      description: >-
        This compatibility transition is accepted only when the ChangeSet's durable
        Execution is completed and succeeded. Failed has no target effect to roll back;
        partial requires a new controlled compensation ChangeSet; result_unknown and
        non-terminal executions must be queried and reconciled first.
      requestBody: { $ref: '#/components/requestBodies/ExpectedVersion' }
      responses:
        '200': { $ref: '#/components/responses/ChangeSet' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /api/delivery/v1/projects/{project_id}/executions:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    get:
      operationId: listDeliveryExecutions
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Project-scoped durable execution evidence, ordered by most recent first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExecutionList' }
        default: { $ref: '#/components/responses/Problem' }
  /api/delivery/v1/projects/{project_id}/executions/{execution_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/ExecutionID'
    get:
      operationId: getDeliveryExecution
      summary: Get one project-scoped durable execution, steps, recovery decision, and evidence
      responses:
        '200':
          description: The execution and its persisted step/evidence projection.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExecutionResult' }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /api/delivery/v1/projects/{project_id}/executions/{execution_id}/metric-snapshots:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/ExecutionID'
    post:
      operationId: createDemoDeliveryMetricSnapshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [dataset_version]
              properties:
                dataset_version: { type: string, const: post-launch-simulator/v1 }
      responses:
        '201':
          description: Immutable simulated metric snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryMetricSnapshot' }
        default: { $ref: '#/components/responses/Problem' }
    get:
      operationId: listDeliveryMetricSnapshots
      responses:
        '200':
          description: Metric snapshots.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/DeliveryMetricSnapshot' }
        default: { $ref: '#/components/responses/Problem' }
  /api/delivery/v1/projects/{project_id}/alerts:evaluate:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    post:
      operationId: evaluateDeliveryMonitoringAlerts
      summary: Evaluate deterministic project-scoped monitoring alerts from one fixture
      description: >-
        This controlled mock evaluation never polls or writes a real advertising
        platform. It evaluates the selected fixture, persists any resulting alert
        projections with their evaluated metric windows.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlertEvaluationRequest' }
      responses:
        '200':
          description: Fixture evaluation and its resulting alerts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertEvaluationResult' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /api/delivery/v1/projects/{project_id}/alerts:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    get:
      operationId: listDeliveryMonitoringAlerts
      summary: List project-scoped monitoring alerts with cursor pagination
      parameters:
        - $ref: '#/components/parameters/AlertPlanFilter'
        - $ref: '#/components/parameters/AlertExecutionFilter'
        - $ref: '#/components/parameters/AlertStatusFilter'
        - $ref: '#/components/parameters/AlertTypeFilter'
        - $ref: '#/components/parameters/AlertSeverityFilter'
        - $ref: '#/components/parameters/AlertFixtureFilter'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Alerts ordered by most recently triggered first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertList' }
        '403': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /api/delivery/v1/projects/{project_id}/alerts/{alert_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/AlertID'
    patch:
      operationId: updateDeliveryMonitoringAlert
      summary: Acknowledge or dismiss an open project-scoped monitoring alert
      description: >-
        The only valid transitions are open to acknowledged or open to dismissed.
        expected_version provides optimistic concurrency; terminal alert states
        cannot be reopened through this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAlert' }
      responses:
        '200':
          description: Updated alert projection.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryMonitoringAlert' }
        '404': { $ref: '#/components/responses/Problem' }
        '409':
          description: VERSION_CONFLICT or INVALID_STATE.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /api/delivery/v1/projects/{project_id}/tour-runs/{run_id}:prepare:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/TourRunID'
    post:
      operationId: prepareDeliveryTourRun
      summary: Deterministically prepare an owner-scoped complete mock delivery tour
      description: >-
        Replaying a prepared run returns the same seven case plans without duplication.
        A partially prepared run is first reset through its exact ownership boundary and
        then rebuilt. This endpoint never writes to a real advertising platform.
      responses:
        '201':
          description: A new run and its seven deterministic cases were prepared.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryTourRun' }
        '200':
          description: The already prepared run was replayed without duplication.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryTourRun' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /api/delivery/v1/projects/{project_id}/executions/{execution_id}/simulation-runs:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/ExecutionID'
    post:
      operationId: createDeliveryOutcomeSimulationRun
      summary: Run a deterministic post-launch outcome scenario after a successful platform-operation rehearsal
      description: >-
        This rule-driven Mock simulation does not predict real advertising performance.
        The exact PlanVersion, approved configuration, scenario and stable seed form
        an idempotent input; matching inputs replay the same SimulationRun and metric windows.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOutcomeSimulationRequest' }
      responses:
        '200':
          description: Existing deterministic run replayed.
          content: { application/json: { schema: { $ref: '#/components/schemas/OutcomeSimulationResult' } } }
        '201':
          description: New deterministic run and metric windows created.
          content: { application/json: { schema: { $ref: '#/components/schemas/OutcomeSimulationResult' } } }
        default: { $ref: '#/components/responses/Problem' }
  /api/delivery/v1/projects/{project_id}/executions/{execution_id}/simulation-run:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/ExecutionID'
    get:
      operationId: getLatestDeliveryOutcomeSimulationRun
      summary: Read the latest persisted outcome simulation for an execution
      responses:
        '200':
          description: Latest run and its metric windows.
          content: { application/json: { schema: { $ref: '#/components/schemas/OutcomeSimulationResult' } } }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /api/delivery/v1/projects/{project_id}/tour-runs/{run_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/TourRunID'
    get:
      operationId: getDeliveryTourRun
      summary: Read authoritative tour progress and resumable URLs
      responses:
        '200':
          description: The run, seven cases, and progress derived from persisted delivery authority data.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryTourRun' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /api/delivery/v1/projects/{project_id}/tour-runs/{run_id}:reset:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/TourRunID'
    post:
      operationId: resetDeliveryTourRun
      summary: Delete only the selected owner's exact tour-run causal closure
      description: >-
        Isolation is the authenticated organization, active project, stable run ID, and
        authenticated owner. Ordinary plans and other owners or runs are not selected.
      responses:
        '200':
          description: The run was marked reset and exact deletion counts are returned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryTourResetResult' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: cookies_session
  parameters:
    ProjectID:
      name: project_id
      in: path
      required: true
      schema: { type: string }
    PlanID:
      name: plan_id
      in: path
      required: true
      schema: { type: string }
    PlanVersion:
      name: version
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    ChangeSetID:
      name: change_set_id
      in: path
      required: true
      schema: { type: string }
    ExecutionID:
      name: execution_id
      in: path
      required: true
      schema: { type: string }
    AlertID:
      name: alert_id
      in: path
      required: true
      schema: { type: string }
    RecommendationID:
      name: recommendation_id
      in: path
      required: true
      schema: { type: string }
    TourRunID:
      name: run_id
      in: path
      required: true
      description: Stable caller-chosen run ID, scoped by organization, project, and authenticated owner.
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9_-]{2,63}$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Caller-chosen stable key for one execution request. It is scoped to the authenticated organization, project, and execute operation.
      schema: { type: string, minLength: 1, maxLength: 255 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    Cursor:
      name: cursor
      in: query
      description: Opaque continuation cursor returned by the previous alert list response.
      schema: { type: string, minLength: 1 }
    AlertStatusFilter:
      name: status
      in: query
      schema: { $ref: '#/components/schemas/AlertStatus' }
    AlertPlanFilter:
      name: plan_id
      in: query
      description: Restrict results to one DeliveryPlan inside the current Project.
      schema: { type: string, minLength: 1 }
    AlertExecutionFilter:
      name: execution_id
      in: query
      description: Restrict results to one Execution inside the current Project.
      schema: { type: string, minLength: 1 }
    AlertTypeFilter:
      name: type
      in: query
      schema: { $ref: '#/components/schemas/AlertType' }
    AlertSeverityFilter:
      name: severity
      in: query
      schema: { $ref: '#/components/schemas/AlertSeverity' }
    AlertFixtureFilter:
      name: fixture
      in: query
      schema: { $ref: '#/components/schemas/MonitoringFixture' }
  requestBodies:
    ExpectedVersion:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [expected_version]
            properties:
              expected_version: { type: integer, minimum: 1 }
    ExecuteChangeSet:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [expected_version, scenario]
            properties:
              expected_version: { type: integer, minimum: 1 }
              scenario: { $ref: '#/components/schemas/ExecutionScenario' }
    CompileDeliveryConfiguration:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [expected_version, fixture]
            properties:
              expected_version: { type: integer, minimum: 1 }
              fixture: { $ref: '#/components/schemas/DeliveryConfigurationFixture' }
    OverrideDeliveryConfigurationField:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [expected_version, group_id, plan_id, creative_id, field_key, value, confirmed]
            properties:
              expected_version: { type: integer, minimum: 1 }
              group_id: { type: string, minLength: 1 }
              plan_id: { type: string, minLength: 1 }
              creative_id: { type: string, minLength: 1 }
              field_key: { type: string, minLength: 1 }
              value: { $ref: '#/components/schemas/DeliveryFieldValue' }
              confirmed: { type: boolean }
  responses:
    ChangeSet:
      description: Updated ChangeSet.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ChangeSet' }
    RecommendationDecision:
      description: Accepted recommendation decision and exactly one new draft ChangeSet.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RecommendationDecisionResult' }
    DeliveryTourCaseKey:
      type: string
      enum: [golden_path, preflight_failure, approval_expired, plan_stale, partial_execution, result_unknown, review_rejected_alert]
    DeliveryTourRunStatus:
      type: string
      enum: [preparing, prepared, reset]
    DeliveryTourCase:
      type: object
      additionalProperties: false
      required: [key, title, plan_id, status, expected_outcome, start_url, source, scenario, evidence, observed_at]
      properties:
        key: { $ref: '#/components/schemas/DeliveryTourCaseKey' }
        title: { type: string }
        plan_id: { type: string }
        status: { type: string, enum: [missing, prepared, ready, observed] }
        expected_outcome: { type: string }
        start_url: { type: string }
        source: { type: string, const: mock }
        scenario: { $ref: '#/components/schemas/DeliveryTourCaseKey' }
        evidence:
          type: array
          items: { type: string }
        observed_at: { type: string, format: date-time }
    DeliveryTourStep:
      type: object
      additionalProperties: false
      required: [key, title, completion_condition, complete, url, explanation, evidence]
      properties:
        key:
          type: string
          enum: [plan_creation, configuration, first_approval, execution, monitoring, recommendation, new_change_set, second_approval, manual_action_package]
        title: { type: string }
        completion_condition: { type: string }
        complete: { type: boolean }
        url: { type: string }
        explanation: { type: string }
        evidence:
          type: array
          items: { type: string }
    DeliveryTourRun:
      type: object
      additionalProperties: false
      required: [id, organization_id, project_id, owner_id, status, source, scenario, prepared_at, reset_at, created_at, updated_at, cases, steps, current_step, suggested_next_url]
      properties:
        id: { type: string, pattern: '^[a-z0-9][a-z0-9_-]{2,63}$' }
        organization_id: { type: string }
        project_id: { type: string }
        owner_id: { type: string }
        status: { $ref: '#/components/schemas/DeliveryTourRunStatus' }
        source: { type: string, const: mock }
        scenario: { type: string, const: delivery_tour }
        prepared_at:
          oneOf:
            - { type: string, format: date-time }
            - { type: 'null' }
        reset_at:
          oneOf:
            - { type: string, format: date-time }
            - { type: 'null' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        cases:
          type: array
          minItems: 7
          maxItems: 7
          items: { $ref: '#/components/schemas/DeliveryTourCase' }
        steps:
          type: array
          minItems: 9
          maxItems: 9
          items: { $ref: '#/components/schemas/DeliveryTourStep' }
        current_step:
          type: string
          enum: [plan_creation, configuration, first_approval, execution, monitoring, recommendation, new_change_set, second_approval, manual_action_package, complete]
        suggested_next_url: { type: string }
    DeliveryTourResetResult:
      type: object
      additionalProperties: false
      required: [run, deleted, source, scenario, reset_at, isolation_key]
      properties:
        run: { $ref: '#/components/schemas/DeliveryTourRun' }
        deleted:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
        source: { type: string, const: mock }
        scenario: { type: string, const: delivery_tour_reset }
        reset_at: { type: string, format: date-time }
        isolation_key: { type: string }
    Problem:
      description: Cookies problem response.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Principal:
      type: object
      additionalProperties: false
      required: [kind, id]
      properties:
        kind: { type: string, enum: [user, service] }
        id: { type: string }
    Advertiser:
      type: object
      additionalProperties: false
      required: [id, name, platform]
      properties:
        id: { type: string }
        name: { type: string }
        platform: { type: string, const: ocean_engine }
        source: { type: string, const: mock }
        scenario: { $ref: '#/components/schemas/Scenario' }
    Budget:
      type: object
      additionalProperties: false
      required: [total_minor, currency]
      properties:
        total_minor:
          type: integer
          minimum: 0
          description: Draft persistence allows zero; authoritative preflight requires a positive value.
        currency: { type: string, const: CNY }
    Schedule:
      type: object
      additionalProperties: false
      required: [start_at, end_at, timezone]
      properties:
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time }
        timezone: { type: string }
    Tracking:
      type: object
      additionalProperties: false
      required: [landing_page, pixel_id, conversion_event]
      properties:
        landing_page: { type: string }
        pixel_id: { type: string }
        conversion_event: { type: string }
    CreativeReference:
      type: object
      additionalProperties: false
      required: [asset_id, version, confirmed, content_hash, route]
      properties:
        asset_id: { type: string }
        version: { type: integer, minimum: 1 }
        confirmed: { type: boolean }
        content_hash: { $ref: '#/components/schemas/CanonicalHash' }
        route: { type: string, minLength: 1 }
    StrategyReference:
      type: object
      additionalProperties: false
      required: [task_id, version, content_hash, route]
      properties:
        task_id: { type: string, minLength: 1 }
        version: { type: integer, minimum: 1 }
        content_hash: { $ref: '#/components/schemas/CanonicalHash' }
        route: { type: string, minLength: 1 }
    PlanDraft:
      type: object
      additionalProperties: false
      required: [name, objective, advertiser, budget, schedule, tracking, creative_references, strategy_reference, source_strategy_version]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        objective: { type: string, minLength: 1, maxLength: 2000 }
        advertiser: { $ref: '#/components/schemas/Advertiser' }
        budget: { $ref: '#/components/schemas/Budget' }
        schedule: { $ref: '#/components/schemas/Schedule' }
        tracking: { $ref: '#/components/schemas/Tracking' }
        creative_references:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/CreativeReference' }
        strategy_reference: { $ref: '#/components/schemas/StrategyReference' }
        source_strategy_version: { type: string }
    StableReference:
      type: object
      additionalProperties: false
      required: [namespace, object_kind, scope, state]
      properties:
        namespace: { type: string, minLength: 1 }
        object_kind: { type: string, minLength: 1 }
        scope: { type: string, minLength: 1 }
        id: { type: string }
        version: { type: string }
        content_hash: { $ref: '#/components/schemas/CanonicalHash' }
        state: { type: string, enum: [resolved, unresolved, blocked, redacted] }
        reason: { type: string }
        display_name_snapshot: { type: string }
        evidence_version: { type: string }
    DeliveryIntent:
      type: object
      additionalProperties: false
      required: [schema_version, intent_id, version_number, hash_algorithm, payload, configuration_provenance, fact_provenance]
      properties:
        schema_version: { type: string, const: delivery-intent/v1 }
        intent_id: { type: string, minLength: 1 }
        version_number: { type: integer, minimum: 1 }
        hash_algorithm: { type: string, const: RFC8785-JCS-SHA256(canonical_payload) }
        canonical_hash: { $ref: '#/components/schemas/CanonicalHash' }
        payload:
          type: object
          required: [payload_schema_version, marketing_objective, budget_boundary, schedule_boundary, optimization_preferences, material_references, audience_constraints, strategy_reference]
          properties:
            payload_schema_version: { type: string, const: delivery-intent/v1 }
            marketing_objective: { type: string, minLength: 1 }
            budget_boundary: { type: object }
            schedule_boundary: { type: object }
            optimization_preferences: { type: array, items: { type: object } }
            product_references: { type: array, items: { $ref: '#/components/schemas/StableReference' } }
            landing_page_references: { type: array, items: { $ref: '#/components/schemas/StableReference' } }
            material_references: { type: array, minItems: 1, items: { $ref: '#/components/schemas/StableReference' } }
            audience_constraints: { type: object }
            strategy_reference: { $ref: '#/components/schemas/StableReference' }
        configuration_provenance: { type: object }
        fact_provenance: { type: object }
        audit: { type: object, readOnly: true }
    PlatformConfiguration:
      type: object
      additionalProperties: false
      required: [schema_version, configuration_id, version_number, platform, profile_version, hash_algorithm, payload, configuration_provenance, fact_provenance, compilation_metadata]
      properties:
        schema_version: { type: string, const: delivery-platform-configuration/v2 }
        configuration_id: { type: string, minLength: 1 }
        version_number: { type: integer, minimum: 1 }
        platform: { type: string, enum: [ocean_engine, magnetic_engine] }
        profile_version: { type: string, enum: [oceanengine-configuration/v1, magnetic-engine-configuration/v1] }
        intent: { type: object, readOnly: true }
        hash_algorithm: { type: string, const: RFC8785-JCS-SHA256(canonical_payload) }
        canonical_hash: { $ref: '#/components/schemas/CanonicalHash' }
        payload:
          oneOf:
            - $ref: '#/components/schemas/OceanEngineConfigurationPayload'
            - $ref: '#/components/schemas/MagneticEngineConfigurationPayload'
        configuration_provenance: { type: object }
        fact_provenance: { type: object }
        audit: { type: object, readOnly: true }
        compilation_metadata: { type: object }
    OceanEngineConfigurationPayload:
      type: object
      additionalProperties: false
      required: [profile, ocean_engine]
      properties:
        profile: { type: string, const: ocean_engine }
        ocean_engine:
          type: object
          additionalProperties: false
          required: [profile, project, promotions]
          properties:
            profile: { type: string, const: ocean_engine }
            project: { type: object, description: Exactly one OceanEngine Project draft. }
            promotions: { type: array, minItems: 0, items: { type: object } }
    MagneticEngineConfigurationPayload:
      type: object
      additionalProperties: false
      required: [profile, magnetic_engine]
      properties:
        profile: { type: string, const: magnetic_engine }
        magnetic_engine:
          type: object
          additionalProperties: false
          required: [profile, status, reason_code, reason]
          properties:
            profile: { type: string, const: magnetic_engine }
            status: { type: string, const: capability_pending }
            reason_code: { type: string, const: CAPABILITY_PENDING }
            reason: { type: string, minLength: 1 }
    CreatePlan:
      type: object
      additionalProperties: false
      required: [intent, platform_configuration]
      properties:
        intent: { $ref: '#/components/schemas/DeliveryIntent' }
        platform_configuration: { $ref: '#/components/schemas/PlatformConfiguration' }
    UpdatePlan:
      type: object
      additionalProperties: false
      required: [expected_version, intent, platform_configuration]
      properties:
        expected_version: { type: integer, minimum: 1 }
        intent: { $ref: '#/components/schemas/DeliveryIntent' }
        platform_configuration: { $ref: '#/components/schemas/PlatformConfiguration' }
    DeliveryPlanVersion:
      oneOf:
        - $ref: '#/components/schemas/PlatformDeliveryPlanVersion'
        - $ref: '#/components/schemas/LegacyDeliveryPlanVersion'
    PlatformDeliveryPlanVersion:
      type: object
      additionalProperties: false
      required: [schema_version, runtime_status, plan_id, organization_id, project_id, version_number, canonical_hash, intent, platform_configuration, platform, source, scenario, created_by, created_at]
      properties:
        schema_version: { type: string, const: delivery-plan-version/v2 }
        runtime_status: { type: string, enum: [active, capability_pending] }
        read_only: { type: boolean, const: false }
        plan_id: { type: string }
        organization_id: { type: string }
        project_id: { type: string }
        version_number: { type: integer, minimum: 1 }
        canonical_hash: { $ref: '#/components/schemas/CanonicalHash', description: Exactly equals platform_configuration.canonical_hash. }
        intent: { $ref: '#/components/schemas/DeliveryIntent' }
        platform_configuration: { $ref: '#/components/schemas/PlatformConfiguration' }
        platform: { type: string, enum: [ocean_engine, magnetic_engine] }
        source: { type: string, const: mock }
        scenario: { type: string, enum: [platform_configuration, capability_pending] }
        created_by: { $ref: '#/components/schemas/Principal' }
        created_at: { type: string, format: date-time }
    LegacyDeliveryPlanVersion:
      allOf:
        - $ref: '#/components/schemas/PlanDraft'
        - type: object
          required: [runtime_status, read_only, plan_id, organization_id, project_id, version_number, canonical_hash, platform, source, scenario, created_by, created_at]
          properties:
            runtime_status: { type: string, const: legacy_unsupported }
            read_only: { type: boolean, const: true }
            plan_id: { type: string }
            organization_id: { type: string }
            project_id: { type: string }
            version_number: { type: integer, minimum: 1 }
            canonical_hash: { $ref: '#/components/schemas/CanonicalHash' }
            three_tier_configuration: { $ref: '#/components/schemas/DeliveryConfigurationSnapshot' }
            platform: { type: string, const: ocean_engine_mock }
            source: { type: string, const: mock }
            scenario: { $ref: '#/components/schemas/Scenario' }
            created_by: { $ref: '#/components/schemas/Principal' }
            created_at: { type: string, format: date-time }
    DeliveryPlan:
      type: object
      required: [id, organization_id, project_id, creative_package_id, creative_package_hash, creative_version_id, name, objective, budget_cents, start_at, end_at, status, version, platform, source, scenario, current_version_number, current_version, versions, created_by, created_at, updated_at]
      properties:
        id: { type: string }
        organization_id: { type: string }
        project_id: { type: string }
        creative_package_id: { type: string }
        creative_package_hash: { type: string }
        creative_version_id: { type: string }
        name: { type: string }
        objective: { type: string }
        budget_cents: { type: integer, minimum: 0 }
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time }
        status: { type: string, const: draft }
        version: { type: integer, minimum: 1 }
        platform: { type: string, enum: [ocean_engine, magnetic_engine, ocean_engine_mock] }
        source: { type: string, const: mock }
        scenario: { $ref: '#/components/schemas/Scenario' }
        tour_run_id:
          oneOf:
            - { type: string, pattern: '^[a-z0-9][a-z0-9_-]{2,63}$' }
            - { type: 'null' }
        tour_owner_id:
          oneOf:
            - { type: string }
            - { type: 'null' }
        tour_case:
          oneOf:
            - { $ref: '#/components/schemas/DeliveryTourCaseKey' }
            - { type: 'null' }
        current_version_number: { type: integer, minimum: 1 }
        current_version: { $ref: '#/components/schemas/DeliveryPlanVersion' }
        versions:
          type: array
          items: { $ref: '#/components/schemas/DeliveryPlanVersion' }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Scenario:
      type: string
      enum: [golden_path, budget_zero, creative_unconfirmed, tracking_missing, incomplete_draft, project_plan_list, approval_queue, missing_required_field, orphan_dependency, missing_confirmation, platform_fields_pending, platform_configuration, capability_pending, recommendation_generated, recommendation_accepted, recommendation_rejected, manual_action_package, preflight_failure, approval_expired, plan_stale, partial_execution, result_unknown, review_rejected_alert]
    PlanList:
      type: object
      required: [items, source, scenario]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DeliveryPlan' }
        source: { type: string, const: mock }
        scenario: { type: string, const: project_plan_list }
    PlanVersionList:
      type: object
      required: [items, source, scenario]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DeliveryPlanVersion' }
        source: { type: string, const: mock }
        scenario: { type: string, const: project_plan_list }
    RepairTarget:
      type: object
      required: [field, section, label]
      properties:
        field: { type: string }
