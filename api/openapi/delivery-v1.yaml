      type: object
      additionalProperties: false
      required: [id, sequence, action, status, attempt, effect, outcome_summary, evidence_ref, started_at, completed_at, version]
      properties:
        id: { type: string }
        sequence: { type: integer, minimum: 1 }
        action: { type: string }
        status: { $ref: '#/components/schemas/ExecutionStepStatus' }
        attempt: { type: integer, minimum: 0 }
        effect:
          type: string
          enum: [confirmed_applied, confirmed_not_applied, unknown, none]
          description: Known target effect. A failed step means this effect was definitely not produced; an unknown result does not make that claim.
