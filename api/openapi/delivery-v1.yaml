        schema: { type: string, minLength: 1 }
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      operationId: selectDeliveryDecisionCandidate
      summary: Select one candidate and compile a write-disabled workflow
      description: >-
        Creates a new immutable PlatformConfiguration version and deterministic workflow. It does
        not create a formal approval. The result stops at ready_for_final_approval, and every
