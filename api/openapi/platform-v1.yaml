  /api/creative/v1/projects/{project_id}/plans/{plan_id}/image-jobs:
    post:
      operationId: createCreativeImageJob
      summary: Submit an existing image plan through the Provider job boundary.
      parameters:
      - $ref: '#/components/parameters/ProjectID'
      - name: plan_id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCreativeImageJobRequest'
      responses:
        '202':
          description: Provider job accepted; final assets enter generated intake.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderJob'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/ProjectAccessDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
components:
  parameters:
    ProjectID:
      name: project_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ArtifactID:
      name: artifact_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    AssetID:
      name: asset_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    AssetVersionNumber:
      name: version
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
        pattern: ^[A-Za-z0-9_-]+$
    OptionalIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Defaults to provider-job-{provider_job_id}-output-{output_id} for generated intake.
      schema:
        type: string
        minLength: 1
        maxLength: 255
        pattern: ^[A-Za-z0-9_-]+$
    JobID:
      name: job_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    IntakeID:
      name: intake_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    UploadID:
      name: upload_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    TaskID:
      name: task_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    OperationID:
      name: operation_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ChangeSetID:
      name: change_set_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  securitySchemes:
    cookiesAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: The request does not satisfy the public contract.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: The request conflicts with current state or idempotency history.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The scoped resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthenticated:
      description: The request has no trusted identity.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    ProjectAccessDenied:
      description: The caller cannot access the requested project.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    RequestContext:
      type: object
      required:
      - request_id
      - trace_id
      - actor
      properties:
        request_id:
          type: string
        trace_id:
          type: string
        actor:
          $ref: '#/components/schemas/ActorContext'
    ActorContext:
      type: object
      required:
      - organization_id
      - principal
      - scopes
      properties:
        organization_id:
          type: string
        principal:
          type: object
          required:
          - kind
          - id
          properties:
            kind:
              type: string
              enum:
              - user
              - service
            id:
              type: string
        scopes:
          type: array
          items:
            type: string
    ModelJobCreateRequest:
      type: object
      required:
      - capability
      - input
      - project_context_version
      properties:
        capability:
          type: string
          enum:
          - image.generate
          - image.edit
          - video.generate
        model_alias:
          type: string
          examples:
          - cookies.image.standard
        input:
          oneOf:
          - $ref: '#/components/schemas/ImageGenerationInput'
          - $ref: '#/components/schemas/VideoGenerationInput'
          $ref: '#/components/schemas/ImageGenerationInput'
        project_context_version:
          type: integer
          minimum: 1
          description: Must equal the currently authorized ProjectContext version.
        constraints:
          type: object
          additionalProperties: true
        source_system:
          type: string
        source_task_id:
          type: string
      additionalProperties: false
    ImageGenerationInput:
      type: object
      required:
      - prompt
      - width
      - height
      properties:
        prompt:
          type: string
          minLength: 1
          writeOnly: true
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        source_assets:
          type: array
          items:
            $ref: '#/components/schemas/ProjectAssetRef'
      additionalProperties: false
    VideoGenerationInput:
      type: object
      additionalProperties: false
      required:
      - prompt
      - duration_seconds
      - aspect_ratio
      - resolution
      properties:
        prompt:
          type: string
          minLength: 1
          writeOnly: true
        duration_seconds:
          type: integer
          minimum: 4
          maximum: 15
        aspect_ratio:
          enum:
          - '9:16'
          - '16:9'
          - '1:1'
        resolution:
          enum:
          - 480p
          - 720p
          - 1080p
        audio_policy:
          enum:
          - silent
          - generated_audio
        input_mode:
          enum:
          - text_only
          - reference_image
          - first_last_frame
        conditioning_assets:
          type: array
          maxItems: 2
          items:
            type: object
            additionalProperties: false
            required:
            - role
            - reference
            properties:
              role:
                enum:
                - reference_image
                - first_frame
                - last_frame
              reference:
                $ref: '#/components/schemas/ProjectAssetRef'
    Job:
      type: object
      required:
      - id
      - kind
      - organization_id
      - status
      - progress
      - created_at
      - updated_at
      - cancellable
      - attempt_count
      - max_attempts
      - version
      properties:
        id:
          type: string
        kind:
          type: string
        organization_id:
          type: string
        project_id:
          type: string
        status:
          type: string
          enum:
          - queued
          - running
          - succeeded
          - failed
          - cancelled
        progress:
          type: integer
          minimum: 0
          maximum: 100
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        result_ref:
          deprecated: true
          description: Compatibility field for bootstrap consumers; use result_refs.
          $ref: '#/components/schemas/ResourceRef'
        result_refs:
          type: array
          items:
            $ref: '#/components/schemas/ResourceRef'
        error:
          $ref: '#/components/schemas/JobError'
        cancellable:
          type: boolean
        attempt_count:
          type: integer
          minimum: 0
        max_attempts:
          type: integer
          minimum: 1
        version:
          type: integer
          minimum: 1
      additionalProperties: false
    ProviderJob:
      type: object
      required:
      - id
      - kind
      - organization_id
      - project_id
      - execution_status
      - provider_status
      - progress
      - project_asset_refs
      - error
      - attempt_count
      - max_attempts
      - version
      - created_at
      - updated_at
      properties:
        id:
          type: string
          minLength: 1
        kind:
          type: string
          minLength: 1
        organization_id:
          type: string
          minLength: 1
        project_id:
          type: string
          minLength: 1
        execution_status:
          type: string
          enum:
          - queued
          - running
          - succeeded
          - failed
          - cancelled
        provider_status:
          type: string
          enum:
          - submitted
          - running
          - outputs_ready
          - ingesting
          - succeeded
          - partially_succeeded
          - failed
          - cancelled
          - expired
        progress:
          type: integer
          minimum: 0
          maximum: 100
        project_asset_refs:
          type: array
          items:
            $ref: '#/components/schemas/ProjectAssetRef'
        error:
          oneOf:
          - $ref: '#/components/schemas/JobError'
          - type: 'null'
        attempt_count:
          type: integer
          minimum: 0
        max_attempts:
          type: integer
          minimum: 1
        version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      additionalProperties: false
    JobError:
      type: object
      required:
      - code
      - message
      - retryable
      properties:
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean
      additionalProperties: false
    ResourceRef:
      type: object
      required:
      - type
      - id
      properties:
        type:
          type: string
        id:
          type: string
        version:
          type: integer
          minimum: 1
      additionalProperties: false
    GeneratedAssetIntakeRequest:
      type: object
      required:
      - provider_job_id
      - output
      - provenance
      properties:
        provider_job_id:
          type: string
          minLength: 1
        output:
          $ref: '#/components/schemas/ProviderOutputRef'
        provenance:
          $ref: '#/components/schemas/GenerationProvenance'
      additionalProperties: false
    ProviderOutputRef:
      type: object
      required:
      - provider_code
      - provider_job_id
      - output_id
      - retrieval_expires_at
      - declared_mime_type
      - declared_size_bytes
      properties:
        provider_code:
          type: string
          minLength: 1
        provider_job_id:
          type: string
          minLength: 1
        output_id:
          type: string
          minLength: 1
        retrieval_expires_at:
          type: string
          format: date-time
