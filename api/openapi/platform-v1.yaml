openapi: 3.1.0
info:
  title: cookies Platform API
  version: 0.2.0
  license:
    name: Apache License 2.0
    identifier: Apache-2.0
  description: Shared, business-agnostic platform APIs. Vertical systems publish their own contracts under /api/{system}/v1. Organization scope
    is resolved from trusted identity. Project scope comes from the path and is re-authorized.
servers:
- url: /
  description: Current cookies platform host
security:
- cookiesAuth: []
paths:
  /platform/v1/browser-rpa/kill-switches/{scope}:
    parameters:
    - name: scope
      in: path
      required: true
      schema: {type: string, enum: [global, platform, organization]}
    put:
      operationId: setBrowserRpaKillSwitch
      summary: Set a global, platform, or organization write prohibition.
      description: Requires a service principal with platform.browser-rpa.admin. Read-only evidence and takeover remain available.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SetBrowserRpaKillSwitchRequest'}
      responses:
        '200': {description: Authoritative Kill Switch., content: {application/json: {schema: {$ref: '#/components/schemas/BrowserRpaKillSwitch'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /platform/v1/browser-rpa/projects/{project_id}/environments:
    parameters:
    - $ref: '#/components/parameters/ProjectID'
    post:
      operationId: registerBrowserRpaEnvironment
      summary: Idempotently register one project/account-scoped visible local browser environment.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterBrowserRpaEnvironmentRequest'}
      responses:
        '201': {description: Registered environment., content: {application/json: {schema: {$ref: '#/components/schemas/BrowserRpaEnvironment'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /platform/v1/browser-rpa/projects/{project_id}/environments/{environment_id}:
    parameters:
    - $ref: '#/components/parameters/ProjectID'
    - $ref: '#/components/parameters/BrowserRpaEnvironmentID'
    get:
      operationId: getBrowserRpaEnvironment
      summary: Read one project-scoped environment.
      responses:
        '200': {description: Environment., content: {application/json: {schema: {$ref: '#/components/schemas/BrowserRpaEnvironment'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /platform/v1/browser-rpa/projects/{project_id}/browser-profiles:
    parameters:
    - $ref: '#/components/parameters/ProjectID'
    post:
      operationId: registerBrowserRpaBrowserProfile
      summary: Idempotently register a browser profile bound to an existing environment and exact account.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterBrowserRpaBrowserProfileRequest'}
      responses:
        '201': {description: Registered profile., content: {application/json: {schema: {$ref: '#/components/schemas/BrowserRpaBrowserProfile'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /platform/v1/browser-rpa/projects/{project_id}/browser-profiles/{profile_id}:
    parameters:
    - $ref: '#/components/parameters/ProjectID'
    - $ref: '#/components/parameters/BrowserRpaProfileID'
    get:
      operationId: getBrowserRpaBrowserProfile
      summary: Read one project-scoped browser profile.
      responses:
        '200': {description: Browser profile., content: {application/json: {schema: {$ref: '#/components/schemas/BrowserRpaBrowserProfile'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /platform/v1/browser-rpa/projects/{project_id}/site-policies:
    parameters:
    - $ref: '#/components/parameters/ProjectID'
    post:
      operationId: registerBrowserRpaSitePolicy
      summary: Idempotently register an exact HTTPS host, page-kind and platform-project allowlist.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterBrowserRpaSitePolicyRequest'}
      responses:
        '201': {description: Registered site policy., content: {application/json: {schema: {$ref: '#/components/schemas/BrowserRpaSitePolicy'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /platform/v1/browser-rpa/projects/{project_id}/site-policies/{policy_id}:
    parameters:
    - $ref: '#/components/parameters/ProjectID'
    - $ref: '#/components/parameters/BrowserRpaPolicyID'
    get:
      operationId: getBrowserRpaSitePolicy
      summary: Read one project-scoped site policy.
      responses:
        '200': {description: Site policy., content: {application/json: {schema: {$ref: '#/components/schemas/BrowserRpaSitePolicy'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /platform/v1/browser-rpa/projects/{project_id}/kill-switches/active:
    parameters:
    - $ref: '#/components/parameters/ProjectID'
    - name: platform
      in: query
      required: true
      schema: {type: string, const: ocean_engine}
    get:
      operationId: getActiveBrowserRpaKillSwitch
      summary: Resolve the winning global, platform, or organization Kill Switch without blocking evidence reads.
      responses:
        '200':
          description: Active status and the winning switch when present.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [active, kill_switch]
                properties:
                  active: {type: boolean}
                  kill_switch:
                    anyOf:
                    - {$ref: '#/components/schemas/BrowserRpaKillSwitch'}
                    - {type: 'null'}
  /platform/v1/browser-rpa/projects/{project_id}/runs:
    parameters:
    - $ref: '#/components/parameters/ProjectID'
    post:
      operationId: createBrowserRpaRun
      summary: Create or idempotently replay a controlled UI-session run.
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema: {type: string, minLength: 1, maxLength: 255}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateBrowserRpaRunRequest'}
      responses:
        '201':
          description: Created controlled run.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BrowserRpaRun'}
        '200':
          description: Idempotent replay of the same request.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BrowserRpaRun'}
        '409': {$ref: '#/components/responses/Conflict'}
  /platform/v1/browser-rpa/projects/{project_id}/runs/{run_id}:
    parameters:
    - $ref: '#/components/parameters/ProjectID'
    - $ref: '#/components/parameters/BrowserRpaRunID'
    get:
      operationId: getBrowserRpaRun
      summary: Read a controlled run from its authoritative server state.
      responses:
        '200':
          description: Controlled run.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BrowserRpaRun'}
        '404': {$ref: '#/components/responses/NotFound'}
  /platform/v1/browser-rpa/projects/{project_id}/runs/{run_id}/events:
    parameters:
    - $ref: '#/components/parameters/ProjectID'
    - $ref: '#/components/parameters/BrowserRpaRunID'
    get:
      operationId: listBrowserRpaRunEvents
      summary: Read append-only run events; Kill Switches never block this query.
      responses:
        '200':
          description: Ordered run events.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/BrowserRpaEvent'}}
                additionalProperties: false
  /platform/v1/browser-rpa/projects/{project_id}/runs/{run_id}/evidence:
    parameters:
    - $ref: '#/components/parameters/ProjectID'
    - $ref: '#/components/parameters/BrowserRpaRunID'
    get:
      operationId: listBrowserRpaRunEvidence
      summary: Read redacted structured page evidence.
      responses:
        '200':
          description: Ordered redacted evidence.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/BrowserRpaEvidence'}}
                additionalProperties: false
  /platform/v1/browser-rpa/projects/{project_id}/runs/{run_id}/takeover-evidence:
    parameters:
    - $ref: '#/components/parameters/ProjectID'
    - $ref: '#/components/parameters/BrowserRpaRunID'
    post:
      operationId: recordBrowserRpaTakeoverEvidence
      summary: Record one fenced non-write browser observation or form-readback step during an active takeover.
      description: Only observe_page, begin_form_fill, field_readback, discard_draft, and verify_no_write are accepted. The run must be paused in awaiting_takeover with a valid lease and exact site-policy match. This endpoint cannot authorize or perform save, create, submit, enable, or any other remote write.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecordBrowserRpaTakeoverEvidenceRequest'}
      responses:
        '200':
          description: Atomically recorded Run version, Step, Event and redacted Evidence.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecordedBrowserRpaTakeoverEvidence'}
        '409': {$ref: '#/components/responses/Conflict'}
  /platform/v1/browser-rpa/projects/{project_id}/runs/{run_id}/takeover-action-attempts:
    parameters:
    - $ref: '#/components/parameters/ProjectID'
    - $ref: '#/components/parameters/BrowserRpaRunID'
    post:
      operationId: authorizeBrowserRpaTakeoverAction
      summary: Atomically authorize exactly one operator-controlled final click without performing it.
      description: Requires an active fenced takeover, an exact site-policy match, zero readback diffs, an unexpired immutable authority binding, an inactive Kill Switch, and a fresh one-time final confirmation. The confirmation, authorized attempt, pre-click evidence, running step, and transition to submitting are committed atomically. No Browser Driver is invoked.
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema: {type: string, minLength: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AuthorizeBrowserRpaTakeoverActionRequest'}
      responses:
        '200':
          description: Single-use authorization and redacted pre-click evidence. The caller remains responsible for the manual browser click.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthorizedBrowserRpaTakeoverAction'}
        '409': {$ref: '#/components/responses/Conflict'}
  /platform/v1/browser-rpa/projects/{project_id}/runs/{run_id}/takeover-action-attempts/{attempt_id}:outcome:
    parameters:
    - $ref: '#/components/parameters/ProjectID'
    - $ref: '#/components/parameters/BrowserRpaRunID'
    - name: attempt_id
      in: path
      required: true
      schema: {type: string, minLength: 1}
    post:
      operationId: recordBrowserRpaTakeoverActionOutcome
      summary: Record fenced result-page or list-page evidence for the one authorized click.
      description: result_observed advances to verifying; list_confirmed advances to succeeded; result_unknown is terminal and requires reconciliation, never resubmission. Delivery confirms the platform mapping only after distinct result and list evidence agree on object ID and status.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecordBrowserRpaTakeoverOutcomeRequest'}
      responses:
        '200':
          description: Atomically recorded outcome evidence, step, event, and Run transition.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecordedBrowserRpaTakeoverEvidence'}
        '409': {$ref: '#/components/responses/Conflict'}
  /platform/v1/browser-rpa/projects/{project_id}/runs/{run_id}/leases:
    parameters:
    - $ref: '#/components/parameters/ProjectID'
    - $ref: '#/components/parameters/BrowserRpaRunID'
    post:
      operationId: acquireBrowserRpaRunLease
      summary: Atomically acquire the one exclusive visible-browser lease and attach it to the run.
      requestBody: {$ref: '#/components/requestBodies/BrowserRpaExpectedVersion'}
      responses:
        '200':
          description: Fenced lease and incremented authoritative Run.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AcquiredBrowserRpaRunLease'}
        '409': {$ref: '#/components/responses/Conflict'}
  /platform/v1/browser-rpa/projects/{project_id}/runs/{run_id}/leases/{lease_id}:heartbeat:
    parameters:
    - $ref: '#/components/parameters/ProjectID'
    - $ref: '#/components/parameters/BrowserRpaRunID'
    - $ref: '#/components/parameters/BrowserRpaLeaseID'
    post:
      operationId: heartbeatBrowserRpaRunLease
      summary: Renew the fenced exclusive lease attached to this run.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/HeartbeatBrowserRpaRunLeaseRequest'}
      responses:
        '200':
          description: Renewed lease.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BrowserRpaSessionLease'}
        '409': {$ref: '#/components/responses/Conflict'}
  /platform/v1/browser-rpa/projects/{project_id}/runs/{run_id}/leases/{lease_id}:release:
    parameters:
    - $ref: '#/components/parameters/ProjectID'
    - $ref: '#/components/parameters/BrowserRpaRunID'
    - $ref: '#/components/parameters/BrowserRpaLeaseID'
    post:
      operationId: releaseBrowserRpaRunLease
      summary: Atomically release the fenced lease and detach it from the run for safe recovery.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReleaseBrowserRpaRunLeaseRequest'}
      responses:
        '200':
          description: Released lease and incremented authoritative Run.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AcquiredBrowserRpaRunLease'}
        '409': {$ref: '#/components/responses/Conflict'}
  /platform/v1/browser-rpa/projects/{project_id}/runs/{run_id}:pause:
    parameters:
    - $ref: '#/components/parameters/ProjectID'
    - $ref: '#/components/parameters/BrowserRpaRunID'
    post:
      operationId: pauseBrowserRpaRun
      summary: Pause automated actions without blocking evidence reads or takeover.
      requestBody: {$ref: '#/components/requestBodies/BrowserRpaExpectedVersion'}
      responses:
        '200': {description: Paused run., content: {application/json: {schema: {$ref: '#/components/schemas/BrowserRpaRun'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /platform/v1/browser-rpa/projects/{project_id}/runs/{run_id}:resume:
    parameters:
    - $ref: '#/components/parameters/ProjectID'
    - $ref: '#/components/parameters/BrowserRpaRunID'
    post:
      operationId: resumeBrowserRpaRun
      summary: Resume through environment, page and account re-identification.
      requestBody: {$ref: '#/components/requestBodies/BrowserRpaExpectedVersion'}
      responses:
        '200': {description: Run returned to environment_check., content: {application/json: {schema: {$ref: '#/components/schemas/BrowserRpaRun'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /platform/v1/browser-rpa/projects/{project_id}/runs/{run_id}:cancel:
    parameters:
    - $ref: '#/components/parameters/ProjectID'
    - $ref: '#/components/parameters/BrowserRpaRunID'
    post:
      operationId: cancelBrowserRpaRun
      summary: Cancel a run only when no unknown remote result exists.
      requestBody: {$ref: '#/components/requestBodies/BrowserRpaExpectedVersion'}
      responses:
        '200': {description: Cancelled run., content: {application/json: {schema: {$ref: '#/components/schemas/BrowserRpaRun'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /platform/v1/browser-rpa/projects/{project_id}/runs/{run_id}:takeover:
    parameters:
    - $ref: '#/components/parameters/ProjectID'
    - $ref: '#/components/parameters/BrowserRpaRunID'
    post:
      operationId: takeoverBrowserRpaRun
      summary: Pause automation and hand the visible session to the user.
      requestBody: {$ref: '#/components/requestBodies/BrowserRpaExpectedVersion'}
      responses:
        '200': {description: Run awaiting or under takeover., content: {application/json: {schema: {$ref: '#/components/schemas/BrowserRpaRun'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /platform/v1/browser-rpa/projects/{project_id}/runs/{run_id}/confirmations:
    parameters:
    - $ref: '#/components/parameters/ProjectID'
    - $ref: '#/components/parameters/BrowserRpaRunID'
    post:
      operationId: issueBrowserRpaFinalConfirmation
      summary: Issue a short-lived one-time confirmation for the exact frozen run binding.
      description: The bearer secret is returned once and only its SHA-256 digest is persisted. Issuing a confirmation does not submit an external form.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IssueBrowserRpaConfirmationRequest'}
      responses:
        '201':
          description: One-time confirmation secret and audit view.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IssuedBrowserRpaConfirmation'}
        '409': {$ref: '#/components/responses/Conflict'}
  /platform/v1/browser-rpa/projects/{project_id}/runs/{run_id}:prepare:
    parameters:
    - $ref: '#/components/parameters/ProjectID'
    - $ref: '#/components/parameters/BrowserRpaRunID'
    post:
      operationId: prepareBrowserRpaRun
      summary: Advance environment checks and deterministic/manual page preparation to the final-confirmation boundary.
      responses:
        '200': {description: Prepared run., content: {application/json: {schema: {$ref: '#/components/schemas/BrowserRpaRun'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /platform/v1/browser-rpa/projects/{project_id}/runs/{run_id}:check-session:
    parameters:
    - $ref: '#/components/parameters/ProjectID'
    - $ref: '#/components/parameters/BrowserRpaRunID'
    post:
      operationId: checkBrowserRpaEdgeSession
      summary: Read the local Edge CDP, login, and account-match state without changing the page.
      responses:
        '200': {description: Safe local Edge session facts., content: {application/json: {schema: {$ref: '#/components/schemas/BrowserRpaEdgeSessionProbe'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /platform/v1/browser-rpa/projects/{project_id}/runs/{run_id}:submit:
    parameters:
    - $ref: '#/components/parameters/ProjectID'
    - $ref: '#/components/parameters/BrowserRpaRunID'
    post:
      operationId: submitBrowserRpaControlledAction
      summary: Atomically consume one final confirmation and authorize one fenced action attempt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [step_id, confirmation_id, token, lease_id, fencing_token, idempotency_key]
              properties:
                step_id: {type: string}
                confirmation_id: {type: string}
                token: {type: string, writeOnly: true}
                lease_id: {type: string}
                fencing_token: {type: integer, minimum: 1}
                idempotency_key: {type: string}
      responses:
        '200': {description: Authoritative terminal or recovery run state., content: {application/json: {schema: {$ref: '#/components/schemas/BrowserRpaRun'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /platform/v1/browser-rpa/projects/{project_id}/runs/{run_id}:reconcile-result:
    parameters:
    - $ref: '#/components/parameters/ProjectID'
    - $ref: '#/components/parameters/BrowserRpaRunID'
    post:
      operationId: reconcileUnknownBrowserRpaResult
      summary: Query the platform for an unknown staged-create result without another submit.
      description: This operation uses exact-name list reads only. It does not issue a confirmation, consume a click budget, or perform a platform write.
      responses:
        '200': {description: Reconciled run state., content: {application/json: {schema: {$ref: '#/components/schemas/BrowserRpaRun'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /platform/v1/provider/capabilities:
    get:
      operationId: listProviderCapabilities
      summary: Return enabled Provider Gateway routes without exposing credentials.
      responses:
        '200':
          description: Provider route and encrypted credential availability.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProviderCapabilities'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /platform/v1/auth/login:
    post:
      operationId: loginWithPassword
      summary: Create an opaque HttpOnly organization-scoped user session.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - username
              - password
              properties:
                username:
                  type: string
                  minLength: 1
                  maxLength: 255
                password:
                  type: string
                  minLength: 1
                  maxLength: 4096
              additionalProperties: false
      responses:
        '200':
          description: Session created.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          description: Credential temporarily locked.
  /platform/v1/auth/logout:
    post:
      operationId: logoutPasswordSession
      summary: Revoke the current session and expire its cookie.
      security: []
      responses:
        '204':
          description: Session revoked or already absent.
        '400':
          description: The session cookie is malformed and has been expired.
  /platform/v1/auth/switch-organization:
    post:
      operationId: switchOrganizationSession
      summary: Rotate the current session into another active organization membership.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organization_id]
              properties:
                organization_id: {type: string, minLength: 1}
              additionalProperties: false
      responses:
        '200': {description: Organization-scoped session rotated.}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {description: The user has no active membership in the target organization.}
  /platform/v1/context:
    get:
      operationId: getRequestContext
      summary: Return the caller's trusted, scoped request context.
      responses:
        '200':
          description: Authenticated context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestContext'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /platform/v1/projects/{project_id}/context:
    get:
      operationId: getProjectContext
      summary: Verify project access and return the scoped request context.
      parameters:
      - $ref: '#/components/parameters/ProjectID'
      responses:
        '200':
          description: The caller is authorized for the requested project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectContext'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ProjectAccessDenied'
  /platform/v1/projects/{project_id}/members:
    parameters:
    - $ref: '#/components/parameters/ProjectID'
    get:
      operationId: listProjectMembers
      responses:
        '200':
          description: Project memberships.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/ProjectMembership'}
    post:
      operationId: addProjectMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [principal_kind, principal_id, role]
              properties:
                principal_kind: {type: string, enum: [user, service]}
                principal_id: {type: string, minLength: 1}
                role: {$ref: '#/components/schemas/ProjectRole'}
              additionalProperties: false
      responses:
        '201':
          description: Project member added.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProjectMembership'}
  /platform/v1/projects/{project_id}/members/{principal_kind}/{principal_id}:
    parameters:
    - $ref: '#/components/parameters/ProjectID'
    - name: principal_kind
      in: path
      required: true
      schema: {type: string, enum: [user, service]}
    - name: principal_id
      in: path
      required: true
      schema: {type: string}
    patch:
      operationId: updateProjectMember
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateProjectMembershipRequest'}
      responses:
        '200':
          description: Project membership updated.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProjectMembership'}
  /platform/v1/me:
    get:
      operationId: getCurrentIdentity
      summary: Return the current user, organization, and membership resolved from trusted identity.
      responses:
        '200':
          description: Current identity and organization membership.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentIdentity'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    patch:
      operationId: updateCurrentUser
      summary: Update editable fields of the global user profile.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [display_name]
              properties:
                display_name: {type: string, minLength: 1, maxLength: 80}
              additionalProperties: false
      responses:
        '200':
          description: Updated user.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
  /platform/v1/organizations:
    get:
      operationId: listMyOrganizations
      summary: List active organizations for the current user.
      responses:
        '200':
          description: Organization memberships.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/OrganizationAccess'}
  /platform/v1/organizations/{organization_id}/members:
    parameters:
    - name: organization_id
      in: path
      required: true
      schema: {type: string}
    get:
      operationId: listOrganizationMembers
      responses:
        '200':
          description: Organization members.
          content:
            application/json:
