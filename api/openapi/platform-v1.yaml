  /platform/v1/projects/{project_id}/knowledge/research-runs:
    get:
      operationId: listKnowledgeResearchRuns
      summary: List Project research runs and their persisted artifacts.
      parameters:
      - $ref: '#/components/parameters/ProjectID'
      - name: limit
        in: query
        schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        '200':
          description: Project research run list.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KnowledgeResearchRunList'}
        '403': {$ref: '#/components/responses/ProjectAccessDenied'}
    post:
      operationId: createExternalResearchRun
      summary: Queue one explicitly confirmed Seed web-search research run.
      parameters:
      - $ref: '#/components/parameters/ProjectID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - query
              - run_mode
              - document_ids
              - disclosed_fields
              - confirmed
              - purpose
              - source_ref
              properties:
                mode:
                  enum:
                  - web
                  default: web
                run_mode:
                  enum:
                  - quick
                  - deep
                  description: Deep runs execute asynchronously with persisted rounds and server-owned stopping conditions.
                category:
                  type: string
                  enum:
                  - general
                  - audience
                  - competitor
                  - industry
                  default: general
                query:
                  type: string
                  minLength: 1
                  maxLength: 2000
                purpose:
                  enum:
                  - conversation_web_search
                  - deep_research
                  description: Deep runs must use deep_research; conversation searches must use quick mode.
                source_ref:
                  type: object
                  required: [type, id]
                  properties:
                    type: {type: string, minLength: 1, maxLength: 64}
                    id: {type: string, minLength: 1, maxLength: 96}
                    version: {type: integer, format: int64, minimum: 1}
                  additionalProperties: false
                document_ids:
                  type: array
                  maxItems: 20
                  items:
                    type: string
                disclosed_fields:
                  type: array
                  description: Must contain query and, when document_ids are present, document_content.
                  uniqueItems: true
                  items:
                    type: string
                    enum:
                    - query
                    - document_content
                confirmed:
                  const: true
                input_snapshot_ref:
                  type: string
                  minLength: 1
                  maxLength: 160
                input_snapshot:
                  type: object
                  description: Bounded, version-pinned Strategy context supplied only for deep research; never returned by the API.
              allOf:
              - if:
                  properties: {run_mode: {const: deep}}
                  required: [run_mode]
                then:
                  required: [input_snapshot_ref, input_snapshot]
                  properties:
                    purpose: {const: deep_research}
                    source_ref:
                      type: object
                      required: [type, id]
                      properties:
                        type: {const: strategy_workspace}
                        id: {type: string, minLength: 1, maxLength: 96}
                        version: {type: integer, format: int64, minimum: 1}
                      additionalProperties: false
              - if:
                  properties: {run_mode: {const: quick}}
                  required: [run_mode]
                then:
                  properties:
                    purpose: {const: conversation_web_search}
                    source_ref:
                      type: object
                      required: [type, id]
                      properties:
                        type: {const: strategy_message}
                        id: {type: string, minLength: 1, maxLength: 96}
                        version: {type: integer, format: int64, minimum: 1}
                      additionalProperties: false
              additionalProperties: false
      responses:
        '201':
          description: Research run and any ResearchArtifacts.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KnowledgeResearchRun'}
        '202':
          description: Research run queued for asynchronous execution.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KnowledgeResearchRun'}
        '400':
          $ref: '#/components/responses/BadRequest'
  /platform/v1/projects/{project_id}/knowledge/research-runs/{research_run_id}:
    get:
      operationId: getKnowledgeResearchRun
      summary: Get one Project research run and its persisted artifacts.
      parameters:
      - $ref: '#/components/parameters/ProjectID'
      - name: research_run_id
        in: path
        required: true
        schema: {type: string}
      responses:
        '200':
          description: Research run detail.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KnowledgeResearchRun'}
        '403': {$ref: '#/components/responses/ProjectAccessDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
