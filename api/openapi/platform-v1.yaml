      - $ref: '#/components/parameters/ProjectID'
      - name: plan_id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCreativeImageJobRequest'
      responses:
        '202':
          description: Provider job accepted; final assets enter generated intake.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderJob'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/ProjectAccessDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
components:
  parameters:
    BrowserRpaEnvironmentID:
      name: environment_id
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 96}
    BrowserRpaProfileID:
      name: profile_id
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 96}
    BrowserRpaPolicyID:
      name: policy_id
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 96}
    BrowserRpaLeaseID:
      name: lease_id
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 96}
    BrowserRpaRunID:
      name: run_id
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 96}
    ProjectID:
      name: project_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ArtifactID:
      name: artifact_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    AssetID:
      name: asset_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    AssetVersionNumber:
      name: version
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
        pattern: ^[A-Za-z0-9_-]+$
    OptionalIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Defaults to provider-job-{provider_job_id}-output-{output_id} for generated intake.
      schema:
        type: string
        minLength: 1
        maxLength: 255
        pattern: ^[A-Za-z0-9_-]+$
    JobID:
      name: job_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    IntakeID:
      name: intake_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    UploadID:
      name: upload_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    TaskID:
      name: task_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    OperationID:
      name: operation_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ChangeSetID:
      name: change_set_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  securitySchemes:
    cookiesAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: The request does not satisfy the public contract.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: The request conflicts with current state or idempotency history.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The scoped resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthenticated:
      description: The request has no trusted identity.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    ProjectAccessDenied:
      description: The caller cannot access the requested project.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
  requestBodies:
    BrowserRpaExpectedVersion:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [expected_version]
            properties:
              expected_version: {type: integer, minimum: 1}
  schemas:
    SetBrowserRpaKillSwitchRequest:
      type: object
      additionalProperties: false
      required: [active, reason, expected_version]
      properties:
        platform: {type: string, const: ocean_engine}
        active: {type: boolean}
        reason: {type: string, minLength: 1, maxLength: 1000}
        expected_version: {type: integer, minimum: 0}
    BrowserRpaKillSwitch:
      type: object
      additionalProperties: false
      required: [id, scope, active, reason, version, updated_by, updated_at]
      properties:
        id: {type: string}
        scope: {type: string, enum: [global, platform, organization]}
        organization_id: {type: string}
        platform: {type: string, const: ocean_engine}
        active: {type: boolean}
        reason: {type: string}
        version: {type: integer, minimum: 1}
        updated_by: {type: string}
        updated_at: {type: string, format: date-time}
    RegisterBrowserRpaEnvironmentRequest:
      type: object
      additionalProperties: false
      required: [id, platform, account_id, mode, browser_version, region, healthy]
      properties:
        id: {type: string, minLength: 1, maxLength: 96}
        platform: {type: string, const: ocean_engine}
        account_id: {type: string, minLength: 1, maxLength: 160}
        mode: {type: string, const: local_visible}
        browser_version: {type: string, minLength: 1, maxLength: 64}
        region: {type: string, minLength: 1, maxLength: 64}
        healthy: {type: boolean}
    BrowserRpaEnvironment:
      type: object
      additionalProperties: false
      required: [id, organization_id, project_id, platform, account_id, mode, browser_version, region, healthy, version]
      properties:
        id: {type: string}
        organization_id: {type: string}
        project_id: {type: string}
        platform: {type: string, const: ocean_engine}
        account_id: {type: string}
        mode: {type: string, const: local_visible}
        browser_version: {type: string}
        region: {type: string}
        healthy: {type: boolean}
        version: {type: integer, const: 1}
    RegisterBrowserRpaBrowserProfileRequest:
      type: object
      additionalProperties: false
      required: [id, environment_id, platform, account_id, state]
      properties:
        id: {type: string, minLength: 1, maxLength: 96}
        environment_id: {type: string, minLength: 1, maxLength: 96}
        platform: {type: string, const: ocean_engine}
        account_id: {type: string, minLength: 1, maxLength: 160}
        state: {type: string, enum: [ready, takeover_required, disabled]}
    BrowserRpaBrowserProfile:
      type: object
      additionalProperties: false
      required: [id, organization_id, project_id, environment_id, platform, account_id, state, version]
      properties:
        id: {type: string}
        organization_id: {type: string}
        project_id: {type: string}
        environment_id: {type: string}
        platform: {type: string, const: ocean_engine}
        account_id: {type: string}
        state: {type: string, enum: [ready, takeover_required, disabled]}
        version: {type: integer, const: 1}
    RegisterBrowserRpaSitePolicyRequest:
      type: object
      additionalProperties: false
      required: [id, platform, account_id, allowed_protocols, allowed_hosts, allowed_page_kinds, allowed_platform_project_ids]
      properties:
        id: {type: string, minLength: 1, maxLength: 96}
        platform: {type: string, const: ocean_engine}
        account_id: {type: string, minLength: 1, maxLength: 160}
        allowed_protocols: {type: array, minItems: 1, uniqueItems: true, items: {type: string, const: https}}
        allowed_hosts: {type: array, minItems: 1, uniqueItems: true, items: {type: string, pattern: '^[a-z0-9.-]+$'}}
        allowed_page_kinds: {type: array, minItems: 1, uniqueItems: true, items: {type: string, minLength: 1}}
        allowed_platform_project_ids: {type: array, minItems: 1, uniqueItems: true, items: {type: string, minLength: 1}}
    BrowserRpaSitePolicy:
      type: object
      additionalProperties: false
      required: [id, organization_id, project_id, platform, account_id, allowed_protocols, allowed_hosts, allowed_page_kinds, allowed_platform_project_ids, version]
      properties:
        id: {type: string}
        organization_id: {type: string}
        project_id: {type: string}
        platform: {type: string, const: ocean_engine}
        account_id: {type: string}
        allowed_protocols: {type: array, items: {type: string, const: https}}
        allowed_hosts: {type: array, items: {type: string}}
        allowed_page_kinds: {type: array, items: {type: string}}
        allowed_platform_project_ids: {type: array, items: {type: string}}
        version: {type: integer, const: 1}
    HeartbeatBrowserRpaRunLeaseRequest:
      type: object
      additionalProperties: false
      required: [expected_version, fencing_token]
      properties:
        expected_version: {type: integer, minimum: 1}
        fencing_token: {type: integer, minimum: 1}
    ReleaseBrowserRpaRunLeaseRequest:
      type: object
      additionalProperties: false
      required: [expected_run_version, expected_lease_version, fencing_token]
      properties:
        expected_run_version: {type: integer, minimum: 1}
        expected_lease_version: {type: integer, minimum: 1}
        fencing_token: {type: integer, minimum: 1}
    BrowserRpaBlockingReason:
      type: string
      enum: [FINAL_CONFIRMATION_REQUIRED, FINAL_CONFIRMATION_INVALID, APPROVAL_INVALID, LEASE_INVALID, KILL_SWITCH_ACTIVE, ACCOUNT_MISMATCH, PROJECT_NOT_ALLOWED, SITE_NOT_ALLOWED, PAGE_DRIFT, WORKFLOW_DRIFT, SKILL_DRIFT, RESULT_RECONCILIATION_REQUIRED]
    BrowserRpaRunState:
      type: string
      enum: [queued, environment_check, awaiting_takeover, preparing, awaiting_confirmation, submitting, verifying, succeeded, failed, partial, result_unknown, cancelled]
    BrowserRpaAuthorityBinding:
      type: object
      additionalProperties: false
      required: [schema_version, organization_id, project_id, business_execution_id, change_set_id, approval_id, approval_action_hash, account_reference_id, object_fingerprint, action, budget_limit_minor, currency, plan_canonical_hash, intent_canonical_hash, configuration_canonical_hash, workflow_id, workflow_canonical_hash, workflow_step_id]
      anyOf:
        - required: [authority_origin, preflight_canonical_hash]
          properties:
            authority_origin: {const: plan_execution}
        - required: [feedback_canonical_hash, decision_canonical_hash]
      properties:
        schema_version: {type: string, enum: [browser-rpa-authority/v1, computer-use-authority/v1]}
        authority_origin: {type: string, const: plan_execution}
        preflight_canonical_hash: {$ref: '#/components/schemas/BrowserRpaHash'}
        organization_id: {type: string}
        project_id: {type: string}
        business_execution_id: {type: string}
        change_set_id: {type: string}
        approval_id: {type: string}
        approval_action_hash: {$ref: '#/components/schemas/BrowserRpaHash'}
        account_reference_id: {type: string}
        parent_platform_project_id: {type: string}
        target_mapping_id: {type: string}
        target_mapping_version: {type: integer, minimum: 1}
        target_platform_object_id: {type: string}
        target_platform_object_kind: {type: string, enum: [promotion]}
        operator_principal_id: {type: string}
        supersedes_controlled_change_set_id: {type: string}
        promotion_mutation: {$ref: '#/components/schemas/BrowserRpaPromotionMutation'}
        promotion_control: {$ref: '#/components/schemas/BrowserRpaPromotionControl'}
        promotion_restart: {$ref: '#/components/schemas/BrowserRpaPromotionRestart'}
        object_fingerprint: {type: string}
        action: {type: string, enum: [create_project_and_promotions, create_promotions_in_existing_project, update_promotion_budget, update_promotion_materials, pause_promotion, resume_promotion]}
        project_budget_mode: {type: string, enum: [daily, unlimited]}
        project_budget_limit_minor: {type: integer, minimum: 0}
        promotion_budget_limit_minor: {type: integer, minimum: 0}
        budget_limit_minor: {type: integer, minimum: 0}
        currency: {type: string, const: CNY}
        plan_canonical_hash: {$ref: '#/components/schemas/BrowserRpaHash'}
        intent_canonical_hash: {$ref: '#/components/schemas/BrowserRpaHash'}
        feedback_canonical_hash: {$ref: '#/components/schemas/BrowserRpaHash'}
        decision_canonical_hash: {$ref: '#/components/schemas/BrowserRpaHash'}
        configuration_canonical_hash: {$ref: '#/components/schemas/BrowserRpaHash'}
        workflow_id: {type: string}
        workflow_canonical_hash: {$ref: '#/components/schemas/BrowserRpaHash'}
        workflow_step_id: {type: string}
        skill_id: {type: string}
        skill_version: {type: string}
    BrowserRpaPromotionMaterialReference:
      type: object
      additionalProperties: false
      required: [reference_id, authorization_evidence_id]
      properties:
        reference_id: {type: string}
        authorization_evidence_id: {type: string}
    BrowserRpaPromotionLandingPageReference:
      type: object
      additionalProperties: false
      required: [reference_id, authorization_evidence_id]
      properties:
        reference_id: {type: string}
        authorization_evidence_id: {type: string}
    BrowserRpaPromotionScheduleWindow:
      type: object
      additionalProperties: false
      required: [start_at, end_at, timezone]
      properties:
        start_at: {type: string, format: date-time}
        end_at: {type: string, format: date-time}
        timezone: {type: string}
    BrowserRpaPromotionMutation:
      type: object
      additionalProperties: false
      required: [current_daily_budget_minor, target_daily_budget_minor, current_state_hash, target_state_hash]
      properties:
        current_daily_budget_minor: {type: integer, minimum: 30000}
        target_daily_budget_minor: {type: integer, minimum: 30000}
        current_materials:
          type: array
          items: {$ref: '#/components/schemas/BrowserRpaPromotionMaterialReference'}
        target_materials:
          type: array
          items: {$ref: '#/components/schemas/BrowserRpaPromotionMaterialReference'}
        current_state_hash: {$ref: '#/components/schemas/BrowserRpaHash'}
        target_state_hash: {$ref: '#/components/schemas/BrowserRpaHash'}
    BrowserRpaPromotionControl:
      type: object
      additionalProperties: false
      required: [current_daily_budget_minor, current_platform_status, target_platform_status, current_state_hash, target_state_hash]
      properties:
        current_daily_budget_minor: {type: integer, minimum: 30000}
        current_platform_status: {type: string, const: delivering}
        target_platform_status: {type: string, const: paused}
        current_state_hash: {$ref: '#/components/schemas/BrowserRpaHash'}
        target_state_hash: {$ref: '#/components/schemas/BrowserRpaHash'}
    BrowserRpaPromotionRestart:
      type: object
      additionalProperties: false
      required: [current_daily_budget_minor, approved_daily_budget_minor, current_platform_status, target_platform_status, schedule, materials, landing_page, current_state_hash, target_state_hash]
      properties:
        current_daily_budget_minor: {type: integer, minimum: 30000}
        approved_daily_budget_minor: {type: integer, minimum: 30000}
        current_platform_status: {type: string, const: paused}
        target_platform_status: {type: string, const: delivering}
        schedule: {$ref: '#/components/schemas/BrowserRpaPromotionScheduleWindow'}
        materials:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/BrowserRpaPromotionMaterialReference'}
        landing_page: {$ref: '#/components/schemas/BrowserRpaPromotionLandingPageReference'}
        current_state_hash: {$ref: '#/components/schemas/BrowserRpaHash'}
        target_state_hash: {$ref: '#/components/schemas/BrowserRpaHash'}
    BrowserRpaRun:
      type: object
      additionalProperties: false
      required: [schema_version, id, organization_id, project_id, platform, account_id, authority, environment_id, profile_id, lease_id, policy_id, state, paused, takeover_active, version, idempotency_key, request_hash, created_by, created_at, updated_at]
      properties:
        schema_version: {type: string, enum: [browser-rpa-run/v1, computer-use-run/v1]}
        id: {type: string}
        organization_id: {type: string}
        project_id: {type: string}
        platform: {type: string, const: ocean_engine}
        account_id: {type: string}
        authority: {$ref: '#/components/schemas/BrowserRpaAuthorityBinding'}
        environment_id: {type: string}
        profile_id: {type: string}
        lease_id: {type: string}
        policy_id: {type: string}
        state: {$ref: '#/components/schemas/BrowserRpaRunState'}
        blocking_reason: {$ref: '#/components/schemas/BrowserRpaBlockingReason'}
        paused: {type: boolean}
        takeover_active: {type: boolean}
        version: {type: integer, minimum: 1}
        idempotency_key: {type: string}
        request_hash: {$ref: '#/components/schemas/BrowserRpaHash'}
        created_by: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    BrowserRpaEdgeSessionProbe:
      type: object
      additionalProperties: false
      required: [schema_version, checked_at, status, reason, cdp_available, oceanengine_page_available, logged_in, account_matched]
      properties:
        schema_version: {type: string, const: browser-rpa-edge-session-probe/v1}
        checked_at: {type: string, format: date-time}
        status: {type: string, enum: [ready, blocked]}
        reason: {type: string, enum: [session_ready, cdp_unavailable, oceanengine_page_missing, login_required, account_mismatch]}
        cdp_available: {type: boolean}
        oceanengine_page_available: {type: boolean}
        logged_in: {type: boolean}
        account_matched: {type: boolean}
    CreateBrowserRpaRunRequest:
      type: object
      additionalProperties: false
      required: [project_id, platform, account_id, business_execution_id, environment_id, profile_id, policy_id]
      properties:
        project_id: {type: string, minLength: 1}
        platform: {type: string, const: ocean_engine}
        account_id: {type: string, minLength: 1}
        business_execution_id:
          type: string
          minLength: 1
          description: Server-resolved Delivery controlled execution; clients cannot supply an authority binding.
        environment_id: {type: string, minLength: 1}
        profile_id: {type: string, minLength: 1}
        policy_id: {type: string, minLength: 1}
    BrowserRpaEvent:
      type: object
      additionalProperties: false
      required: [id, organization_id, project_id, run_id, sequence, kind, summary, actor, created_at]
      properties:
        id: {type: string}
        organization_id: {type: string}
        project_id: {type: string}
        run_id: {type: string}
        sequence: {type: integer, minimum: 1}
        kind: {type: string}
        summary: {type: string}
        actor: {type: string}
        created_at: {type: string, format: date-time}
    BrowserRpaEvidence:
      type: object
      additionalProperties: false
      required: [schema_version, id, organization_id, project_id, run_id, step_id, before_page_facts, after_page_facts, field_readback, diff_keys, page_reference, object_fingerprint, selector_version, action_version, redaction_version, created_at]
      properties:
        schema_version: {type: string, enum: [browser-rpa-evidence/v1, computer-use-evidence/v1]}
        id: {type: string}
        organization_id: {type: string}
        project_id: {type: string}
        run_id: {type: string}
        step_id: {type: string}
        before_page_facts: {type: object, additionalProperties: {type: string}}
        after_page_facts: {type: object, additionalProperties: {type: string}}
        field_readback: {type: object, additionalProperties: {type: string}}
        diff_keys: {type: array, items: {type: string}}
        page_reference: {type: string}
        screenshot_reference: {type: string}
        object_fingerprint: {type: string}
        skill_version: {type: string}
        selector_version: {type: string}
        action_version: {type: string}
        redaction_version: {type: string}
        created_at: {type: string, format: date-time}
    BrowserRpaStep:
      type: object
      additionalProperties: false
      required: [id, run_id, sequence, workflow_step_id, action, status, attempt, version]
      properties:
        id: {type: string, minLength: 1}
        run_id: {type: string, minLength: 1}
        sequence: {type: integer, minimum: 1}
        workflow_step_id: {type: string, minLength: 1}
        action: {type: string, enum: [observe_page, begin_form_fill, field_readback, discard_draft, verify_no_write, submit_platform_configuration, result_observed, list_confirmed, rejected_or_error, result_unknown]}
        status: {type: string, enum: [running, succeeded, failed, result_unknown]}
        blocking_reason: {$ref: '#/components/schemas/BrowserRpaBlockingReason'}
        attempt: {type: integer, minimum: 1}
        version: {type: integer, minimum: 1}
    BrowserRpaSessionLease:
      type: object
      additionalProperties: false
      required: [id, organization_id, project_id, run_id, environment_id, profile_id, platform, account_id, holder, fencing_token, version, expires_at, heartbeat_deadline]
      properties:
        id: {type: string, minLength: 1}
        organization_id: {type: string, minLength: 1}
        project_id: {type: string, minLength: 1}
        run_id: {type: string, minLength: 1}
        environment_id: {type: string, minLength: 1}
        profile_id: {type: string, minLength: 1}
        platform: {type: string, const: ocean_engine}
        account_id: {type: string, minLength: 1}
        holder: {type: string, minLength: 1}
        fencing_token: {type: integer, minimum: 1}
        version: {type: integer, minimum: 1}
        expires_at: {type: string, format: date-time}
        heartbeat_deadline: {type: string, format: date-time}
        released_at: {type: string, format: date-time}
    AcquiredBrowserRpaRunLease:
      type: object
      additionalProperties: false
      required: [run, lease]
      properties:
        run: {$ref: '#/components/schemas/BrowserRpaRun'}
        lease: {$ref: '#/components/schemas/BrowserRpaSessionLease'}
    RecordBrowserRpaTakeoverEvidenceRequest:
      type: object
      additionalProperties: false
      required: [expected_version, lease_id, fencing_token, step_id, sequence, action, status, page_kind, platform_project_id, before_page_facts, after_page_facts, field_readback, diff_keys, page_reference, selector_version, action_version]
      properties:
        expected_version: {type: integer, minimum: 1}
        lease_id: {type: string, minLength: 1}
        fencing_token: {type: integer, minimum: 1}
        step_id: {type: string, minLength: 1}
        sequence: {type: integer, minimum: 1}
        action: {type: string, enum: [observe_page, begin_form_fill, field_readback, discard_draft, verify_no_write]}
        status: {type: string, enum: [running, succeeded, failed]}
        page_kind: {type: string, minLength: 1}
        platform_project_id: {type: string, minLength: 1}
        before_page_facts: {type: object, additionalProperties: {type: string}}
        after_page_facts: {type: object, additionalProperties: {type: string}}
        field_readback: {type: object, additionalProperties: {type: string}}
        diff_keys: {type: array, items: {type: string}}
        page_reference: {type: string, format: uri}
        selector_version: {type: string, minLength: 1}
        action_version: {type: string, minLength: 1}
    RecordedBrowserRpaTakeoverEvidence:
      type: object
      additionalProperties: false
      required: [run, step, evidence]
      properties:
        run: {$ref: '#/components/schemas/BrowserRpaRun'}
        step: {$ref: '#/components/schemas/BrowserRpaStep'}
        evidence: {$ref: '#/components/schemas/BrowserRpaEvidence'}
    AuthorizeBrowserRpaTakeoverActionRequest:
      type: object
      additionalProperties: false
      required: [expected_version, step_id, sequence, confirmation_id, confirmation_token, lease_id, fencing_token, page_kind, platform_project_id, before_page_facts, field_readback, diff_keys, page_reference, selector_version, action_version]
      properties:
        expected_version: {type: integer, minimum: 1}
        step_id: {type: string, minLength: 1}
        sequence: {type: integer, minimum: 1}
        confirmation_id: {type: string, minLength: 1}
        confirmation_token: {type: string, minLength: 32, writeOnly: true}
        lease_id: {type: string, minLength: 1}
        fencing_token: {type: integer, minimum: 1}
        page_kind: {type: string, minLength: 1}
        platform_project_id: {type: string, minLength: 1}
        before_page_facts: {type: object, additionalProperties: {type: string}}
        field_readback: {type: object, minProperties: 1, additionalProperties: {type: string}}
        diff_keys: {type: array, maxItems: 0, items: {type: string}}
