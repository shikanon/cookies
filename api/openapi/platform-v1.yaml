openapi: 3.1.0
info:
  title: cookies Platform API
  version: 0.2.0
  license:
    name: Apache License 2.0
    identifier: Apache-2.0
  description: Shared, business-agnostic platform APIs. Vertical systems publish their own contracts under /api/{system}/v1. Organization scope
    is resolved from trusted identity. Project scope comes from the path and is re-authorized.
servers:
- url: /
  description: Current cookies platform host
security:
- cookiesAuth: []
paths:
  /platform/v1/provider/capabilities:
    get:
      operationId: listProviderCapabilities
      summary: Return enabled Provider Gateway routes without exposing credentials.
      responses:
        '200':
          description: Provider route and encrypted credential availability.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProviderCapabilities'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /platform/v1/auth/login:
    post:
      operationId: loginWithPassword
      summary: Create an opaque HttpOnly organization-scoped user session.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - username
              - password
              properties:
                username:
                  type: string
                  minLength: 1
                  maxLength: 255
                password:
                  type: string
                  minLength: 1
                  maxLength: 4096
              additionalProperties: false
      responses:
        '200':
          description: Session created.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          description: Credential temporarily locked.
  /platform/v1/auth/logout:
    post:
      operationId: logoutPasswordSession
      summary: Revoke the current session and expire its cookie.
      security: []
      responses:
        '204':
          description: Session revoked or already absent.
        '400':
          description: The session cookie is malformed and has been expired.
  /platform/v1/auth/switch-organization:
    post:
      operationId: switchOrganizationSession
      summary: Rotate the current session into another active organization membership.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organization_id]
              properties:
                organization_id: {type: string, minLength: 1}
              additionalProperties: false
      responses:
        '200': {description: Organization-scoped session rotated.}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {description: The user has no active membership in the target organization.}
  /platform/v1/context:
    get:
      operationId: getRequestContext
      summary: Return the caller's trusted, scoped request context.
      responses:
        '200':
          description: Authenticated context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestContext'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /platform/v1/projects/{project_id}/context:
    get:
      operationId: getProjectContext
      summary: Verify project access and return the scoped request context.
      parameters:
      - $ref: '#/components/parameters/ProjectID'
      responses:
        '200':
          description: The caller is authorized for the requested project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectContext'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ProjectAccessDenied'
  /platform/v1/projects/{project_id}/members:
    parameters:
    - $ref: '#/components/parameters/ProjectID'
    get:
      operationId: listProjectMembers
      responses:
        '200':
          description: Project memberships.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/ProjectMembership'}
    post:
      operationId: addProjectMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [principal_kind, principal_id, role]
              properties:
                principal_kind: {type: string, enum: [user, service]}
                principal_id: {type: string, minLength: 1}
                role: {$ref: '#/components/schemas/ProjectRole'}
              additionalProperties: false
      responses:
        '201':
          description: Project member added.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProjectMembership'}
  /platform/v1/projects/{project_id}/members/{principal_kind}/{principal_id}:
    parameters:
    - $ref: '#/components/parameters/ProjectID'
    - name: principal_kind
      in: path
      required: true
      schema: {type: string, enum: [user, service]}
    - name: principal_id
      in: path
      required: true
      schema: {type: string}
    patch:
      operationId: updateProjectMember
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateProjectMembershipRequest'}
      responses:
        '200':
          description: Project membership updated.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProjectMembership'}
  /platform/v1/me:
    get:
      operationId: getCurrentIdentity
      summary: Return the current user, organization, and membership resolved from trusted identity.
      responses:
        '200':
          description: Current identity and organization membership.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentIdentity'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    patch:
      operationId: updateCurrentUser
      summary: Update editable fields of the global user profile.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [display_name]
              properties:
                display_name: {type: string, minLength: 1, maxLength: 80}
              additionalProperties: false
      responses:
        '200':
          description: Updated user.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
  /platform/v1/organizations:
    get:
      operationId: listMyOrganizations
      summary: List active organizations for the current user.
      responses:
        '200':
          description: Organization memberships.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/OrganizationAccess'}
  /platform/v1/organizations/{organization_id}/members:
    parameters:
    - name: organization_id
      in: path
      required: true
      schema: {type: string}
    get:
      operationId: listOrganizationMembers
      responses:
        '200':
          description: Organization members.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/OrganizationMember'}
    post:
      operationId: addExistingOrganizationUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, role]
              properties:
                user_id: {type: string, minLength: 1}
                role: {$ref: '#/components/schemas/OrganizationRole'}
              additionalProperties: false
      responses:
        '201':
          description: Existing user added.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrganizationMember'}
  /platform/v1/organizations/{organization_id}/members/{user_id}:
    parameters:
    - name: organization_id
      in: path
      required: true
      schema: {type: string}
    - name: user_id
      in: path
      required: true
      schema: {type: string}
    patch:
      operationId: updateOrganizationMember
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateOrganizationMembershipRequest'}
      responses:
        '200':
          description: Membership updated.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrganizationMember'}
  /platform/v1/brands:
    post:
      operationId: createBrand
      summary: Create a brand in the caller's organization.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
              additionalProperties: false
      responses:
        '201':
          description: Brand created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brand'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /platform/v1/projects:
    get:
      operationId: listProjects
      summary: List projects visible to the current principal.
      responses:
        '200':
          description: Project list.
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      operationId: createProject
      summary: Create a draft or brand-bound active project.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Project created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /platform/v1/projects/{project_id}/knowledge/documents:
    get:
      operationId: listKnowledgeDocuments
      summary: List parsed Project documents without returning extracted content.
      parameters:
      - $ref: '#/components/parameters/ProjectID'
      responses:
        '200':
          description: Project document list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeDocumentList'
        '403':
          $ref: '#/components/responses/ProjectAccessDenied'
    post:
      operationId: createKnowledgeDocument
      summary: Scan, store, and parse one Markdown, DOCX, or PDF document.
      parameters:
      - $ref: '#/components/parameters/ProjectID'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  contentEncoding: binary
          application/json:
            schema:
              $ref: '#/components/schemas/ImportKnowledgeDocumentRequest'
      responses:
        '201':
          description: Document stored and parsing scheduled or completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/ProjectAccessDenied'
  /platform/v1/projects/{project_id}/knowledge/documents/{document_id}:
    get:
      operationId: getKnowledgeDocument
      summary: Get one Project document, including parse status and extracted text when ready.
      parameters:
      - $ref: '#/components/parameters/ProjectID'
      - name: document_id
        in: path
        required: true
        schema: {type: string}
      responses:
        '200':
          description: Project document detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeDocument'
        '403':
          $ref: '#/components/responses/ProjectAccessDenied'
        '404':
          $ref: '#/components/responses/NotFound'
  /platform/v1/projects/{project_id}/knowledge/documents/{document_id}/media:extract:
    post:
      operationId: extractKnowledgeDocumentMedia
      summary: Extract bounded PNG and JPEG media from one parsed Project PDF.
      parameters:
      - $ref: '#/components/parameters/ProjectID'
      - name: document_id
        in: path
        required: true
        schema: {type: string}
      responses:
        '200':
          description: Embedded document media with page metadata and base64 content.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractedDocumentMediaList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/ProjectAccessDenied'
        '404':
          $ref: '#/components/responses/NotFound'
  /platform/v1/projects/{project_id}/workbench:
    get:
      operationId: getProjectWorkbench
      summary: Return the typed, project-scoped agency workbench read model.
      parameters:
        - $ref: '#/components/parameters/ProjectID'
      responses:
        '200':
          description: Project workbench read model.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProjectWorkbench'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/ProjectAccessDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
  /platform/v1/projects/{project_id}/assets/{asset_id}/versions/{version}/quality-checks:
    post:
      operationId: runWorkbenchAssetQualityCheck
      summary: Run the project-scoped baseline quality gate for one immutable asset version.
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - $ref: '#/components/parameters/AssetID'
        - $ref: '#/components/parameters/AssetVersionNumber'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '201':
          description: Quality check completed or the prior idempotent result returned.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkbenchQualityCheckRun'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/ProjectAccessDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /platform/v1/projects/{project_id}/assets/{asset_id}/versions/{version}/confirmations:
    post:
      operationId: recordWorkbenchMaterialConfirmation
      summary: Confirm or request changes for a quality-checked asset version.
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - $ref: '#/components/parameters/AssetID'
        - $ref: '#/components/parameters/AssetVersionNumber'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecordWorkbenchMaterialConfirmationRequest'}
      responses:
        '201':
          description: Confirmation recorded or the prior idempotent result returned.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkbenchMaterialConfirmation'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/ProjectAccessDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /platform/v1/projects/{project_id}/assets/{asset_id}/version-pointer:
    patch:
      operationId: selectWorkbenchAssetDeliveryVersion
      summary: Select a human-confirmed immutable asset version for delivery.
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - $ref: '#/components/parameters/AssetID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateWorkbenchAssetVersionPointerRequest'}
      responses:
        '200':
          description: Updated asset version pointer.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkbenchAssetVersionPointer'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/ProjectAccessDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /platform/v1/projects/{project_id}/knowledge/research-runs:
    post:
      operationId: createExternalResearchRun
      summary: Queue one explicitly confirmed Seed web-search research run.
      parameters:
      - $ref: '#/components/parameters/ProjectID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - query
              - document_ids
              - disclosed_fields
              - confirmed
              properties:
                mode:
                  enum:
                  - web
                  default: web
                category:
                  type: string
                  enum:
                  - general
                  - audience
                  - competitor
                  - industry
                  default: general
                query:
                  type: string
                  minLength: 1
                  maxLength: 2000
                document_ids:
                  type: array
                  maxItems: 20
                  items:
                    type: string
                disclosed_fields:
                  type: array
                  description: Must contain query and, when document_ids are present, document_content.
                  uniqueItems: true
                  items:
                    type: string
                    enum:
                    - query
                    - document_content
                confirmed:
                  const: true
              additionalProperties: false
      responses:
        '201':
          description: Research run and any ResearchArtifacts.
        '400':
          $ref: '#/components/responses/BadRequest'
  /platform/v1/projects/{project_id}/assets/uploads:
    post:
      operationId: createAssetUpload
      summary: Create an image upload session and a short-lived signed TOS PUT.
      parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUploadRequest'
      responses:
        '201':
          description: Upload session created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateUploadResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /platform/v1/projects/{project_id}/assets/uploads/{upload_id}:
    put:
      operationId: proxyAssetUpload
      summary: Local-development/fallback upload proxy; production clients use the signed PUT.
      parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/UploadID'
      requestBody:
        required: true
        content:
          image/png:
            schema:
              type: string
              contentEncoding: binary
          image/jpeg:
            schema:
              type: string
              contentEncoding: binary
      responses:
        '204':
          description: Upload stored in quarantine.
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/ProjectAccessDenied'
  /platform/v1/projects/{project_id}/assets/uploads/{upload_id}:finalize:
    post:
      operationId: finalizeAssetUpload
      summary: Validate, scan, persist, and attach an uploaded image to the project.
      parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/UploadID'
      responses:
        '200':
          description: Upload finalized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSession'
        '409':
          $ref: '#/components/responses/Conflict'
  /platform/v1/projects/{project_id}/assets:
    get:
      operationId: listProjectAssets
      summary: List immutable asset versions attached to the project.
      parameters:
      - $ref: '#/components/parameters/ProjectID'
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      responses:
        '200':
          description: Project asset list.
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProjectAsset'
        '403':
          $ref: '#/components/responses/ProjectAccessDenied'
  /platform/v1/projects/{project_id}/assets/{asset_id}/versions/{version}:
    delete:
      operationId: removeProjectAssetVersion
      summary: Remove an immutable asset version from the project library without deleting its durable record.
      parameters:
      - $ref: '#/components/parameters/ProjectID'
      - name: asset_id
        in: path
        required: true
        schema:
          type: string
      - name: version
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      responses:
        '204':
          description: Project asset relationship removed or already absent.
        '403':
          $ref: '#/components/responses/ProjectAccessDenied'
  /platform/v1/projects/{project_id}/assets/{asset_id}/versions/{version}/preview:
    get:
      operationId: previewAssetVersion
      summary: Re-authorize and return a short-lived signed preview request.
      parameters:
      - $ref: '#/components/parameters/ProjectID'
      - name: asset_id
        in: path
        required: true
        schema:
          type: string
      - name: version
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Private no-store preview request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /platform/v1/projects/{project_id}/assets/{asset_id}/versions/{version}/content:
    get:
      operationId: streamAssetVersionContent
      summary: Stream authorized asset content when the active blob provider cannot issue an external signed URL.
      parameters:
      - $ref: '#/components/parameters/ProjectID'
      - name: asset_id
        in: path
        required: true
        schema:
          type: string
      - name: version
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Private no-store asset bytes.
          headers:
            Cache-Control:
              schema:
                type: string
                example: private, no-store
            X-Content-Type-Options:
              schema:
                type: string
                example: nosniff
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
  /platform/v1/projects/{project_id}/model/jobs:
    post:
      operationId: createModelJob
      summary: Create an asynchronous image-generation model job.
      parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelJobCreateRequest'
      responses:
        '202':
          description: Model job accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderJob'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ProjectAccessDenied'
  /platform/v1/projects/{project_id}/model/jobs/{job_id}:
    parameters:
    - $ref: '#/components/parameters/ProjectID'
    - $ref: '#/components/parameters/JobID'
    get:
      operationId: getModelJob
      summary: Return the current public model job state.
      responses:
        '200':
          description: Current model job state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderJob'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
  /platform/v1/projects/{project_id}/assets/generated-intakes:
    post:
      operationId: createGeneratedAssetIntake
      summary: Start admission of one provider output into the project asset library.
      description: This is the only route by which provider outputs become durable project assets. Assets resolves the opaque ProviderOutputRef
        through an injected provider adapter, verifies actual size, MIME and SHA-256, scans the bytes, and persists them asynchronously. The request
        hash is SHA-256 of the RFC 8785 JCS canonical request body. The default idempotency key is provider-job-{provider_job_id}-output-{output_id}.
      parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/OptionalIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeneratedAssetIntakeRequest'
      responses:
        '202':
          description: The single-output intake was accepted for asynchronous processing.
          headers:
            Location:
              description: Project-scoped URL of the generated intake.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratedAssetIntakeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ProjectAccessDenied'
        '409':
          $ref: '#/components/responses/Conflict'
  /platform/v1/projects/{project_id}/assets/generated-intakes/{intake_id}:
    parameters:
    - $ref: '#/components/parameters/ProjectID'
    - $ref: '#/components/parameters/IntakeID'
    get:
      operationId: getGeneratedAssetIntake
      summary: Return the current state of a single-output generated intake.
      responses:
        '200':
          description: Current generated intake state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratedAssetIntakeResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ProjectAccessDenied'
        '404':
