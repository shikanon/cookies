openapi: 3.1.0
info:
  title: cookies Creative API
  version: 0.1.0
  license:
    name: Apache License 2.0
    identifier: Apache-2.0
  description: >-
    The Creative vertical owns CreativeIntakes, CreativeTasks and content
    drafts. Organization scope comes from trusted identity and project scope is
    re-authorized from the path.
servers:
  - url: /
security:
  - cookiesAuth: []
paths:
  /api/creative/v1/projects/{project_id}/ai-native-ads/requirements:analyze:
    post:
      operationId: analyzeAINativeAdRequirement
      summary: Resolve a Douyin Mall product link and produce one editable AI-native-ad requirement draft.
      parameters: [{$ref: '#/components/parameters/ProjectID'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [product_link, supplemental_requirement]
              properties:
                product_link: {type: string, minLength: 1, maxLength: 16384}
                supplemental_requirement: {type: string, maxLength: 2000}
                channel: {type: string, enum: [douyin], default: douyin}
                aspect_ratio: {type: string, enum: ['9:16'], default: '9:16'}
                duration_seconds: {type: integer, minimum: 15, maximum: 30, default: 20}
                language: {type: string, enum: [zh-CN], default: zh-CN}
      responses:
        '200':
          description: Editable requirement-analysis draft; price and incomplete product facts remain explicitly unconfirmed.
          content:
            application/json:
              schema: {$ref: '../contracts/creative-ai-native-requirement-workspace-v1.schema.json'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '422': {description: The product link could not be resolved into usable commerce data.}
  /api/creative/v1/projects/{project_id}/ai-native-ads:latest:
    get:
      operationId: getLatestAINativeAdWorkspace
      summary: Restore the most recently updated AI-native-ad workspace for this project.
      parameters: [{$ref: '#/components/parameters/ProjectID'}]
      responses:
        '200':
          description: Most recently updated AI-native-ad workspace, including its current stage.
          content:
            application/json:
              schema: {$ref: '../contracts/creative-ai-native-requirement-workspace-v1.schema.json'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/creative/v1/projects/{project_id}/ai-native-ads/{workspace_id}:
    get:
      operationId: getAINativeAdRequirementWorkspace
      summary: Restore the latest persisted requirement revision and freeze state.
      parameters:
        - {$ref: '#/components/parameters/ProjectID'}
        - {name: workspace_id, in: path, required: true, schema: {type: string, minLength: 1}}
      responses:
        '200':
          description: Current AI-native-ad requirement workspace.
          content:
            application/json:
              schema: {$ref: '../contracts/creative-ai-native-requirement-workspace-v1.schema.json'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/creative/v1/projects/{project_id}/ai-native-ads/{workspace_id}/requirement:
    patch:
      operationId: updateAINativeAdRequirement
      summary: Append one immutable user-edited requirement revision with optimistic concurrency protection.
      parameters:
        - {$ref: '#/components/parameters/ProjectID'}
        - {name: workspace_id, in: path, required: true, schema: {type: string, minLength: 1}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_revision, product_name, product_description, target_audiences, media, core_selling_points, supplemental_requirement, aspect_ratio, duration_seconds, language]
              properties:
                expected_revision: {type: integer, minimum: 1}
                product_name: {type: string, minLength: 1}
                product_description: {type: string, minLength: 1}
                target_audiences: {type: array, minItems: 1, maxItems: 10, items: {$ref: '#/components/schemas/AINativeEditableText'}}
                media: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/AINativeRequirementMedia'}}
                core_selling_points: {type: array, minItems: 1, maxItems: 20, items: {$ref: '#/components/schemas/AINativeEditableText'}}
                supplemental_requirement: {type: string, maxLength: 2000}
                aspect_ratio: {const: '9:16'}
                duration_seconds: {type: integer, minimum: 15, maximum: 30}
                language: {const: zh-CN}
      responses:
        '200':
          description: Workspace pointing to the newly appended revision.
          content:
            application/json:
              schema: {$ref: '../contracts/creative-ai-native-requirement-workspace-v1.schema.json'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/creative/v1/projects/{project_id}/ai-native-ads/{workspace_id}/requirement:confirm:
    post:
      operationId: confirmAINativeAdRequirement
      summary: Freeze the current requirement revision before script generation.
      parameters:
        - {$ref: '#/components/parameters/ProjectID'}
        - {name: workspace_id, in: path, required: true, schema: {type: string, minLength: 1}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_revision]
              properties:
                expected_revision: {type: integer, minimum: 1}
      responses:
        '200':
          description: Workspace frozen at the requested current revision.
          content:
            application/json:
              schema: {$ref: '../contracts/creative-ai-native-requirement-workspace-v1.schema.json'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/creative/v1/projects/{project_id}/ai-native-ads/{workspace_id}/reopen-impact:
    get:
      operationId: getAINativeAdReopenImpact
      summary: Preview the immutable revisions and downstream resources invalidated by reopening a stage.
      parameters:
        - {$ref: '#/components/parameters/ProjectID'}
        - {name: workspace_id, in: path, required: true, schema: {type: string, minLength: 1}}
        - {name: stage, in: query, required: true, schema: {enum: [requirement, script, storyboard]}}
      responses:
        '200':
          description: Reopen impact calculated from current server state.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AINativeReopenImpact'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/creative/v1/projects/{project_id}/ai-native-ads/{workspace_id}/script:generate:
    post:
      operationId: generateAINativeAdScript
      summary: Start one durable generation operation that produces exactly one complete script draft.
      parameters:
        - {$ref: '#/components/parameters/ProjectID'}
        - {name: workspace_id, in: path, required: true, schema: {type: string, minLength: 1}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AINativeScriptGenerationRequest'}
      responses:
        '202':
          description: Script generation was persisted and queued.
          content:
            application/json:
              schema: {$ref: '../contracts/creative-ai-native-requirement-workspace-v1.schema.json'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/creative/v1/projects/{project_id}/ai-native-ads/{workspace_id}/script:regenerate:
    post:
      operationId: regenerateAINativeAdScript
      summary: Start a durable full-script regeneration and preserve the previous revision lineage.
      parameters:
        - {$ref: '#/components/parameters/ProjectID'}
        - {name: workspace_id, in: path, required: true, schema: {type: string, minLength: 1}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AINativeScriptGenerationRequest'}
      responses:
        '202':
          description: Full-script regeneration was persisted and queued.
          content:
            application/json:
              schema: {$ref: '../contracts/creative-ai-native-requirement-workspace-v1.schema.json'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/creative/v1/projects/{project_id}/ai-native-ads/{workspace_id}/script:
    patch:
      operationId: updateAINativeAdScript
      summary: Append a user-edited script revision without overwriting prior revisions.
      parameters:
        - {$ref: '#/components/parameters/ProjectID'}
        - {name: workspace_id, in: path, required: true, schema: {type: string, minLength: 1}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_revision, script]
              properties:
                expected_revision: {type: integer, minimum: 1}
                script: {$ref: '../contracts/creative-ai-native-script-v1.schema.json'}
      responses:
        '200':
          description: Workspace pointing to the appended script revision.
          content:
            application/json:
              schema: {$ref: '../contracts/creative-ai-native-requirement-workspace-v1.schema.json'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/creative/v1/projects/{project_id}/ai-native-ads/{workspace_id}/script:confirm:
    post:
      operationId: confirmAINativeAdScript
      summary: Freeze the current complete script revision before storyboard generation.
      parameters:
        - {$ref: '#/components/parameters/ProjectID'}
        - {name: workspace_id, in: path, required: true, schema: {type: string, minLength: 1}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_revision, expected_workspace_version]
              properties:
                expected_revision: {type: integer, minimum: 1}
                expected_workspace_version: {type: integer, minimum: 1}
      responses:
        '200':
          description: Script revision is frozen.
          content:
            application/json:
              schema: {$ref: '../contracts/creative-ai-native-requirement-workspace-v1.schema.json'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/creative/v1/projects/{project_id}/ai-native-ads/{workspace_id}/script:reopen:
    post:
      operationId: reopenAINativeAdScript
      summary: Append a new editable script revision and invalidate its downstream state.
      parameters:
        - {$ref: '#/components/parameters/ProjectID'}
        - {name: workspace_id, in: path, required: true, schema: {type: string, minLength: 1}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_workspace_version, invalidate_downstream]
              properties:
                expected_workspace_version: {type: integer, minimum: 1}
                invalidate_downstream: {const: true}
      responses:
        '200':
          description: Script reopened as a new draft revision.
          content:
            application/json:
              schema: {$ref: '../contracts/creative-ai-native-requirement-workspace-v1.schema.json'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/creative/v1/projects/{project_id}/ai-native-ads/{workspace_id}/requirement:reopen:
    post:
      operationId: reopenAINativeAdRequirement
      summary: Append a new editable requirement revision and atomically supersede current downstream state.
      parameters:
        - {$ref: '#/components/parameters/ProjectID'}
        - {name: workspace_id, in: path, required: true, schema: {type: string, minLength: 1}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_workspace_version, invalidate_downstream]
              properties:
                expected_workspace_version: {type: integer, minimum: 1}
                invalidate_downstream: {const: true}
      responses:
        '200':
          description: Workspace restored to requirement draft with a new immutable revision.
          content:
            application/json:
              schema: {$ref: '../contracts/creative-ai-native-requirement-workspace-v1.schema.json'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/creative/v1/projects/{project_id}/ai-native-ads/{workspace_id}/storyboard:generate:
    post:
      operationId: generateAINativeAdStoryboard
      summary: Generate and durably prepare a complete storyboard from the confirmed script.
      parameters: [{$ref: '#/components/parameters/ProjectID'}, {name: workspace_id, in: path, required: true, schema: {type: string, minLength: 1}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AINativeStoryboardGenerationRequest'}}}}
      responses: {'202': {description: Storyboard and image preparation operation queued.}, '409': {$ref: '#/components/responses/Conflict'}}
  /api/creative/v1/projects/{project_id}/ai-native-ads/{workspace_id}/storyboard:
    patch:
      operationId: updateAINativeAdStoryboard
      summary: Append a complete user-edited storyboard revision.
      parameters: [{$ref: '#/components/parameters/ProjectID'}, {name: workspace_id, in: path, required: true, schema: {type: string, minLength: 1}}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, additionalProperties: false, required: [expected_revision, storyboard], properties: {expected_revision: {type: integer, minimum: 1}, storyboard: {$ref: '../contracts/creative-ai-native-storyboard-v1.schema.json'}}}}}
      responses: {'200': {description: Storyboard revision appended.}, '409': {$ref: '#/components/responses/Conflict'}}
  /api/creative/v1/projects/{project_id}/ai-native-ads/{workspace_id}/storyboard:confirm:
    post:
      operationId: confirmAINativeAdStoryboard
      summary: Freeze a ready storyboard before video production.
      parameters: [{$ref: '#/components/parameters/ProjectID'}, {name: workspace_id, in: path, required: true, schema: {type: string, minLength: 1}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [expected_revision, expected_workspace_version], properties: {expected_revision: {type: integer, minimum: 1}, expected_workspace_version: {type: integer, minimum: 1}}}}}}
      responses: {'200': {description: Storyboard revision frozen.}, '409': {$ref: '#/components/responses/Conflict'}}
  /api/creative/v1/projects/{project_id}/ai-native-ads/{workspace_id}/storyboard:reopen:
    post:
      operationId: reopenAINativeAdStoryboard
      summary: Append an editable storyboard revision and invalidate downstream video state.
      parameters: [{$ref: '#/components/parameters/ProjectID'}, {name: workspace_id, in: path, required: true, schema: {type: string, minLength: 1}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [expected_workspace_version, invalidate_downstream], properties: {expected_workspace_version: {type: integer, minimum: 1}, invalidate_downstream: {const: true}}}}}}
      responses: {'200': {description: Storyboard reopened as a new draft revision.}, '409': {$ref: '#/components/responses/Conflict'}}
  /api/creative/v1/projects/{project_id}/ai-native-ads/{workspace_id}/storyboard/assets/{asset_id}/regenerate:
    post:
      operationId: regenerateAINativeAdStoryboardAsset
      summary: Regenerate one AI-created storyboard asset with optional user feedback.
      parameters: [{$ref: '#/components/parameters/ProjectID'}, {name: workspace_id, in: path, required: true, schema: {type: string, minLength: 1}}, {name: asset_id, in: path, required: true, schema: {type: string, minLength: 1}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [expected_workspace_version], properties: {expected_workspace_version: {type: integer, minimum: 1}, feedback: {type: string, maxLength: 500}}}}}}
      responses: {'202': {description: Selected storyboard asset regeneration queued.}, '409': {$ref: '#/components/responses/Conflict'}}
  /api/creative/v1/projects/{project_id}/ai-native-ads/{workspace_id}/storyboard/voiceover:fit:
    post:
      operationId: suggestAINativeAdVoiceoverFit
      summary: Generate a shorter voiceover suggestion for one failed speech Unit without mutating the storyboard.
      parameters: [{$ref: '#/components/parameters/ProjectID'}, {name: workspace_id, in: path, required: true, schema: {type: string, minLength: 1}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [expected_workspace_version, speech_unit_id], properties: {expected_workspace_version: {type: integer, minimum: 1}, speech_unit_id: {type: string, minLength: 1}}}}}}
      responses:
        '200':
          description: A duration-safe voiceover suggestion for explicit user review.
          content: {application/json: {schema: {type: object, additionalProperties: false, required: [shot_id, original_voiceover, suggested_voiceover, duration_ms, max_characters, prompt_version, model_alias, model_version], properties: {shot_id: {type: string}, original_voiceover: {type: string}, suggested_voiceover: {type: string}, duration_ms: {type: integer}, max_characters: {type: integer}, prompt_version: {type: string}, model_alias: {type: string}, model_version: {type: string}, route_revision_id: {type: string}}}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/creative/v1/projects/{project_id}/ai-native-ads/{workspace_id}/production:start:
    post:
      operationId: startAINativeAdProduction
      summary: Freeze the confirmed storyboard into recoverable video and speech generation units and queue production.
      parameters: [{$ref: '#/components/parameters/ProjectID'}, {name: workspace_id, in: path, required: true, schema: {type: string, minLength: 1}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [expected_workspace_version], properties: {expected_workspace_version: {type: integer, minimum: 1}}}}}}
      responses:
        '202': {description: Production plan persisted and queued., content: {application/json: {schema: {$ref: '../contracts/creative-ai-native-requirement-workspace-v1.schema.json'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/creative/v1/projects/{project_id}/ai-native-ads/{workspace_id}/production/units/{unit_id}/retry:
    post:
      operationId: retryAINativeAdProductionUnit
      summary: Append one Attempt to the failed Unit without re-running successful Units.
      parameters: [{$ref: '#/components/parameters/ProjectID'}, {name: workspace_id, in: path, required: true, schema: {type: string, minLength: 1}}, {name: unit_id, in: path, required: true, schema: {type: string, minLength: 1}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [expected_workspace_version], properties: {expected_workspace_version: {type: integer, minimum: 1}}}}}}
      responses: {'202': {description: Local Unit retry queued.}, '409': {$ref: '#/components/responses/Conflict'}}
  /api/creative/v1/projects/{project_id}/ai-native-ads/{workspace_id}/production:cancel:
    post:
      operationId: cancelAINativeAdProduction
      summary: Best-effort cancel the active production operation while preserving completed assets.
      parameters: [{$ref: '#/components/parameters/ProjectID'}, {name: workspace_id, in: path, required: true, schema: {type: string, minLength: 1}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [expected_workspace_version], properties: {expected_workspace_version: {type: integer, minimum: 1}}}}}}
      responses: {'200': {description: Production marked cancelled.}, '409': {$ref: '#/components/responses/Conflict'}}
  /api/creative/v1/projects/{project_id}/creative-tasks/{task_id}/game-preroll:prepare-evidence:
    post:
      operationId: prepareGamePrerollEvidence
      summary: Extract the three verified gameplay evidence frames and persist their source-video lineage.
      parameters: [{$ref: '#/components/parameters/ProjectID'}, {$ref: '#/components/parameters/TaskID'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_revision]
              properties:
                expected_revision: {type: integer, minimum: 1}
      responses:
        '200': {description: Workspace upgraded to game-preroll draft v2 with stable evidence image assets.}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/creative/v1/projects/{project_id}/creative-workspaces/brand-film:ensure-fixture:
    post:
      operationId: ensureBrandFilmFixtureWorkspace
      summary: Idempotently materialize the Guerlain brand-film development fixture as a durable Creative workspace.
      parameters:
        - {$ref: '#/components/parameters/ProjectID'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '200': {description: Existing or newly materialized Phase 0 brand-film workspace.}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/creative/v1/projects/{project_id}/creative-workspaces/brand-film:
    get:
      operationId: getLatestBrandFilmWorkspace
      summary: Restore the latest durable brand-film workspace in the Project.
      parameters: [{$ref: '#/components/parameters/ProjectID'}]
      responses:
        '200': {description: Latest task, intake, and versioned brand-film draft.}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/creative/v1/projects/{project_id}/creative-tasks/{task_id}/brand-film:
    get:
      operationId: getBrandFilmWorkspace
      summary: Read one brand-film workspace by CreativeTask ID.
      parameters:
        - {$ref: '#/components/parameters/ProjectID'}
        - {$ref: '#/components/parameters/TaskID'}
      responses:
        '200': {description: Versioned Phase 0-2 brand-film workspace.}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/creative/v1/projects/{project_id}/creative-tasks/{task_id}/brand-film:initialize-from-strategy:
    post:
      operationId: initializeStrategyBrandFilmWorkspace
      summary: Idempotently upgrade a pre-workspace Strategy brand task using its confirmed Brief and direction lineage.
      parameters:
        - {$ref: '#/components/parameters/ProjectID'}
        - {$ref: '#/components/parameters/TaskID'}
      responses:
        '200': {description: Existing or newly initialized Strategy brand-film workspace.}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/creative/v1/projects/{project_id}/creative-tasks/{task_id}/brand-film:analyze-brief:
    post:
      operationId: analyzeBrandFilmBrief
      summary: Append an editable, evidence-aware Brief analysis revision.
      parameters: [{$ref: '#/components/parameters/ProjectID'}, {$ref: '#/components/parameters/TaskID'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/BrandFilmRevision'}
      responses:
        '200': {description: Workspace at brief_analysis_draft.}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/creative/v1/projects/{project_id}/creative-tasks/{task_id}/brand-film/brief:
    patch:
      operationId: updateBrandFilmBrief
      summary: Persist a user-edited Brief as a new revision and invalidate every downstream artifact that depended on the prior confirmed revision.
      parameters: [{$ref: '#/components/parameters/ProjectID'}, {$ref: '#/components/parameters/TaskID'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_revision, analysis]
              properties:
                expected_revision: {type: integer, minimum: 1}
                analysis: {type: object, description: BrandBriefAnalysisVersion; see creative-brand-film-draft-v1.schema.json.}
      responses:
        '200': {description: Workspace with a new editable Brief revision.}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/creative/v1/projects/{project_id}/creative-tasks/{task_id}/brand-film:confirm-brief:
    post:
      operationId: confirmBrandFilmBrief
      summary: Confirm the current Brief after explicit product-front and brand-logo reference approval.
      parameters: [{$ref: '#/components/parameters/ProjectID'}, {$ref: '#/components/parameters/TaskID'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/BrandFilmRevision'}
      responses:
        '200': {description: Workspace at brief_confirmed.}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/creative/v1/projects/{project_id}/creative-tasks/{task_id}/brand-film:generate-concepts:
    post:
      operationId: generateBrandFilmConcepts
      summary: Generate two or three differentiated creative directions from the confirmed Brief.
      parameters: [{$ref: '#/components/parameters/ProjectID'}, {$ref: '#/components/parameters/TaskID'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/BrandFilmRevision'}
      responses:
        '200': {description: Workspace at concept_selection; no direction is auto-selected.}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/creative/v1/projects/{project_id}/creative-tasks/{task_id}/brand-film:select-concept:
    post:
      operationId: selectBrandFilmConcept
      summary: Human-select and freeze one creative direction.
      parameters: [{$ref: '#/components/parameters/ProjectID'}, {$ref: '#/components/parameters/TaskID'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_revision, concept_id]
              properties:
                expected_revision: {type: integer, minimum: 1}
                concept_id: {type: string, minLength: 1}
      responses:
        '200': {description: Workspace at concept_confirmed.}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/creative/v1/projects/{project_id}/creative-tasks/{task_id}/brand-film/concepts:
    patch:
      operationId: updateBrandFilmConcepts
      summary: Persist human edits as a new creative-direction set and invalidate downstream selection, plan, generation, quality, and delivery state.
      parameters: [{$ref: '#/components/parameters/ProjectID'}, {$ref: '#/components/parameters/TaskID'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_revision, candidates]
              properties:
                expected_revision: {type: integer, minimum: 1}
                candidates:
                  type: array
                  minItems: 2
                  maxItems: 3
                  items: {type: object, description: BrandCreativeConcept; see creative-brand-film-draft-v1.schema.json.}
      responses:
        '200': {description: Workspace with a new editable concept-set revision and no selected direction.}
        '409': {$ref: '#/components/responses/Conflict'}
