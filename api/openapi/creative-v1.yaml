        asset_ref: {$ref: '#/components/schemas/AssetVersionRef'}
    LastFrameConditioningAsset:
      type: object
      additionalProperties: false
      required: [role, asset_ref]
      properties:
        role: {const: last_frame}
        asset_ref: {$ref: '#/components/schemas/AssetVersionRef'}
    VideoGenerationApproval:
      type: object
      additionalProperties: false
      required: [contract_version, task_id, generation_spec_hash, confirmed_items, confirmed_by, confirmed_at]
      properties:
        contract_version: {const: creative-generation-approval/v1}
        task_id: {type: string, minLength: 1}
        generation_spec_hash: {$ref: '#/components/schemas/SHA256Ref'}
        confirmed_items:
          type: array
          minItems: 6
          maxItems: 6
          uniqueItems: true
          items: {enum: [product, template, motion, result, prompt, paid_generation]}
        confirmed_by: {type: string, minLength: 1}
        confirmed_at: {type: string, format: date-time}
    SHA256Ref:
      type: string
      pattern: '^sha256:[a-f0-9]{64}$'
    BindImageAssetRequest:
      type: object
      additionalProperties: false
      required: [expected_draft_version, image_plan_order, asset_ref]
      properties:
        expected_draft_version: {type: integer, minimum: 1}
        image_plan_order: {type: integer, minimum: 1, maximum: 12}
        asset_ref:
          type: object
          additionalProperties: false
          required: [asset_id, version]
          properties:
            asset_id: {type: string, minLength: 1}
            version: {type: integer, minimum: 1}
    ReviseCreativeDraftRequest:
      type: object
      additionalProperties: false
      required: [expected_version, title_candidates, body, topics, cover_copy, image_plan]
      properties:
        expected_version: {type: integer, minimum: 1}
        title_candidates: {type: array, minItems: 3, maxItems: 8, items: {type: string, minLength: 1, maxLength: 80}}
        body: {type: string, minLength: 1, maxLength: 5000}
        topics: {type: array, maxItems: 12, items: {type: string, minLength: 1, maxLength: 80}}
        cover_copy: {type: string, minLength: 1, maxLength: 30}
        image_plan:
          type: array
          minItems: 1
          maxItems: 12
          items: {$ref: '#/components/schemas/ImagePlanItem'}
    ImagePlanItem:
      type: object
      additionalProperties: false
      required: [order, purpose, visual_brief, caption]
      properties:
        order: {type: integer, minimum: 1}
        purpose: {type: string, minLength: 1}
        visual_brief: {type: string, minLength: 1}
        caption: {type: string, minLength: 1}
        asset_ref:
          type: object
          additionalProperties: false
          required: [asset_id, version]
          properties:
            asset_id: {type: string, minLength: 1}
            version: {type: integer, minimum: 1}
  responses:
    InvalidRequest: {description: The request violates the Creative API contract.}
    Conflict: {description: "The resource state, scope, or idempotency key conflicts with the request."}
    NotFound: {description: The scoped resource does not exist.}
    ProjectAccessDenied: {description: The caller cannot access this Project.}
    ProductionInvalidCursor:
      description: The production cursor is malformed, unsupported, or does not match the current query.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ProductionProblem'}
          example:
            contract_version: creative-production-problem/v1
            code: PRODUCTION_CURSOR_INVALID
            message: The production cursor cannot be used for this query.
            retryable: false
            source_task: null
    ProductionRunNotFound:
      description: The production run does not exist in the authorized Project and source.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ProductionProblem'}
          example:
            contract_version: creative-production-problem/v1
            code: PRODUCTION_RUN_NOT_FOUND
            message: The production run does not exist in this Project.
            retryable: false
            source_task: null
    ProductionSourceUnavailable:
      description: A required production owner adapter is temporarily unavailable.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ProductionProblem'}
          example:
            contract_version: creative-production-problem/v1
            code: PRODUCTION_SOURCE_UNAVAILABLE
            message: A production source is temporarily unavailable.
            retryable: true
            source_task: null
    ProductionRetryConflict:
      description: The owner workflow rejected retry because state, immutable inputs, or idempotency did not permit it.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ProductionProblem'}
          examples:
            notAllowed:
              value:
                contract_version: creative-production-problem/v1
                code: PRODUCTION_RETRY_NOT_ALLOWED
                message: The current owner state does not allow retry.
                retryable: false
                source_task: null
            sourceWorkflowRequired:
              value:
                contract_version: creative-production-problem/v1
                code: PRODUCTION_RETRY_REQUIRES_SOURCE_WORKFLOW
                message: Return to the source task to restore required inputs before retrying.
                retryable: false
                source_task:
                  system: creative
                  object_type: creative_task
                  object_id: creative_task_01
                  display_name: 白金眼霜电商前贴
            inputUnavailable:
              value:
                contract_version: creative-production-problem/v1
                code: PRODUCTION_INPUT_ASSET_UNAVAILABLE
                message: An immutable input AssetVersion is no longer available for this use.
                retryable: false
                source_task: null
            idempotencyConflict:
              value:
                contract_version: creative-production-problem/v1
                code: PRODUCTION_IDEMPOTENCY_CONFLICT
                message: The Idempotency-Key was already used for a different retry request.
                retryable: false
                source_task: null
