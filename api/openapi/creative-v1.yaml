      parameters:
        - {$ref: '#/components/parameters/ProjectID'}
        - name: intake_id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Latest persisted candidate batch with authoritative lifecycle statuses.
          content:
            application/json:
              schema: {$ref: '../contracts/creative-direction-candidate-batch-v1.schema.json'}
        '403': {$ref: '#/components/responses/ProjectAccessDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/creative/v1/projects/{project_id}/creative-directions/{direction_id}/confirm:
    post:
      operationId: confirmCreativeDirection
      summary: Confirm one CreativeDirection and supersede competing candidates for the same intake.
      parameters:
        - {$ref: '#/components/parameters/ProjectID'}
        - name: direction_id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Confirmed immutable CreativeDirection version.
          content:
            application/json:
              schema: {$ref: '../contracts/creative-direction-v1.schema.json'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/creative/v1/projects/{project_id}/business-capabilities:
    get:
      operationId: listCreativeBusinessCapabilities
      summary: List Creative-owned task-strategy handoff and production readiness for each business.
      parameters: [{$ref: '#/components/parameters/ProjectID'}]
      responses:
        '200':
          description: Capability states used to gate Strategy handoff actions.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/CreativeBusinessCapability'}
        '403': {$ref: '#/components/responses/ProjectAccessDenied'}
  /api/creative/v1/projects/{project_id}/creative-intakes/{intake_id}:create-task:
    post:
      operationId: createCreativeTask
      summary: Create one explicitly directed image-and-text CreativeTask from a ready Intake.
      parameters: [{$ref: '#/components/parameters/ProjectID'}, {$ref: '#/components/parameters/IntakeID'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateCreativeTaskRequest'}
      responses:
        '201': {description: Image and text CreativeTask created with an initial draft.}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/creative/v1/projects/{project_id}/creative-intakes/{intake_id}:create-video-task:
    post:
      operationId: createCreativePreRollVideoTask
      summary: Confirm an approved video route and create or resume one CreativeTask, including a BrandFilm workspace for brand_video.
      parameters: [{$ref: '#/components/parameters/ProjectID'}, {$ref: '#/components/parameters/IntakeID'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateVideoTaskRequest'}
      responses:
        '201': {description: Video CreativeTask and immutable Strategy route snapshot created.}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/creative/v1/projects/{project_id}/creative-tasks:
    get:
      operationId: listCreativeTasks
      summary: List CreativeTasks in the scoped Project.
      parameters: [{$ref: '#/components/parameters/ProjectID'}]
      responses:
        '200': {description: Scoped CreativeTasks.}
        '403': {$ref: '#/components/responses/ProjectAccessDenied'}
  /api/creative/v1/projects/{project_id}/creative-tasks/{task_id}:
    get:
      operationId: getCreativeTask
      summary: Get a CreativeTask with its content draft and production lineage.
      parameters: [{$ref: '#/components/parameters/ProjectID'}, {$ref: '#/components/parameters/TaskID'}]
      responses:
        '200': {description: "Task, source Intake, draft and production lineage."}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      operationId: archiveCreativeTask
      summary: Archive a CreativeTask from the active queue without deleting its draft, version, Provider or Asset lineage.
      parameters: [{$ref: '#/components/parameters/ProjectID'}, {$ref: '#/components/parameters/TaskID'}]
      responses:
        '204': {description: CreativeTask archived.}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/creative/v1/projects/{project_id}/creative-tasks/{task_id}/image-text-workspace:
    get:
      operationId: getCreativeImageTextWorkspace
      summary: Read the Strategy-to-Creative image-text workspace without advancing generation state.
      parameters: [{$ref: '#/components/parameters/ProjectID'}, {$ref: '#/components/parameters/TaskID'}]
      responses:
        '200':
          description: Image-text draft, three independently generated slots, selections and readiness.
          content:
            application/json:
              schema: {$ref: '../contracts/creative-image-text-workspace-v1.schema.json'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/creative/v1/projects/{project_id}/creative-tasks/{task_id}/image-text-draft:generate:
    post:
      operationId: generateCreativeImageTextDraft
      summary: Generate the v2 copy and three-slot plan from the confirmed Creative Direction.
      parameters: [{$ref: '#/components/parameters/ProjectID'}, {$ref: '#/components/parameters/TaskID'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_task_version, expected_direction_id]
              properties:
                expected_task_version: {type: integer, minimum: 1}
                expected_direction_id: {type: string, minLength: 1}
      responses:
        '200':
          description: Newly persisted v2 image-text draft.
          content:
            application/json:
              schema: {$ref: '../contracts/creative-image-text-draft-v2.schema.json'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/creative/v1/projects/{project_id}/creative-tasks/{task_id}/image-text-draft:
    patch:
      operationId: updateCreativeImageTextDraft
      summary: Save copy and slot edits as the next immutable v2 draft revision before generation starts.
      parameters: [{$ref: '#/components/parameters/ProjectID'}, {$ref: '#/components/parameters/TaskID'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_task_version, expected_draft_revision, title_candidates, selected_title, body, topics, image_plan]
              properties:
                expected_task_version: {type: integer, minimum: 1}
                expected_draft_revision: {type: integer, minimum: 1}
                title_candidates: {type: array, minItems: 3, maxItems: 3, items: {type: string, minLength: 1, maxLength: 80}}
                selected_title: {type: string, minLength: 1, maxLength: 80}
                body: {type: string, minLength: 1, maxLength: 5000}
                topics: {type: array, maxItems: 12, items: {type: string, minLength: 1, maxLength: 80}}
                image_plan:
                  type: array
                  minItems: 3
                  maxItems: 3
                  items: {$ref: '#/components/schemas/ImagePlanItemV2'}
      responses:
        '200':
          description: Newly persisted authoring revision.
          content:
            application/json:
              schema: {$ref: '../contracts/creative-image-text-draft-v2.schema.json'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/creative/v1/projects/{project_id}/creative-tasks/{task_id}/image-slots/{order}:generate:
    post:
      operationId: generateCreativeImageTextSlot
      summary: Compile an immutable prompt package and start one portrait base-image attempt.
      parameters:
        - {$ref: '#/components/parameters/ProjectID'}
        - {$ref: '#/components/parameters/TaskID'}
        - {$ref: '#/components/parameters/ImageSlotOrder'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PrepareImageSlotRequest'}
      responses:
        '202': {description: Image attempt and Provider job accepted.}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/creative/v1/projects/{project_id}/creative-tasks/{task_id}/image-slots/{order}:retry:
    post:
      operationId: retryCreativeImageTextSlot
      summary: Start a new attempt for one slot without recreating the other slots.
      parameters:
        - {$ref: '#/components/parameters/ProjectID'}
        - {$ref: '#/components/parameters/TaskID'}
        - {$ref: '#/components/parameters/ImageSlotOrder'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PrepareImageSlotRequest'}
      responses:
        '202': {description: Retry attempt and Provider job accepted.}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/creative/v1/projects/{project_id}/creative-tasks/{task_id}/image-slots/{order}/attempts/{attempt_id}:adopt:
    post:
      operationId: adoptCreativeImageTextAttempt
      summary: Adopt one succeeded attempt for a slot using optimistic concurrency.
      parameters:
        - {$ref: '#/components/parameters/ProjectID'}
        - {$ref: '#/components/parameters/TaskID'}
        - {$ref: '#/components/parameters/ImageSlotOrder'}
        - name: attempt_id
          in: path
          required: true
          schema: {type: string, minLength: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_task_version, expected_selection_version]
              properties:
                expected_task_version: {type: integer, minimum: 1}
                expected_selection_version: {type: integer, minimum: 0}
      responses:
        '200':
          description: Updated slot selection.
          content:
            application/json:
              schema: {$ref: '../contracts/creative-image-slot-selection-v1.schema.json'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/creative/v1/projects/{project_id}/creative-tasks/{task_id}/viral-remake:
    get:
      operationId: getCreativeViralRemakeWorkspace
      summary: Restore the persisted viral-remake task, immutable manual input snapshot, readiness and production lineage.
      parameters: [{$ref: '#/components/parameters/ProjectID'}, {$ref: '#/components/parameters/TaskID'}]
      responses:
        '200':
          description: Restorable viral-remake workspace.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CreativeTaskDetail'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/creative/v1/projects/{project_id}/creative-tasks/{task_id}/viral-remake:analyze-reference:
    post:
      operationId: analyzeCreativeViralRemakeReference
      summary: Derive audio and keyframes, analyze the reference through the Provider boundary, and persist an immutable five-dimension snapshot.
      parameters: [{$ref: '#/components/parameters/ProjectID'}, {$ref: '#/components/parameters/TaskID'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '200':
          description: AnalysisSnapshot and editable PromptDraft persisted as the next draft revision.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CreativeTaskDetail'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/creative/v1/projects/{project_id}/creative-tasks/{task_id}/viral-remake/prompt-draft:
    patch:
      operationId: updateCreativeViralRemakePrompt
      summary: Persist edits to all five prompt dimensions using optimistic revision control.
      parameters: [{$ref: '#/components/parameters/ProjectID'}, {$ref: '#/components/parameters/TaskID'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateViralPromptRequest'}
      responses:
        '200': {description: Editable prompt persisted as the next draft revision.}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/creative/v1/projects/{project_id}/creative-tasks/{task_id}/viral-remake:confirm-generation:
    post:
      operationId: confirmCreativeViralRemakeGeneration
      summary: Explicitly confirm reference rights and freeze an immutable PromptPackage for generation.
      parameters: [{$ref: '#/components/parameters/ProjectID'}, {$ref: '#/components/parameters/TaskID'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConfirmViralGenerationRequest'}
      responses:
        '200': {description: PromptPackage frozen and generation readiness enabled.}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/creative/v1/projects/{project_id}/creative-tasks/{task_id}/viral-remake/candidates/{candidate_id}:submit-review:
    post:
      operationId: submitCreativeViralRemakeCandidateReview
      summary: Submit a successfully ingested candidate after all minimum lineage and rights checks pass.
      parameters:
        - {$ref: '#/components/parameters/ProjectID'}
        - {$ref: '#/components/parameters/TaskID'}
        - name: candidate_id
          in: path
          required: true
          schema: {type: string, minLength: 1}
      responses:
        '200': {description: Candidate marked reviewed and the task made ready for review.}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/creative/v1/projects/{project_id}/creative-tasks/{task_id}:draft:
    patch:
      operationId: reviseCreativeDraft
      summary: Replace the editable draft contents and create its next revision.
      parameters: [{$ref: '#/components/parameters/ProjectID'}, {$ref: '#/components/parameters/TaskID'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReviseCreativeDraftRequest'}
      responses:
        '200': {description: Next ImageTextDraft revision created.}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/creative/v1/projects/{project_id}/creative-tasks/{task_id}:cover-image-job:
    post:
      operationId: createCreativeCoverImageJob
      summary: Create a Provider cover-image job for a CreativeTask.
      parameters: [{$ref: '#/components/parameters/ProjectID'}, {$ref: '#/components/parameters/TaskID'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                model_alias: {type: string, minLength: 1, maxLength: 255}
      responses:
        '202': {description: Provider image job created with creative task lineage.}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/creative/v1/projects/{project_id}/creative-tasks/{task_id}:image-job:
    post:
      operationId: createCreativeImagePlanJob
      summary: Create one Provider job for one planned Xiaohongshu image; retries do not recreate the whole image group.
      parameters: [{$ref: '#/components/parameters/ProjectID'}, {$ref: '#/components/parameters/TaskID'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateImageJobRequest'}
      responses:
        '202': {description: Provider image job created with Creative image-plan lineage.}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/creative/v1/projects/{project_id}/creative-tasks/{task_id}:video-job:
    post:
      operationId: createCreativePreRollVideoJob
      summary: Create a Provider video job through cookies.video.standard.
      parameters: [{$ref: '#/components/parameters/ProjectID'}, {$ref: '#/components/parameters/TaskID'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateVideoJobRequest'}
      responses:
        '202': {description: Provider video job created and registered to the CreativeTask.}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/creative/v1/projects/{project_id}/creative-tasks/{task_id}:render-preroll:
    post:
      operationId: createCreativePreRollRenderJob
      summary: Compose the generated pre-roll before the authorized main video.
      parameters: [{$ref: '#/components/parameters/ProjectID'}, {$ref: '#/components/parameters/TaskID'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false}
      responses:
        '202': {description: Durable FFmpeg render job accepted.}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/creative/v1/projects/{project_id}/creative-render-jobs/{render_job_id}:
    get:
      operationId: getCreativeRenderJob
      summary: Get a durable pre-roll render job and its output Asset reference.
      parameters: [{$ref: '#/components/parameters/ProjectID'}, {$ref: '#/components/parameters/RenderJobID'}]
      responses:
        '200': {description: Render job state and immutable input/output lineage.}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/creative/v1/projects/{project_id}/creative-tasks/{task_id}:bind-image-asset:
    post:
      operationId: bindCreativeImageAsset
      summary: Bind one ready Asset version in the same Project to one planned image, creating the next Draft revision.
      parameters: [{$ref: '#/components/parameters/ProjectID'}, {$ref: '#/components/parameters/TaskID'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BindImageAssetRequest'}
      responses:
        '200': {description: Next ImageTextDraft revision with the AssetVersionRef bound.}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/creative/v1/projects/{project_id}/creative-tasks/{task_id}:freeze-version:
    post:
      operationId: freezeCreativeVersion
      summary: Freeze one draft revision into an immutable CreativeVersion.
      parameters: [{$ref: '#/components/parameters/ProjectID'}, {$ref: '#/components/parameters/TaskID'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FreezeCreativeVersionRequest'}
      responses:
        '201': {description: Immutable CreativeVersion created.}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/creative/v1/projects/{project_id}/creative-versions/{version_id}:check:
    post:
      operationId: checkCreativeVersion
      summary: Record deterministic Phase-1 delivery checks for a frozen CreativeVersion.
      parameters: [{$ref: '#/components/parameters/ProjectID'}, {$ref: '#/components/parameters/VersionID'}]
      responses: {'200': {description: Checked CreativeVersion.}, '409': {$ref: '#/components/responses/Conflict'}}
  /api/creative/v1/projects/{project_id}/creative-versions/{version_id}:approve:
    post:
      operationId: approveCreativeVersion
      summary: Approve a passing checked CreativeVersion and emit its approval event.
      parameters: [{$ref: '#/components/parameters/ProjectID'}, {$ref: '#/components/parameters/VersionID'}]
      responses: {'200': {description: Approved CreativeVersion.}, '409': {$ref: '#/components/responses/Conflict'}}
  /api/creative/v1/projects/{project_id}/creative-versions/{version_id}:deliver:
    post:
      operationId: deliverCreativeVersion
      summary: Create the stable CreativePackage for Delivery and Insights from an approved version.
      parameters: [{$ref: '#/components/parameters/ProjectID'}, {$ref: '#/components/parameters/VersionID'}]
      responses: {'200': {description: Stable CreativePackage created or replayed.}, '409': {$ref: '#/components/responses/Conflict'}}
  /api/creative/v1/projects/{project_id}/production-runs:
    get:
      operationId: listCreativeProductionRuns
      summary: List the current Project's Creative-owned generation and render run projections.
      description: >-
        Returns a read-only projection over Provider and Creative render owners.
        The projection never becomes the authority for job, asset, review,
        delivery, or Insights state. Results are ordered by created_at and run
        identity descending; next_cursor is opaque to callers.
      parameters:
        - {$ref: '#/components/parameters/ProjectID'}
        - name: media_kind
          in: query
          schema: {enum: [image, video, audio, render]}
        - name: status
          in: query
          style: form
          explode: false
          schema:
            type: array
            uniqueItems: true
            items: {enum: [queued, running, ingesting, succeeded, partially_succeeded, failed, expired, cancelled]}
        - name: source_task_id
          in: query
          schema: {type: string, minLength: 1, maxLength: 96}
        - name: created_after
          in: query
          schema: {type: string, format: date-time}
        - name: created_before
          in: query
          schema: {type: string, format: date-time}
        - name: q
          in: query
          description: Matches allowed run IDs, source task display names, and error codes; full prompts are never indexed here.
          schema: {type: string, minLength: 1, maxLength: 200}
        - {$ref: '#/components/parameters/ProductionCursor'}
        - {$ref: '#/components/parameters/ProductionLimit'}
      responses:
        '200':
          description: Project-scoped production runs plus per-source health.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProductionRunPage'}
              examples:
                partialSuccess:
                  externalValue: ../fixtures/creative-production-run-page-v1.json
        '400': {$ref: '#/components/responses/ProductionInvalidCursor'}
        '403': {$ref: '#/components/responses/ProjectAccessDenied'}
        '503': {$ref: '#/components/responses/ProductionSourceUnavailable'}
  /api/creative/v1/projects/{project_id}/production-runs/{production_source}/{production_run_id}:
    get:
      operationId: getCreativeProductionRun
      summary: Get one production run projection with safe inputs, outputs, lineage, cost, error, and run events.
      description: >-
        The response preserves native owner status and exposes only stable
        AssetVersion references and sanitized diagnostics. It never returns
        Provider credentials, external task identifiers, temporary output URLs,
        object-storage keys, or full prompts as ordinary diagnostics.
      parameters:
        - {$ref: '#/components/parameters/ProjectID'}
        - {$ref: '#/components/parameters/ProductionSource'}
        - {$ref: '#/components/parameters/ProductionRunID'}
      responses:
        '200':
          description: Safe detail for the scoped production run.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProductionRunDetail'}
              examples:
                failedEditingRender:
                  externalValue: ../fixtures/creative-production-run-detail-v1.json
        '403': {$ref: '#/components/responses/ProjectAccessDenied'}
        '404': {$ref: '#/components/responses/ProductionRunNotFound'}
        '503': {$ref: '#/components/responses/ProductionSourceUnavailable'}
  /api/creative/v1/projects/{project_id}/production-runs/{production_source}/{production_run_id}:retry:
    post:
      operationId: retryCreativeProductionRun
      summary: Delegate a retry to the Creative workflow that owns the failed production run.
      description: >-
        A retry always creates a new owner Attempt or RenderJob and preserves
        the previous run. The command must not create a bare Provider Job when
        the source workflow cannot prove immutable inputs and retry eligibility.
      parameters:
        - {$ref: '#/components/parameters/ProjectID'}
        - {$ref: '#/components/parameters/ProductionSource'}
        - {$ref: '#/components/parameters/ProductionRunID'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '202':
          description: Retry delegated and a new owner run accepted.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProductionRetryResult'}
              examples:
                editingRenderRetry:
                  externalValue: ../fixtures/creative-production-retry-v1.json
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '403': {$ref: '#/components/responses/ProjectAccessDenied'}
        '404': {$ref: '#/components/responses/ProductionRunNotFound'}
        '409': {$ref: '#/components/responses/ProductionRetryConflict'}
        '503': {$ref: '#/components/responses/ProductionSourceUnavailable'}
  /api/creative/v1/projects/{project_id}/production-assets:
    get:
      operationId: listCreativeProductionAssets
      summary: List stable AssetVersions referenced by the current Project's production runs.
      description: >-
        This is a production-lineage view, not a general asset library. It
        returns stable AssetVersion references and short-lived Assets previews,
        never copied binaries, Provider temporary URLs, or object-storage keys.
      parameters:
        - {$ref: '#/components/parameters/ProjectID'}
        - name: role
          in: query
          schema: {enum: [input, output]}
        - name: media_kind
          in: query
          schema: {enum: [image, video, audio]}
        - name: run_source
          in: query
          schema: {enum: [provider, creative_render, editing_render, audio_render]}
        - {$ref: '#/components/parameters/ProductionCursor'}
        - {$ref: '#/components/parameters/ProductionLimit'}
      responses:
        '200':
          description: Deduplicated production AssetVersions with run lineage.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProductionAssetPage'}
              examples:
                stableOutput:
                  externalValue: ../fixtures/creative-production-asset-page-v1.json
        '400': {$ref: '#/components/responses/ProductionInvalidCursor'}
        '403': {$ref: '#/components/responses/ProjectAccessDenied'}
        '503': {$ref: '#/components/responses/ProductionSourceUnavailable'}
components:
  requestBodies:
    BrandFilmRevision:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [expected_revision]
            properties:
              expected_revision: {type: integer, minimum: 1}
  securitySchemes:
    cookiesAuth: {type: http, scheme: bearer}
  parameters:
    ImageSlotOrder:
      name: order
      in: path
      required: true
      schema: {type: integer, minimum: 1, maximum: 3}
    ProjectID: {name: project_id, in: path, required: true, schema: {type: string, minLength: 1}}
    IntakeID: {name: intake_id, in: path, required: true, schema: {type: string, minLength: 1}}
    TaskID: {name: task_id, in: path, required: true, schema: {type: string, minLength: 1}}
    VersionID: {name: version_id, in: path, required: true, schema: {type: string, minLength: 1}}
    RenderJobID: {name: render_job_id, in: path, required: true, schema: {type: string, minLength: 1}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 255}}
    ProductionSource:
