        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                candidate_count: {type: integer, minimum: 2, maximum: 4, default: 3}
      responses:
        '202':
          description: Persisted generating batch. Poll the latest-batch endpoint until ready or failed.
          content:
            application/json:
              schema: {$ref: '../contracts/creative-direction-candidate-batch-v1.schema.json'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
